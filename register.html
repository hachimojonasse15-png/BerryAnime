<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BerryAnime - Registrar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#080808;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 18px;
}

.auth{
    width:100%;
    max-width:420px;
    text-align:center;
}

.logo{
    width:125px;
    height:125px;
    object-fit:contain;
    margin-bottom:12px;
}

.brand{
    font-size:36px;
    font-weight:900;
    margin-bottom:8px;
}

.berry{
    color:#ff1744;
}

.anime{
    color:white;
}

.subtitle{
    color:#999;
    font-size:14px;
    margin-bottom:30px;
}

.input{
    width:100%;
    height:56px;
    margin-bottom:13px;

    padding:0 16px;

    background:#151515;
    color:white;

    border:1px solid #303030;
    border-radius:12px;

    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#ff1744;
}

.register-button{
    width:100%;
    height:57px;

    border:0;
    border-radius:12px;

    background:#ff1744;
    color:white;

    font-size:16px;
    font-weight:bold;

    margin-top:5px;

    cursor:pointer;
}

.register-button:active{
    transform:scale(.98);
}

.message{
    display:none;
    margin-top:18px;
    font-size:14px;
}

.login-text{
    margin-top:25px;
    color:#888;
    font-size:14px;
}

.login-link,
.back{
    color:#ff1744;
    text-decoration:none;
    font-weight:bold;
}

.back{
    display:inline-block;
    margin-top:22px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="auth">

    <img
        src="BerryAnime_logo_leve.jpg"
        class="logo"
        alt="BerryAnime"
    >

    <div class="brand">
        <span class="berry">BERRY</span><span class="anime">ANIME</span>
    </div>

    <div class="subtitle">
        Crie sua conta
    </div>


    <form id="registerForm">

        <input
            id="nome"
            class="input"
            type="text"
            placeholder="Nome"
            autocomplete="name"
            required
        >

        <input
            id="email"
            class="input"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
            required
        >

        <input
            id="senha"
            class="input"
            type="password"
            placeholder="Senha"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <input
            id="confirmarSenha"
            class="input"
            type="password"
            placeholder="Confirmar senha"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button
            type="submit"
            class="register-button"
            id="registerButton">

            REGISTRAR

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="login-text">

        Já tem uma conta?

        <a
            href="login.html"
            class="login-link">

            Entrar

        </a>

    </div>


    <a
        href="index.html"
        class="back">

        ← Voltar

    </a>

</div>


<script type="module">

import {
    auth
} from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

const button =
    document.getElementById("registerButton");


function mostrarMensagem(
    texto,
    sucesso=false
){

    message.style.display = "block";

    message.textContent = texto;

    message.style.color =
        sucesso ? "#4cff88" : "#ff6b81";

}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const nome =
            document.getElementById("nome")
            .value
            .trim();


        const email =
            document.getElementById("email")
            .value
            .trim();


        const senha =
            document.getElementById("senha")
            .value;


        const confirmar =
            document.getElementById("confirmarSenha")
            .value;


        if(senha !== confirmar){

            mostrarMensagem(
                "As senhas não coincidem."
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "CRIANDO CONTA...";


        try{

            const resultado =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    senha
                );


            await updateProfile(
                resultado.user,
                {
                    displayName: nome
                }
            );


            mostrarMensagem(
                "Account created successfully.!",
                true
            );


            setTimeout(
                function(){

                    window.location.href =
                        "home.html";

                },
                2000
            );


        }catch(error){

            console.log(error);


            let texto =
                "Não foi possível criar a conta.";


            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                texto =
                    "Este e-mail já está registrado.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                texto =
                    "O e-mail não é válido.";

            }

            else if(
                error.code ===
                "auth/weak-password"
            ){

                texto =
                    "A senha deve ter pelo menos 6 caracteres.";

            }


            mostrarMensagem(texto);


            button.disabled = false;

            button.textContent =
                "REGISTRAR";

        }

    }
);

</script>

</body>
</html>

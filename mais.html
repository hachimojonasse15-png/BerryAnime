<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Mais</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

.content{
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:52px 23px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.berry-circle{
    width:88px;
    height:88px;
    border-radius:50%;
    border:2px solid #ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:30px;
    background:#111;
    box-shadow:0 0 18px rgba(255,23,68,.18);
}

.berry-circle img{
    width:70px;
    height:70px;
    object-fit:contain;
    display:block;
    mix-blend-mode:lighten;
}

.welcome{
    text-align:center;
    font-size:30px;
    font-weight:800;
    line-height:1.2;
    color:white;
    margin-bottom:8px;
}

.welcome .red{
    color:#ff1744;
}

.user-name{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:white;
    margin-top:25px;
}

.user-email{
    text-align:center;
    font-size:15px;
    color:#999;
    margin-top:7px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.menu-box{
    width:100%;
    margin-top:52px;
    background:#151515;
    border:1px solid #303030;
    border-radius:22px;
    overflow:hidden;
}

.menu-item{
    width:100%;
    min-height:98px;
    display:flex;
    align-items:center;
    padding:16px 30px;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
}

.menu-item + .menu-item{
    border-top:1px solid #303030;
}

.menu-item:active{
    background:#252525;
    transform:scale(.995);
}

.menu-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.menu-icon svg{
    width:30px;
    height:30px;
    stroke:#ff1744;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-text{
    margin-left:20px;
    min-width:0;
}

.menu-title{
    font-size:20px;
    font-weight:700;
    color:white;
}

.menu-sub{
    font-size:15px;
    color:#999;
    margin-top:6px;
}

.version{
    text-align:center;
    margin-top:47px;
    color:#777;
    font-size:15px;
    line-height:1.45;
}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-nav{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-nav svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-nav span{
    font-size:12px;
}

.menu-nav.active{
    color:white;
}

.menu-nav:active{
    color:white;
}

@media(max-width:600px){

    .content{
        padding-top:52px;
        padding-left:23px;
        padding-right:23px;
    }

    .berry-circle{
        width:88px;
        height:88px;
    }

    .berry-circle img{
        width:70px;
        height:70px;
    }

    .welcome{
        font-size:30px;
    }

    .user-name{
        font-size:20px;
    }

    .user-email{
        font-size:15px;
    }

    .menu-box{
        margin-top:52px;
    }

    .menu-item{
        min-height:98px;
        padding-left:30px;
        padding-right:20px;
    }

    .menu-title{
        font-size:20px;
    }

    .menu-sub{
        font-size:15px;
    }

    .bottom-menu{
        height:66px;
    }

    .menu-nav svg{
        width:20px;
        height:20px;
    }

    .menu-nav span{
        font-size:11px;
    }
}

@media(max-width:380px){

    .content{
        padding-top:40px;
        padding-left:16px;
        padding-right:16px;
    }

    .berry-circle{
        width:80px;
        height:80px;
        margin-bottom:25px;
    }

    .berry-circle img{
        width:63px;
        height:63px;
    }

    .welcome{
        font-size:26px;
    }

    .user-name{
        font-size:19px;
        margin-top:20px;
    }

    .user-email{
        font-size:14px;
    }

    .menu-box{
        margin-top:38px;
        border-radius:20px;
    }

    .menu-item{
        min-height:82px;
        padding-left:20px;
        padding-right:15px;
    }

    .menu-title{
        font-size:18px;
    }

    .menu-sub{
        font-size:13px;
    }

    .menu-text{
        margin-left:15px;
    }

    .menu-icon svg{
        width:28px;
        height:28px;
    }
}

</style>

</head>

<body>

<main class="content">

    <div class="berry-circle">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>

    <div class="welcome">
        Bem-vindo(a)
        <span class="red">de volta!</span>
    </div>

    <div
        id="userName"
        class="user-name">
        Carregando...
    </div>

    <div
        id="userEmail"
        class="user-email">
        ...
    </div>

    <div class="menu-box">

        <!-- MEU PERFIL -->

        <div
            class="menu-item"
            onclick="window.location.href='perfil.html'">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="7"
                        r="3.5">
                    </circle>

                    <path
                        d="M5 20c.5-3.5 3-6 7-6s6.5 2.5 7 6">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Meu perfil
                </div>

                <div class="menu-sub">
                    Gerencie seu perfil
                </div>

            </div>

        </div>


        <!-- CONFIGURAÇÕES -->

        <div
            class="menu-item"
            onclick="window.location.href='configuracoes.html'">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="3">
                    </circle>

                    <path
                        d="M19 13.5v-3l-2-.6a6.5 6.5 0 0 0-.7-1.6l.9-1.9-2.1-2.1-1.9.9a6.5 6.5 0 0 0-1.6-.7L11 2.5H8l-.6 2a6.5 6.5 0 0 0-1.6.7l-1.9-.9-2.1 2.1.9 1.9a6.5 6.5 0 0 0-.7 1.6l-2 .6v3l2 .6a6.5 6.5 0 0 0 .7 1.6l-.9 1.9 2.1 2.1 1.9-.9a6.5 6.5 0 0 0 1.6.7l.6 2h3l.6-2a6.5 6.5 0 0 0 1.6-.7l1.9.9 2.1-2.1-.9-1.9a6.5 6.5 0 0 0 .7-1.6z">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Configurações
                </div>

                <div class="menu-sub">
                    Ajustes do BerryAnime
                </div>

            </div>

        </div>


        <!-- HISTÓRICO -->

        <div
            class="menu-item"
            onclick="window.location.href='historico.html'">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="8">
                    </circle>

                    <path
                        d="M12 7v5l3 2">
                    </path>

                    <path
                        d="M4 5l-1 4 4 1">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Histórico
                </div>

                <div class="menu-sub">
                    Continue de onde parou
                </div>

            </div>

        </div>


        <!-- SAIR -->

        <div
            class="menu-item logout-item"
            id="logoutButton">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5">
                    </path>

                    <path
                        d="M14 8l5 4-5 4">
                    </path>

                    <path
                        d="M19 12H9">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Sair da conta
                </div>

                <div class="menu-sub">
                    Encerrar sessão no BerryAnime
                </div>

            </div>

        </div>

    </div>

    <div class="version">
        <div>BerryAnime</div>
        <div>VERSÃO 1.0</div>
    </div>

</main>


<!-- MENU INFERIOR -->

<div class="bottom-menu">

    <!-- INÍCIO -->

    <div
        class="menu-nav"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>

            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>


    <!-- MANGÁS -->

    <div
        class="menu-nav"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 4h7v16H4z"></path>

            <path d="M13 4h7v16h-7z"></path>

            <path d="M6 7h3M6 10h3M15 7h3M15 10h3"></path>

        </svg>

        <span>Mangás</span>

    </div>


    <!-- FAVORITOS -->

    <div
        class="menu-nav"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">

            <path
                d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>


    <!-- MAIS -->

    <div
        class="menu-nav active"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>

        </svg>

        <span>Mais</span>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.replace("index.html");

            return;
        }

        document
        .getElementById("userEmail")
        .textContent =
            user.email || "Sem e-mail";


        let nome = user.displayName;


        if(!nome && user.email){

            nome =
                user.email.split("@")[0];

        }


        document
        .getElementById("userName")
        .textContent =
            nome || "Usuário";

    }
);


document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function(){

        const confirmar =
            confirm(
                "Deseja sair da sua conta?"
            );

        if(!confirmar){
            return;
        }

        try{

            await signOut(auth);

            window.location.replace(
                "index.html"
            );

        }

        catch(error){

            console.error(error);

            alert(
                "Não foi possível sair da conta."
            );

        }

    }
);

</script>

</body>
      </html>

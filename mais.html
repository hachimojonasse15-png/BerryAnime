<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Mais</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#090909;
    color:white;
    padding-bottom:75px;
}


/* =====================================================
   TOPO
===================================================== */

.header{
    height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 15px;
}

.logo{
    width:42px;
    height:42px;

    border-radius:50%;
    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =====================================================
   CONTEÚDO
===================================================== */

.content{
    padding:10px 14px;
}


/* =====================================================
   BEM-VINDO
===================================================== */

.welcome{
    text-align:center;
    margin:5px 0 18px;
}

.welcome-icon{
    width:42px;
    height:42px;

    border-radius:50%;
    overflow:hidden;

    margin:0 auto 8px;
}

.welcome-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.welcome-title{
    font-size:18px;
    font-weight:700;
}

.welcome-sub{
    color:#999;
    font-size:12px;
    margin-top:5px;
}


/* =====================================================
   CONTA
===================================================== */

.account{
    width:100%;

    min-height:78px;

    background:#191919;

    border-radius:13px;

    padding:10px 12px;

    display:flex;
    align-items:center;

    margin-bottom:12px;
}


/* =====================================================
   AVATAR
===================================================== */

.avatar{
    width:58px;
    height:58px;

    flex-shrink:0;

    border-radius:50%;

    background:#303030;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:none;
}

.avatar-default{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar-default svg{
    width:32px;
    height:32px;

    stroke:#999;
    fill:none;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.account-info{
    flex:1;
    min-width:0;

    margin-left:12px;
}

.account-name{
    font-size:16px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.account-email{
    margin-top:4px;

    color:#999;
    font-size:12px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =====================================================
   OPÇÕES
===================================================== */

.menu-box{
    width:100%;

    background:#191919;

    border-radius:13px;

    padding:3px 0;

    margin-bottom:18px;
}

.menu-item{
    min-height:57px;

    display:flex;
    align-items:center;

    padding:7px 13px;

    cursor:pointer;

    transition:.15s;
}

.menu-item:active{
    background:#242424;
}

.menu-icon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.menu-icon svg{
    width:23px;
    height:23px;

    stroke:white;
    fill:none;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-text{
    margin-left:10px;
}

.menu-title{
    font-size:15px;
    font-weight:700;
}

.menu-sub{
    color:#999;
    font-size:11px;
    margin-top:3px;
}


/* =====================================================
   SAIR
===================================================== */

.logout-item{
    color:#ff1744;
}

.logout-item svg{
    stroke:#ff1744;
}


/* =====================================================
   RODAPÉ
===================================================== */

.footer{
    text-align:center;
    margin-top:25px;
}

.footer-brand{
    font-size:14px;
    font-weight:800;
}

.footer-brand .berry{
    color:#ff1744;
}

.footer-brand .anime{
    color:white;
}

.version{
    color:#777;
    font-size:11px;
    margin-top:5px;
}


/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:66px;

    background:#101010;

    border-top:1px solid #222;

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:100;
}

.menu-nav{
    flex:1;
    height:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    color:#777;

    cursor:pointer;

    font-size:11px;
}

.menu-nav svg{
    width:20px;
    height:20px;

    stroke:currentColor;
    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-nav.active{
    color:white;
}

.menu-nav span{
    font-size:11px;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-width:380px){

    .account-name{
        font-size:15px;
    }

    .account-email{
        font-size:11px;
    }

    .menu-title{
        font-size:14px;
    }

    .menu-sub{
        font-size:10px;
    }

}

</style>

</head>

<body>

===================================================== -->

<main class="content">

    <div class="welcome">

                src="BerryAnime_logo_leve.jpg"

        </div>

        <div
            id="welcomeEmail"

        </div>

    <div class="account">

                id="avatarImage"

                id="avatarDefault"
                class="avatar-default">

                <svg viewBox="0 0 24 24">

                    </circle>

                    <path

                class="account-email">

        </div>

    </div>

        <div

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle

                    </circle>

                    <path
                        d="M5 20c.5-3.5 3-6 7-6s6.5 2.5 7 6">
                    </path>

                </svg>

            </div>

                <div class="menu-title">
                    Meu perfil
                </div>

                <div class="menu-sub">

                </div>

            </div>

        </div>


        <!-- CONFIGURAÇÕES -->

        <div
            class="menu-item"
            onclick="configuracoes()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle

                    <path
                        d="M19 13.5v-3l-2-.6a6.5 6.5 0 0 0-.7-1.6l.9-1.9-2.1-2.1-1.9.9a6.5 6.5 0 0 0-1.6-.7L11 2.5H8l-.6 2a6.5 6.5 0 0 0-1.6.7l-1.9-.9-2.1 2.1.9 1.9a6.5 6.5 0 0 0-.7 1.6l-2 .6v3l2 .6a6.5 6.5 0 0 0 .7 1.6l-.9 1.9 2.1 2.1 1.9-.9a6.5 6.5 0 0 0 1.6.7l.6 2h3l.6-2a6.5 6.5 0 0 0 1.6-.7l1.9.9 2.1-2.1-.9-1.9a6.5 6.5 0 0 0 .7-1.6z">
                    </path>

        </div>


        <!-- HISTÓRICO -->

        <div

            </div>

                </div>

                </div>

        <!-- SAIR -->

        <div

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <path

                    </path>

                    <path
                        d="M14 8l5 4-5 4">
                    </path>

                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Sair da conta
                </div>

                    Encerrar sessão
                </div>

            </div>

        </div>

    </div>


    <!-- RODAPÉ -->

    <div class="footer">

        <div class="footer-brand">

            <span class="berry">BERRY</span><span class="anime">ANIME</span>

        </div>

        <div class="version">
            VERSÃO 1.0
        </div>

    </div>

</main>


<!-- =====================================================
     MENU INFERIOR
===================================================== -->

<nav class="bottom-menu">

    <div
        class="menu-nav"
        onclick="location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>

    <div

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   USUÁRIO
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        /* EMAIL */

        const email =
            user.email || "Sem e-mail";

        document
        .getElementById("accountEmail")
        .textContent =
            email;

        document
        .getElementById("welcomeEmail")
        .textContent =
            email;


        /* NOME */

        let nome =
            user.displayName;

        if(!nome && user.email){

            nome =
                user.email
                .split("@")[0];

        }

        document
        .getElementById("accountName")
        .textContent =
            nome || "Usuário";


        /* FOTO */

        if(user.photoURL){

            const imagem =
                document.getElementById(
                    "avatarImage"
                );

            imagem.src =
                user.photoURL;

            imagem.style.display =
                "block";

            document
            .getElementById(
                "avatarDefault"
            )
            .style.display =
                "none";

        }

    }
);


/* =====================================================
   SAIR
===================================================== */

window.sair =
async function(){

    if(!confirm(
        "Deseja sair da sua conta?"
    )){
        return;
    }

    try{

        await signOut(auth);

        window.location.href =
            "index.html";

    }

    catch(error){

        console.log(error);

        alert(
            "Não foi possível sair da conta."
        );

    }

};


/* =====================================================
   OPÇÕES
===================================================== */

window.editarPerfil =
function(){

    alert(
        "Meu perfil será adicionado no próximo passo."
    );

};


window.configuracoes =
function(){

    alert(
        "Configurações serão adicionadas no próximo passo."
    );

};


window.historico =
function(){

    alert(
        "Histórico será adicionado no próximo passo."
    );

};

</script>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Mais</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 50% 18%,
            rgba(255,23,68,.09) 0,
            rgba(255,23,68,0) 28%),
        #090b0f;

    color:white;

    padding-bottom:88px;

    overflow-x:hidden;
}


/* pequenos pontos decorativos */

body::before,
body::after{
    content:"";
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff1744;

    opacity:.45;

    z-index:-1;
}

body::before{
    top:220px;
    left:10%;
    box-shadow:
        65px 25px 0 rgba(255,23,68,.45),
        430px 10px 0 rgba(255,23,68,.35);
}

body::after{
    right:8%;
    top:245px;

    width:6px;
    height:6px;
}


/* =====================================================
   CONTEÚDO
===================================================== */

.content{
    width:100%;
    max-width:520px;

    margin:0 auto;

    padding:34px 14px 30px;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =====================================================
   LOGO
===================================================== */

.berry-circle{

    width:82px;
    height:82px;

    border-radius:50%;

    border:1px solid #ff1744;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    margin-bottom:18px;

    background:
        radial-gradient(
            circle,
            rgba(255,23,68,.12),
            #111 70%
        );

    box-shadow:
        0 0 20px rgba(255,23,68,.16);
}

.berry-circle img{

    width:62px;
    height:62px;

    object-fit:contain;

    display:block;

    mix-blend-mode:lighten;
}


/* =====================================================
   BEM-VINDO
===================================================== */

.welcome{

    text-align:center;

    font-size:27px;

    font-weight:800;

    line-height:1.2;

    color:white;

    margin-bottom:7px;
}

.welcome .red{
    color:#ff1744;
}


/* =====================================================
   NOME
===================================================== */

.user-name{

    text-align:center;

    font-size:18px;

    font-weight:700;

    color:white;

    margin-top:4px;
}


/* =====================================================
   EMAIL
===================================================== */

.user-email{

    text-align:center;

    font-size:14px;

    color:#999;

    margin-top:4px;

    max-width:90%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =====================================================
   CAIXA DE OPÇÕES
===================================================== */

.menu-box{

    width:100%;

    margin-top:30px;

    background:
        linear-gradient(
            145deg,
            #18191c,
            #111214
        );

    border:1px solid #303136;

    border-radius:20px;

    padding:0;

    overflow:hidden;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}


/* =====================================================
   ITEM
===================================================== */

.menu-item{

    width:100%;

    min-height:76px;

    display:flex;

    align-items:center;

    padding:10px 17px;

    cursor:pointer;

    transition:
        background .15s ease,
        transform .15s ease;

    position:relative;
}

.menu-item + .menu-item{
    border-top:1px solid #292a2e;
}

.menu-item:active{

    background:#222326;

    transform:scale(.99);
}


/* =====================================================
   ÍCONE
===================================================== */

.menu-icon{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.menu-icon svg{

    width:27px;
    height:27px;

    stroke:#ff1744;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   TEXTO
===================================================== */

.menu-text{

    margin-left:14px;

    min-width:0;

    flex:1;
}

.menu-title{

    font-size:17px;

    font-weight:600;

    color:white;
}

.menu-sub{

    font-size:13px;

    color:#929292;

    margin-top:4px;

    line-height:1.2;
}


/* =====================================================
   SETA DOS ITENS
===================================================== */

.menu-item::after{

    content:"";

    width:8px;
    height:8px;

    border-top:2px solid #ddd;
    border-right:2px solid #ddd;

    transform:rotate(45deg);

    margin-left:10px;

    flex-shrink:0;
}


/* =====================================================
   SAIR
===================================================== */

.menu-item.logout-item .menu-icon svg{
    stroke:#ff1744;
}

.menu-item.logout-item .menu-title{
    color:white;
}


/* =====================================================
   VERSÃO
===================================================== */

.version{

    text-align:center;

    margin-top:25px;

    color:#777;

    font-size:13px;
}


/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:76px;

    background:
        rgba(19,20,23,.97);

    border-top:1px solid #292a2e;

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:100;

    backdrop-filter:blur(10px);
}

.menu-nav{

    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#858589;

    cursor:pointer;

    transition:.15s ease;
}

.menu-nav svg{

    width:27px;
    height:27px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.menu-nav span{

    font-size:12px;

    font-weight:500;
}

.menu-nav.active{

    color:#ff1744;
}

.menu-nav.active svg{

    stroke-width:2.4;

}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-width:380px){

    .content{

        padding-top:28px;

        padding-left:12px;
        padding-right:12px;
    }

    .berry-circle{

        width:76px;
        height:76px;

        margin-bottom:16px;
    }

    .berry-circle img{

        width:58px;
        height:58px;
    }

    .welcome{

        font-size:25px;
    }

    .user-name{

        font-size:17px;
    }

    .user-email{

        font-size:13px;
    }

    .menu-box{

        margin-top:27px;

        border-radius:18px;
    }

    .menu-item{

        min-height:72px;

        padding-left:14px;
        padding-right:14px;
    }

    .menu-icon{

        width:42px;
        height:42px;
    }

    .menu-icon svg{

        width:25px;
        height:25px;
    }

    .menu-text{

        margin-left:11px;
    }

    .menu-title{

        font-size:16px;
    }

    .menu-sub{

        font-size:12px;
    }

    .bottom-menu{

        height:72px;
    }
}

</style>

</head>

<body>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="content">


    <!-- =================================================
         LOGO DO BERRY
    ================================================== -->

    <div class="berry-circle">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>


    <!-- =================================================
         BEM-VINDO
    ================================================== -->

    <div class="welcome">

        Bem-vindo(a)
        <span class="red">de volta!</span>

    </div>


    <!-- =================================================
         NOME
    ================================================== -->

    <div
        id="userName"
        class="user-name">

        Carregando...

    </div>


    <!-- =================================================
         EMAIL
    ================================================== -->

    <div
        id="userEmail"
        class="user-email">

        ...

    </div>


    <!-- =================================================
         OPÇÕES
    ================================================== -->

    <div class="menu-box">


        <!-- MEU PERFIL -->

        <div
            class="menu-item"
            onclick="editarPerfil()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="7"
                        r="3.5">
                    </circle>

                    <path
                        d="M5 20c.5-3.5 3-6 7-6s6.5 2.5 7 6">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Meu perfil
                </div>

                <div class="menu-sub">
                    Gerencie seu perfil
                </div>

            </div>

        </div>


        <!-- CONFIGURAÇÕES -->

        <div
            class="menu-item"
            onclick="configuracoes()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="3">
                    </circle>

                    <path
                        d="M19 13.5v-3l-2-.6a6.5 6.5 0 0 0-.7-1.6l.9-1.9-2.1-2.1-1.9.9a6.5 6.5 0 0 0-1.6-.7L11 2.5H8l-.6 2a6.5 6.5 0 0 0-1.6.7l-1.9-.9-2.1 2.1.9 1.9a6.5 6.5 0 0 0-.7 1.6l-2 .6v3l2 .6a6.5 6.5 0 0 0 .7 1.6l-.9 1.9 2.1 2.1 1.9-.9a6.5 6.5 0 0 0 1.6.7l.6 2h3l.6-2a6.5 6.5 0 0 0 1.6-.7l1.9.9 2.1-2.1-.9-1.9a6.5 6.5 0 0 0 .7-1.6z">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Configurações
                </div>

                <div class="menu-sub">
                    Ajustes do BerryAnime
                </div>

            </div>

        </div>


        <!-- HISTÓRICO -->

        <div
            class="menu-item"
            onclick="historico()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="8">
                    </circle>

                    <path
                        d="M12 7v5l3 2">
                    </path>

                    <path
                        d="M4 5l-1 4 4 1">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Histórico
                </div>

                <div class="menu-sub">
                    Continue de onde parou
                </div>

            </div>

        </div>


        <!-- SAIR -->

        <div
            class="menu-item logout-item"
            id="logoutButton">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5">
                    </path>

                    <path
                        d="M14 8l5 4-5 4">
                    </path>

                    <path
                        d="M19 12H9">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Sair da conta
                </div>

                <div class="menu-sub">
                    Encerrar sessão no BerryAnime
                </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         VERSÃO
    ================================================== -->

    <div class="version">

        BerryAnime<br>
        <span style="font-size:12px;color:#666;">
            VERSÃO 1.0
        </span>

    </div>

</main>


<!-- =====================================================
     MENU INFERIOR
===================================================== -->

<nav class="bottom-menu">


    <!-- INÍCIO -->

    <div
        class="menu-nav"
        onclick="location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>


    <!-- MANGÁS -->

    <div
        class="menu-nav"
        onclick="location.href='mangas.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>

        </svg>

        <span>Mangás</span>

    </div>


    <!-- FAVORITOS -->

    <div
        class="menu-nav"
        onclick="location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">

            <path
                d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>


    <!-- MAIS -->

    <div
        class="menu-nav active"
        onclick="location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>

        </svg>

        <span>Mais</span>

    </div>

</nav>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   USUÁRIO
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.replace(
                "index.html"
            );

            return;

        }


        document
        .getElementById("userEmail")
        .textContent =
            user.email || "Sem e-mail";


        let nome =
            user.displayName;


        if(!nome && user.email){

            nome =
                user.email
                .split("@")[0];

        }


        document
        .getElementById("userName")
        .textContent =
            nome || "Usuário";

    }
);


/* =====================================================
   EDITAR PERFIL
===================================================== */

window.editarPerfil =
function(){

    window.location.href =
        "perfil.html";

};


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

window.configuracoes =
function(){

    window.location.href =
        "configuracoes.html";

};


/* =====================================================
   HISTÓRICO
===================================================== */

window.historico =
function(){

    window.location.href =
        "historico.html";

};


/* =====================================================
   SAIR DA CONTA
===================================================== */

document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function(){

        const confirmar =
            confirm(
                "Deseja sair da sua conta?"
            );

        if(!confirmar){
            return;
        }

        try{

            await signOut(auth);

            window.location.replace(
                "index.html"
            );

        }

        catch(error){

            console.error(error);

            alert(
                "Não foi possível sair da conta."
            );

        }

    }
);

</script>


</body>
  </html>

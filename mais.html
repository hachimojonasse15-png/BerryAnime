<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Mais</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#090909;
    color:white;
    padding-bottom:75px;
}

/* =====================================================
   TOPO
===================================================== */

.header{
    height:55px;

    display:flex;
    align-items:center;

    padding:0 15px;
}

/* =====================================================
   CONTEÚDO
===================================================== */

.content{
    padding:10px 14px;
}

/* =====================================================
   PERFIL / BOAS-VINDAS
===================================================== */

.profile-header{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    padding:8px 0 20px;
}

.profile-avatar{
    width:70px;
    height:70px;

    border-radius:50%;

    overflow:hidden;

    background:#191919;

    border:2px solid #ff1744;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:12px;
}

.profile-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.profile-avatar-default{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-avatar-default svg{
    width:36px;
    height:36px;

    stroke:#ff1744;
    fill:none;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.welcome{
    font-size:20px;
    font-weight:700;

    color:white;
}

.welcome .red{
    color:#ff1744;
}

.profile-name{
    margin-top:7px;

    font-size:15px;
    font-weight:600;

    color:#fff;

    max-width:90%;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-email{
    margin-top:4px;

    font-size:12px;

    color:#999;

    max-width:90%;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =====================================================
   CAIXA DE OPÇÕES
===================================================== */

.menu-box{
    width:100%;

    background:#191919;

    border-radius:13px;

    padding:4px 0;

    margin-top:5px;
}

/* =====================================================
   ITEM
===================================================== */

.menu-item{
    min-height:58px;

    display:flex;

    align-items:center;

    padding:7px 14px;

    cursor:pointer;

    transition:.15s;
}

.menu-item:active{
    background:#242424;
}

/* =====================================================
   ÍCONE
===================================================== */

.menu-icon{
    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    color:#ff1744;
}

.menu-icon svg{
    width:23px;
    height:23px;

    stroke:currentColor;

    fill:none;

    stroke-width:1.9;

    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   TEXTO
===================================================== */

.menu-text{
    margin-left:10px;
}

.menu-title{
    font-size:15px;

    font-weight:700;

    color:#ff1744;
}

.menu-sub{
    color:#999;

    font-size:11px;

    margin-top:3px;
}

/* =====================================================
   VERSÃO
===================================================== */

.version{
    text-align:center;

    margin-top:28px;

    color:#777;

    font-size:12px;
}

/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:66px;

    background:#101010;

    border-top:1px solid #222;

    display:flex;

    justify-content:space-around;

    align-items:center;

    z-index:100;
}

.menu-nav{
    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    color:#777;

    cursor:pointer;

    font-size:11px;
}

.menu-nav svg{
    width:20px;
    height:20px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-nav.active{
    color:white;
}

.menu-nav span{
    font-size:11px;
}

/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-width:380px){

    .welcome{
        font-size:19px;
    }

    .profile-name{
        font-size:14px;
    }

    .profile-email{
        font-size:11px;
    }

    .menu-title{
        font-size:14px;
    }

    .menu-sub{
        font-size:10px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     TOPO
===================================================== -->

<header class="header"></header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="content">


    <!-- =================================================
         PERFIL
    ================================================== -->

    <div class="profile-header">


        <!-- ÚNICO ÍCONE BERRY -->

        <div class="profile-avatar">

            <img
                id="avatarImage"
                src=""
                alt="Perfil">

            <div
                id="avatarDefault"
                class="profile-avatar-default">

                <img
                    src="BerryAnime_logo_leve.jpg"
                    alt="BerryAnime"
                    style="
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        display:block;
                    ">

            </div>

        </div>


        <!-- BOAS-VINDAS -->

        <div class="welcome">

            Bem-vindo(a) <span class="red">de volta</span>

        </div>


        <!-- NOME -->

        <div
            id="accountName"
            class="profile-name">

            Carregando...

        </div>


        <!-- EMAIL -->

        <div
            id="accountEmail"
            class="profile-email">

            ...

        </div>

    </div>


    <!-- =================================================
         OPÇÕES
    ================================================== -->

    <div class="menu-box">


        <!-- MEU PERFIL -->

        <div
            class="menu-item"
            onclick="editarPerfil()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="7"
                        r="3.5">
                    </circle>

                    <path
                        d="M5 20c.5-3.5 3-6 7-6s6.5 2.5 7 6">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Meu perfil
                </div>

                <div class="menu-sub">
                    Gerencie seu perfil
                </div>

            </div>

        </div>


        <!-- CONFIGURAÇÕES -->

        <div
            class="menu-item"
            onclick="configuracoes()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="3">
                    </circle>

                    <path
                        d="M19 13.5v-3l-2-.6a6.5 6.5 0 0 0-.7-1.6l.9-1.9-2.1-2.1-1.9.9a6.5 6.5 0 0 0-1.6-.7L11 2.5H8l-.6 2a6.5 6.5 0 0 0-1.6.7l-1.9-.9-2.1 2.1.9 1.9a6.5 6.5 0 0 0-.7 1.6l-2 .6v3l2 .6a6.5 6.5 0 0 0 .7 1.6l-.9 1.9 2.1 2.1 1.9-.9a6.5 6.5 0 0 0 1.6.7l.6 2h3l.6-2a6.5 6.5 0 0 0 1.6-.7l1.9.9 2.1-2.1-.9-1.9a6.5 6.5 0 0 0 .7-1.6z">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Configurações
                </div>

                <div class="menu-sub">
                    Ajustes do BerryAnime
                </div>

            </div>

        </div>


        <!-- HISTÓRICO -->

        <div
            class="menu-item"
            onclick="historico()">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 12a9 9 0 1 0 3-6.7">
                    </path>

                    <path
                        d="M3 4v5h5">
                    </path>

                    <path
                        d="M12 7v5l3 2">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Histórico
                </div>

                <div class="menu-sub">
                    Continue de onde parou
                </div>

            </div>

        </div>


        <!-- SAIR -->

        <div
            class="menu-item"
            id="logoutButton">

            <div class="menu-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4">
                    </path>

                    <path
                        d="M14 8l5 4-5 4">
                    </path>

                    <path
                        d="M19 12H9">
                    </path>

                </svg>

            </div>

            <div class="menu-text">

                <div class="menu-title">
                    Sair da conta
                </div>

                <div class="menu-sub">
                    Encerrar sessão no BerryAnime
                </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         VERSÃO
    ================================================== -->

    <div class="version">

        Versão 1.0

    </div>

</main>


<!-- =====================================================
     MENU INFERIOR
===================================================== -->

<nav class="bottom-menu">


    <!-- INÍCIO -->

    <div
        class="menu-nav"
        onclick="location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>


    <!-- MANGÁS -->

    <div
        class="menu-nav"
        onclick="location.href='mangas.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>

        </svg>

        <span>Mangás</span>

    </div>


    <!-- FAVORITOS -->

    <div
        class="menu-nav"
        onclick="location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">

            <path
                d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>


    <!-- MAIS -->

    <div
        class="menu-nav active"
        onclick="location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>

        </svg>

        <span>Mais</span>

    </div>

</nav>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   USUÁRIO
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        /* EMAIL */

        document
        .getElementById("accountEmail")
        .textContent =
            user.email || "Sem e-mail";


        /* NOME */

        let nome =
            user.displayName;


        if(!nome && user.email){

            nome =
                user.email
                .split("@")[0];

        }


        document
        .getElementById("accountName")
        .textContent =
            nome || "Usuário";


        /* FOTO DO GOOGLE */

        if(user.photoURL){

            const imagem =
                document.getElementById(
                    "avatarImage"
                );

            imagem.src =
                user.photoURL;

            imagem.style.display =
                "block";

            document
            .getElementById(
                "avatarDefault"
            )
            .style.display =
                "none";

        }

    }
);


/* =====================================================
   SAIR
===================================================== */

document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function(){

        if(!confirm(
            "Deseja sair da sua conta?"
        )){
            return;
        }

        try{

            await signOut(auth);

            window.location.href =
                "index.html";

        }

        catch(error){

            console.log(error);

            alert(
                "Não foi possível sair da conta."
            );

        }

    }
);


/* =====================================================
   OPÇÕES
===================================================== */

window.editarPerfil =
function(){

    alert(
        "Meu perfil será adicionado no próximo passo."
    );

};


window.configuracoes =
function(){

    alert(
        "Configurações serão adicionadas no próximo passo."
    );

};


window.historico =
function(){

    alert(
        "Histórico será adicionado no próximo passo."
    );

};

</script>

</body>

 </html>

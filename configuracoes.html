<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Configurações</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#090909;
    color:white;
    padding-bottom:30px;
}


/* =====================================================
   CONTEÚDO
===================================================== */

.content{

    width:100%;
    max-width:680px;

    margin:0 auto;

    padding:22px 23px 40px;
}


/* =====================================================
   TOPO
===================================================== */

.header{

    height:55px;

    display:flex;
    align-items:center;

    margin-bottom:25px;
}

.back{

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    cursor:pointer;
}

.back svg{

    width:27px;
    height:27px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{

    margin-left:17px;

    font-size:26px;

    font-weight:700;

    color:white;
}


/* =====================================================
   TÍTULO
===================================================== */

.page-title{

    display:flex;
    align-items:center;

    margin-bottom:18px;
}

.page-icon{

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.page-icon svg{

    width:29px;
    height:29px;

    stroke:#ff1744;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.page-title-text{

    margin-left:16px;

    font-size:20px;

    font-weight:700;
}


/* =====================================================
   CAIXA
===================================================== */

.settings-box{

    width:100%;

    background:#151515;

    border:1px solid #303030;

    border-radius:20px;

    overflow:hidden;
}


/* =====================================================
   ITEM
===================================================== */

.setting{

    width:100%;

    min-height:82px;

    display:flex;

    align-items:center;

    padding:14px 20px;

    cursor:pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.setting + .setting{

    border-top:1px solid #303030;
}

.setting:active{

    background:#242424;

    transform:scale(.995);
}


/* =====================================================
   ÍCONE
===================================================== */

.setting-icon{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.setting-icon svg{

    width:28px;
    height:28px;

    stroke:#ff1744;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   TEXTO
===================================================== */

.setting-info{

    margin-left:17px;

    min-width:0;
}

.setting-title{

    font-size:18px;

    font-weight:700;

    color:white;
}

.setting-sub{

    margin-top:5px;

    font-size:13px;

    color:#999;

    line-height:1.35;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:380px){

    .content{

        padding-left:16px;
        padding-right:16px;
    }

    .header-title{

        font-size:24px;
    }

    .setting{

        padding-left:15px;
        padding-right:15px;
    }

    .setting-title{

        font-size:17px;
    }

    .setting-sub{

        font-size:12px;
    }

    .setting-info{

        margin-left:14px;
    }

}

</style>

</head>


<body>


<main class="content">


    <!-- =================================================
         TOPO
    ================================================== -->

    <header class="header">

        <div
            class="back"
            onclick="voltar()">

            <svg viewBox="0 0 24 24">

                <path d="M19 12H5"></path>

                <path d="M12 19l-7-7 7-7"></path>

            </svg>

        </div>


        <div class="header-title">

            Configurações

        </div>

    </header>


    <!-- =================================================
         TÍTULO
    ================================================== -->

    <div class="page-title">

        <div class="page-icon">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="3">
                </circle>

                <path
                    d="M19 13.5v-3l-2-.6a6.5 6.5 0 0 0-.7-1.6l.9-1.9-2.1-2.1-1.9.9a6.5 6.5 0 0 0-1.6-.7L11 2.5H8l-.6 2a6.5 6.5 0 0 0-1.6.7l-1.9-.9-2.1 2.1.9 1.9a6.5 6.5 0 0 0-.7 1.6l-2 .6v3l2 .6a6.5 6.5 0 0 0 .7 1.6l-.9 1.9 2.1 2.1 1.9-.9a6.5 6.5 0 0 0 1.6.7l.6 2h3l.6-2a6.5 6.5 0 0 0 1.6-.7l1.9.9 2.1-2.1-.9-1.9a6.5 6.5 0 0 0 .7-1.6z">
                </path>

            </svg>

        </div>


        <div class="page-title-text">

            Ajustes do BerryAnime

        </div>

    </div>


    <!-- =================================================
         OPÇÕES
    ================================================== -->

    <div class="settings-box">


        <!-- PLAYER -->

        <div
            class="setting"
            onclick="abrirPlayer()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M8 5v14l11-7z">
                    </path>

                </svg>

            </div>


            <div class="setting-info">

                <div class="setting-title">

                    Configurações do Player

                </div>

                <div class="setting-sub">

                    Gestos, qualidade, reprodução e legendas

                </div>

            </div>

        </div>


        <!-- LEITOR -->

        <div
            class="setting"
            onclick="abrirLeitor()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M4 4h16v16H4z">
                    </path>

                    <path
                        d="M8 8h8">
                    </path>

                    <path
                        d="M8 12h8">
                    </path>

                    <path
                        d="M8 16h5">
                    </path>

                </svg>

            </div>


            <div class="setting-info">

                <div class="setting-title">

                    Configurações do Leitor

                </div>

                <div class="setting-sub">

                    Preferências para leitura de mangás

                </div>

            </div>

        </div>


        <!-- APARÊNCIA -->

        <div
            class="setting"
            onclick="abrirAparencia()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="4">
                    </circle>

                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>

                    <path d="M4.9 4.9l1.4 1.4"></path>
                    <path d="M17.7 17.7l1.4 1.4"></path>

                    <path d="M19.1 4.9l-1.4 1.4"></path>
                    <path d="M6.3 17.7l-1.4 1.4"></path>

                </svg>

            </div>


            <div class="setting-info">

                <div class="setting-title">

                    Aparência

                </div>

                <div class="setting-sub">

                    Tema e aparência do BerryAnime

                </div>

            </div>

        </div>


        <!-- SOBRE -->

        <div
            class="setting"
            onclick="abrirSobre()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="9">
                    </circle>

                    <path d="M12 10v6"></path>

                    <path d="M12 7h.01"></path>

                </svg>

            </div>


            <div class="setting-info">

                <div class="setting-title">

                    Sobre o BerryAnime

                </div>

                <div class="setting-sub">

                    Informações, recursos e política de privacidade

                </div>

            </div>

        </div>

    </div>


</main>


<script>


/* =====================================================
   VOLTAR
===================================================== */

function voltar(){

    window.location.href =
        "mais.html";

}


/* =====================================================
   CONFIGURAÇÕES DO PLAYER
===================================================== */

function abrirPlayer(){

    window.location.href =
        "player-settings.html";

}


/* =====================================================
   CONFIGURAÇÕES DO LEITOR
===================================================== */

function abrirLeitor(){

    window.location.href =
        "reader-settings.html";

}


/* =====================================================
   APARÊNCIA
===================================================== */

function abrirAparencia(){

    window.location.href =
        "appearance.html";

}


/* =====================================================
   SOBRE
===================================================== */

function abrirSobre(){

    window.location.href =
        "about.html";

}

</script>


</body>

      </html>

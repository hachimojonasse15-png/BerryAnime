<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Configurações</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#090909;
    color:white;
    padding-bottom:30px;
}


/* =====================================================
   TOPO
===================================================== */

.header{

    height:70px;

    display:flex;
    align-items:center;

    padding:0 20px;

    gap:18px;
}

.back-button{

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:white;
}

.back-button svg{

    width:28px;
    height:28px;

    stroke:currentColor;
    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{

    font-size:24px;
    font-weight:700;

    color:white;
}


/* =====================================================
   CONTEÚDO
===================================================== */

.content{

    width:100%;
    max-width:680px;

    margin:0 auto;

    padding:18px 22px 40px;
}


/* =====================================================
   SEÇÃO
===================================================== */

.section-title{

    color:#777;

    font-size:12px;
    font-weight:700;

    text-transform:uppercase;

    margin:12px 5px 8px;
}


/* =====================================================
   CAIXA
===================================================== */

.settings-box{

    width:100%;

    background:#151515;

    border:1px solid #282828;

    border-radius:18px;

    overflow:hidden;
}


/* =====================================================
   ITEM
===================================================== */

.setting-item{

    min-height:76px;

    display:flex;

    align-items:center;

    padding:12px 18px;

    cursor:pointer;

    transition:.15s;
}

.setting-item + .setting-item{

    border-top:1px solid #292929;
}

.setting-item:active{

    background:#222;
}


/* =====================================================
   ÍCONE
===================================================== */

.setting-icon{

    width:44px;
    height:44px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

.setting-icon svg{

    width:25px;
    height:25px;

    stroke:#ff1744;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   TEXTO
===================================================== */

.setting-text{

    margin-left:15px;

    min-width:0;
}

.setting-title{

    font-size:16px;

    font-weight:700;

    color:white;
}

.setting-sub{

    margin-top:4px;

    font-size:12px;

    color:#888;
}


/* =====================================================
   SETA
===================================================== */

.setting-arrow{

    margin-left:auto;

    color:#666;

    display:flex;
    align-items:center;
}

.setting-arrow svg{

    width:20px;
    height:20px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   RODAPÉ
===================================================== */

.footer{

    text-align:center;

    margin-top:45px;

    color:#666;

    font-size:13px;
}

.footer strong{

    display:block;

    color:white;

    font-size:13px;

    margin-bottom:5px;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-width:380px){

    .header{

        padding:0 15px;

        gap:14px;
    }

    .header-title{

        font-size:21px;
    }

    .content{

        padding-left:16px;
        padding-right:16px;
    }

    .setting-item{

        min-height:70px;

        padding:10px 14px;
    }

    .setting-title{

        font-size:15px;
    }

    .setting-sub{

        font-size:11px;
    }

    .setting-icon{

        width:40px;
        height:40px;
    }

    .setting-icon svg{

        width:23px;
        height:23px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     TOPO
===================================================== -->

<header class="header">

    <div
        class="back-button"
        onclick="voltar()">

        <svg viewBox="0 0 24 24">

            <path d="M19 12H5"></path>

            <path d="M12 19l-7-7 7-7"></path>

        </svg>

    </div>


    <div class="header-title">

        Configurações

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="content">


    <div class="section-title">

        BerryAnime

    </div>


    <div class="settings-box">


        <!-- PLAYER -->

        <div
            class="setting-item"
            onclick="playerSettings()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M8 5l11 7-11 7z">
                    </path>

                </svg>

            </div>

            <div class="setting-text">

                <div class="setting-title">

                    Configurações do player

                </div>

                <div class="setting-sub">

                    Reprodução e qualidade dos vídeos

                </div>

            </div>

            <div class="setting-arrow">

                <svg viewBox="0 0 24 24">

                    <path d="M9 18l6-6-6-6"></path>

                </svg>

            </div>

        </div>


        <!-- LEITOR -->

        <div
            class="setting-item"
            onclick="readerSettings()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <path d="M4 5h16v14H4z"></path>

                    <path d="M8 9h8"></path>

                    <path d="M8 13h6"></path>

                </svg>

            </div>

            <div class="setting-text">

                <div class="setting-title">

                    Configurações do leitor

                </div>

                <div class="setting-sub">

                    Ajustes para leitura de mangás

                </div>

            </div>

            <div class="setting-arrow">

                <svg viewBox="0 0 24 24">

                    <path d="M9 18l6-6-6-6"></path>

                </svg>

            </div>

        </div>


        <!-- APARÊNCIA -->

        <div
            class="setting-item"
            onclick="aparencia()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="4">
                    </circle>

                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>

                    <path d="M4.9 4.9l1.4 1.4"></path>
                    <path d="M17.7 17.7l1.4 1.4"></path>

                    <path d="M19.1 4.9l-1.4 1.4"></path>
                    <path d="M6.3 17.7l-1.4 1.4"></path>

                </svg>

            </div>

            <div class="setting-text">

                <div class="setting-title">

                    Aparência

                </div>

                <div class="setting-sub">

                    Tema e aparência do BerryAnime

                </div>

            </div>

            <div class="setting-arrow">

                <svg viewBox="0 0 24 24">

                    <path d="M9 18l6-6-6-6"></path>

                </svg>

            </div>

        </div>


        <!-- SOBRE -->

        <div
            class="setting-item"
            onclick="sobre()">

            <div class="setting-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="9">
                    </circle>

                    <path d="M12 10v6"></path>

                    <circle
                        cx="12"
                        cy="7"
                        r=".7"
                        fill="#ff1744"
                        stroke="none">
                    </circle>

                </svg>

            </div>

            <div class="setting-text">

                <div class="setting-title">

                    Sobre o BerryAnime

                </div>

                <div class="setting-sub">

                    Informações sobre o aplicativo

                </div>

            </div>

            <div class="setting-arrow">

                <svg viewBox="0 0 24 24">

                    <path d="M9 18l6-6-6-6"></path>

                </svg>

            </div>

        </div>


    </div>


    <div class="footer">

        <strong>BerryAnime</strong>

        VERSÃO 1.0

    </div>


</main>


<script>


/* =====================================================
   VOLTAR
===================================================== */

function voltar(){

    window.location.href =
        "mais.html";

}


/* =====================================================
   OPÇÕES
===================================================== */

function playerSettings(){

    alert(
        "As configurações do player serão adicionadas."
    );

}


function readerSettings(){

    alert(
        "As configurações do leitor serão adicionadas."
    );

}


function aparencia(){

    alert(
        "As opções de aparência serão adicionadas."
    );

}


function sobre(){

    alert(
        "BerryAnime — Versão 1.0"
    );

}

</script>


</body>

  </html>

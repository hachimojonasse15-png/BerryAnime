<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Perfil</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#080808;
    color:white;
}

body{
    padding-bottom:40px;
}


/* =====================================================
   TOPO
===================================================== */

.topbar{

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    background:#080808;
}

.top-button{

    width:42px;
    height:42px;

    border:0;

    background:transparent;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}

.top-button svg{

    width:27px;
    height:27px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   PERFIL
===================================================== */

.profile{

    width:100%;

    max-width:600px;

    margin:0 auto;

    padding:18px 20px 40px;
}


/* =====================================================
   CABEÇALHO DO PERFIL
===================================================== */

.profile-header{

    display:flex;

    align-items:center;

    gap:20px;

    margin-top:20px;

    margin-bottom:28px;
}


/* =====================================================
   FOTO
===================================================== */

.avatar{

    width:116px;

    height:116px;

    min-width:116px;

    border-radius:50%;

    overflow:hidden;

    background:#252525;

    border:1px solid #333;

    display:flex;

    align-items:center;

    justify-content:center;
}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}

.default-avatar{

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#292929;
}

.default-avatar svg{

    width:68px;

    height:68px;

    stroke:#777;

    fill:none;

    stroke-width:1.5;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.profile-info{

    min-width:0;

    flex:1;
}

.profile-name{

    font-size:27px;

    font-weight:800;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.profile-email{

    color:#999;

    font-size:14px;

    line-height:1.4;

    word-break:break-word;
}


/* =====================================================
   BOTÃO EDITAR
===================================================== */

.edit-button{

    width:100%;

    height:50px;

    border:0;

    border-radius:12px;

    background:white;

    color:#111;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    margin-bottom:25px;

    transition:.15s;
}

.edit-button:active{

    transform:scale(.98);
}


/* =====================================================
   BIO
===================================================== */

.bio-card{

    background:#151515;

    border:1px solid #202020;

    border-radius:14px;

    padding:17px;

    margin-bottom:18px;
}

.bio-title{

    font-size:15px;

    font-weight:800;

    margin-bottom:8px;
}

.bio-text{

    color:#999;

    font-size:14px;

    line-height:1.5;
}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:30px;
}

.stat-card{

    background:#151515;

    border:1px solid #202020;

    border-radius:14px;

    padding:17px;
}

.stat-title{

    font-size:15px;

    font-weight:800;

    margin-bottom:7px;
}

.stat-value{

    color:#999;

    font-size:14px;
}


/* =====================================================
   FAVORITOS
===================================================== */

.section-title{

    font-size:21px;

    font-weight:800;

    margin-bottom:16px;
}

.empty{

    min-height:150px;

    background:#111;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

    color:#777;

    font-size:14px;
}


/* =====================================================
   COMENTÁRIOS
===================================================== */

.comments{

    margin-top:32px;
}


/* =====================================================
   CARREGANDO
===================================================== */

.loading{

    min-height:70vh;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#999;

    font-size:15px;
}


/* =====================================================
   ERRO
===================================================== */

.error{

    text-align:center;

    padding:50px 20px;

    color:#ff6b81;

    font-size:15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .topbar{

        height:64px;

        padding:0 14px;
    }

    .profile{

        padding:

            12px
            16px
            35px;
    }

    .profile-header{

        gap:16px;

        margin-top:18px;
    }

    .avatar{

        width:96px;

        height:96px;

        min-width:96px;
    }

    .profile-name{

        font-size:23px;
    }

    .profile-email{

        font-size:13px;
    }

    .section-title{

        font-size:20px;
    }

}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-width:360px){

    .profile-header{

        gap:13px;
    }

    .avatar{

        width:86px;

        height:86px;

        min-width:86px;
    }

    .profile-name{

        font-size:21px;
    }

}

</style>

</head>


<body>


<!-- ===================================================
     TOPO
=================================================== -->

<header class="topbar">

    <!-- VOLTAR -->

    <button
        class="top-button"
        onclick="voltar()"
        aria-label="Voltar">

        <svg viewBox="0 0 24 24">

            <path d="M19 12H5"></path>

            <path d="M12 19l-7-7 7-7"></path>

        </svg>

    </button>


    <!-- PARTILHAR -->

    <button
        class="top-button"
        onclick="partilhar()"
        aria-label="Partilhar">

        <svg viewBox="0 0 24 24">

            <circle
                cx="18"
                cy="5"
                r="2.5">
            </circle>

            <circle
                cx="6"
                cy="12"
                r="2.5">
            </circle>

            <circle
                cx="18"
                cy="19"
                r="2.5">
            </circle>

            <path d="M8.2 10.8l7.5-4.4"></path>

            <path d="M8.2 13.2l7.5 4.4"></path>

        </svg>

    </button>

</header>



<!-- ===================================================
     CONTEÚDO
=================================================== -->

<main id="profileContent">

    <div class="loading">
        Carregando perfil...
    </div>

</main>



<!-- ===================================================
     FIREBASE
=================================================== -->

<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const profileContent =
    document.getElementById("profileContent");


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    if(!texto){

        return "";

    }

    return String(texto)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* =====================================================
   DATA DA CONTA
===================================================== */

function formatarData(data){

    if(!data){

        return "Data desconhecida";

    }

    const d =
        new Date(data);

    return d.toLocaleDateString(
        "pt-BR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );
}


/* =====================================================
   AVATAR
===================================================== */

function criarAvatar(usuario){

    if(usuario.photoURL){

        return `

            <div class="avatar">

                <img
                    src="${escaparHTML(usuario.photoURL)}"
                    alt="Foto de perfil"
                >

            </div>

        `;

    }


    return `

        <div class="avatar">

            <div class="default-avatar">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="4">
                    </circle>

                    <path
                        d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                    </path>

                </svg>

            </div>

        </div>

    `;

}


/* =====================================================
   MOSTRAR PERFIL
===================================================== */

function mostrarPerfil(usuario){

    const nome =
        usuario.displayName ||
        usuario.email?.split("@")[0] ||
        "Utilizador";

    const email =
        usuario.email ||
        "E-mail não disponível";

    const data =
        usuario.metadata?.creationTime;


    profileContent.innerHTML = `

        <div class="profile">


            <!-- CABEÇALHO -->

            <div class="profile-header">

                ${criarAvatar(usuario)}


                <div class="profile-info">

                    <div class="profile-name">

                        ${escaparHTML(nome)}

                    </div>

                    <div class="profile-email">

                        ${escaparHTML(email)}

                    </div>

                </div>

            </div>


            <!-- EDITAR -->

            <button
                class="edit-button"
                onclick="editarPerfil()">

                Editar perfil

            </button>


            <!-- BIO -->

            <div class="bio-card">

                <div class="bio-title">

                    Biografia

                </div>

                <div class="bio-text">

                    Ainda não adicionaste uma biografia.

                </div>

            </div>


            <!-- ESTATÍSTICAS -->

            <div class="stats">

                <div class="stat-card">

                    <div class="stat-title">

                        Favoritos

                    </div>

                    <div class="stat-value">

                        Nenhum favorito

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">

                        Membro desde

                    </div>

                    <div class="stat-value">

                        ${formatarData(data)}

                    </div>

                </div>

            </div>


            <!-- FAVORITOS -->

            <div class="section-title">

                Favoritos

            </div>

            <div class="empty">

                Ainda não tens animes favoritos.

            </div>


            <!-- COMENTÁRIOS -->

            <div class="comments">

                <div class="section-title">

                    Últimos comentários

                </div>

                <div class="empty">

                    Ainda não tens comentários.

                </div>

            </div>


        </div>

    `;

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.href =
                "index.html";

            return;

        }

        mostrarPerfil(usuario);

    }
);


/* =====================================================
   VOLTAR
===================================================== */

window.voltar = function(){

    window.history.back();

};


/* =====================================================
   EDITAR PERFIL
===================================================== */

window.editarPerfil = function(){

    window.location.href =
        "edit-profile.html";

};


/* =====================================================
   PARTILHAR
===================================================== */

window.partilhar = async function(){

    const dados = {

        title:"Meu perfil BerryAnime",

        text:"Confira meu perfil no BerryAnime.",

        url:window.location.href

    };


    try{

        if(
            navigator.share
        ){

            await navigator.share(
                dados
            );

        }

        else{

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert(
                "Link do perfil copiado!"
            );

        }

    }

    catch(error){

        console.log(error);

    }

};

</script>


</body>

  </html>

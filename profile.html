<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
    padding:20px 16px 40px;
}

.profile{
    width:100%;
    max-width:430px;
    margin:auto;
}

/* =========================
   TOP
========================= */

.top{
    height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;
}

.top-button{
    width:40px;
    height:40px;

    border:0;
    background:transparent;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.top-button svg{
    width:24px;
    height:24px;

    fill:none;
    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   PROFILE HEADER
========================= */

.profile-header{
    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    margin-bottom:25px;
}


/* =========================
   USER ICON
   SAME STYLE AS MORE MENU
========================= */

.avatar{
    width:92px;
    height:92px;

    border-radius:50%;

    background:#151515;

    border:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.avatar svg{
    width:45px;
    height:45px;

    fill:none;
    stroke:#888;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================
   NAME
========================= */

.profile-name{
    margin-top:16px;

    font-size:23px;

    font-weight:800;

    max-width:330px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   EMAIL
========================= */

.profile-email{
    margin-top:6px;

    color:#888;

    font-size:13px;

    max-width:330px;

    word-break:break-word;
}


/* =========================
   EDIT
========================= */

.edit-button{
    margin-top:17px;

    width:130px;
    height:43px;

    border:0;

    border-radius:10px;

    background:#191919;

    color:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.15s;
}

.edit-button:active{
    transform:scale(.97);
}


/* =========================
   ACCOUNT INFO
========================= */

.info-list{
    margin-top:30px;

    border-top:1px solid #202020;
}

.info-item{
    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #202020;
}

.info-label{
    color:#aaa;
    font-size:14px;
}

.info-value{
    color:#fff;
    font-size:14px;
    font-weight:600;
}


/* =========================
   FAVORITES
========================= */

.section-title{
    margin-top:32px;

    margin-bottom:14px;

    font-size:18px;

    font-weight:800;
}

.empty{
    min-height:100px;

    border-radius:12px;

    background:#111;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    color:#666;

    font-size:13px;

    padding:20px;
}


/* =========================
   LOGOUT
========================= */

.logout-button{

    width:100%;

    height:48px;

    margin-top:30px;

    border:1px solid #292929;

    border-radius:10px;

    background:#151515;

    color:#ff1744;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}


/* =========================
   LOADING
========================= */

.loading{

    min-height:80vh;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#888;

    font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    body{
        padding-left:14px;
        padding-right:14px;
    }

    .avatar{
        width:86px;
        height:86px;
    }

    .profile-name{
        font-size:21px;
    }

}

</style>

</head>


<body>


<div id="app">

    <div class="loading">
        Loading...
    </div>

</div>


<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const app =
    document.getElementById("app");


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    if(!text){
        return "";
    }

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================
   DATE
========================= */

function formatDate(date){

    if(!date){
        return "Unknown";
    }

    return new Date(date)
        .toLocaleDateString(
            "en-US",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

}


/* =========================
   USER ICON
========================= */

function defaultAvatar(){

    return `

        <div class="avatar">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    `;

}


/* =========================
   PROFILE
========================= */

function showProfile(user){

    const name =
        user.displayName ||
        user.email?.split("@")[0] ||
        "User";

    const email =
        user.email ||
        "No email";


    let avatar;


    if(user.photoURL){

        avatar = `

            <div class="avatar">

                <img
                    src="${escapeHTML(user.photoURL)}"
                    alt="Profile">

            </div>

        `;

    }

    else{

        avatar =
            defaultAvatar();

    }


    app.innerHTML = `

        <main class="profile">


            <!-- TOP -->

            <div class="top">


                <button
                    class="top-button"
                    onclick="goBack()"
                    aria-label="Back">

                    <svg viewBox="0 0 24 24">

                        <path d="M19 12H5"></path>

                        <path d="M12 19l-7-7 7-7"></path>

                    </svg>

                </button>


                <button
                    class="top-button"
                    onclick="shareProfile()"
                    aria-label="Share">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="18"
                            cy="5"
                            r="2.5">
                        </circle>

                        <circle
                            cx="6"
                            cy="12"
                            r="2.5">
                        </circle>

                        <circle
                            cx="18"
                            cy="19"
                            r="2.5">
                        </circle>

                        <path d="M8.2 10.8l7.5-4.4"></path>

                        <path d="M8.2 13.2l7.5 4.4"></path>

                    </svg>

                </button>

            </div>


            <!-- PROFILE HEADER -->

            <div class="profile-header">

                ${avatar}


                <div class="profile-name">

                    ${escapeHTML(name)}

                </div>


                <div class="profile-email">

                    ${escapeHTML(email)}

                </div>


                <button
                    class="edit-button"
                    onclick="editProfile()">

                    Edit

                </button>

            </div>


            <!-- ACCOUNT INFO -->

            <div class="info-list">


                <div class="info-item">

                    <span class="info-label">
                        Account
                    </span>

                    <span class="info-value">
                        Active
                    </span>

                </div>


                <div class="info-item">

                    <span class="info-label">
                        Member since
                    </span>

                    <span class="info-value">

                        ${formatDate(
                            user.metadata?.creationTime
                        )}

                    </span>

                </div>


                <div class="info-item">

                    <span class="info-label">
                        Favorites
                    </span>

                    <span class="info-value">
                        0
                    </span>

                </div>


                <div class="info-item">

                    <span class="info-label">
                        Comments
                    </span>

                    <span class="info-value">
                        0
                    </span>

                </div>


            </div>


            <!-- FAVORITES -->

            <div class="section-title">

                Favorites

            </div>


            <div class="empty">

                Your favorite anime will appear here.

            </div>


            <!-- LOGOUT -->

            <button
                class="logout-button"
                onclick="logout()">

                Log out

            </button>


        </main>

    `;

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        showProfile(user);

    }
);


/* =========================
   BACK
========================= */

window.goBack =
function(){

    window.location.href =
        "home.html";

};


/* =========================
   EDIT
========================= */

window.editProfile =
function(){

    window.location.href =
        "edit-profile.html";

};


/* =========================
   SHARE
========================= */

window.shareProfile =
async function(){

    try{

        if(navigator.share){

            await navigator.share({

                title:
                    "BerryAnime Profile",

                text:
                    "Check out my BerryAnime profile.",

                url:
                    window.location.href

            });

        }

        else{

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert(
                "Profile link copied."
            );

        }

    }

    catch(error){

        console.log(error);

    }

};


/* =========================
   LOGOUT
========================= */

window.logout =
async function(){

    const confirmLogout =
        confirm(
            "Do you want to log out?"
        );

    if(!confirmLogout){

        return;

    }


    try{

        await signOut(auth);

        window.location.href =
            "index.html";

    }

    catch(error){

        console.log(error);

        alert(
            "Unable to log out."
        );

    }

};

</script>


</body>

</html>

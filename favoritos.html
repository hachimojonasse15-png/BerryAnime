<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BerryAnime - Favoritos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#090909;
}

body{
    min-height:100vh;
    background:#090909;
    color:white;
    padding-bottom:85px;
    overflow-x:hidden;
}

/* =====================================================
   TOPO
===================================================== */

.header{
    height:72px;
    padding:0 16px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:42px;
    height:42px;

    border-radius:50%;
    overflow:hidden;

    background:#171717;

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-button{
    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    transition:.18s;
}

.header-button:active{
    background:#222;
    transform:scale(.92);
}

.header-button svg{
    width:25px;
    height:25px;

    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   PERFIL
===================================================== */

.profile-button{
    width:42px;
    height:42px;

    border-radius:50%;
    overflow:hidden;

    background:#181818;
    border:1px solid #303030;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    flex-shrink:0;
}

.profile-button img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:none;
}

.profile-button svg{
    width:25px;
    height:25px;

    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   TÍTULO
===================================================== */

.page-title{
    padding:8px 15px 15px;

    font-size:27px;
    font-weight:800;
}

/* =====================================================
   FILTROS
===================================================== */

.filters{
    display:flex;
    align-items:center;
    gap:10px;

    padding:0 15px 20px;

    overflow-x:auto;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-button{
    border:0;

    padding:10px 18px;

    border-radius:22px;

    background:#171717;
    color:#999;

    font-size:14px;
    font-weight:600;

    white-space:nowrap;

    cursor:pointer;
}

.filter-button.active{
    background:white;
    color:#111;
}

/* =====================================================
   CONTADOR
===================================================== */

.favorite-count{
    color:#666;
    font-size:12px;

    padding:0 15px 14px;
}

/* =====================================================
   GRELHA
===================================================== */

.favorites-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    padding:0 15px;
}

/* =====================================================
   CARD
===================================================== */

.favorite-card{
    position:relative;
    min-width:0;
    cursor:pointer;

    animation:
        cardAppear .35s ease both;
}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:
            translateY(12px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.favorite-poster{
    width:100%;

    aspect-ratio:2 / 3;

    border-radius:9px;
    overflow:hidden;

    background:#171717;

    position:relative;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.35);
}

.favorite-poster img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:block;
}

.poster-gradient{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:65px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );
}

.favorite-type{
    position:absolute;

    top:7px;
    left:7px;

    padding:4px 7px;

    border-radius:5px;

    background:
        rgba(0,0,0,.72);

    color:white;

    font-size:9px;
    font-weight:bold;
}

.remove-favorite{
    position:absolute;

    top:7px;
    right:7px;

    width:28px;
    height:28px;

    border:0;
    border-radius:50%;

    background:
        rgba(0,0,0,.72);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    z-index:5;
}

.remove-favorite svg{
    width:15px;
    height:15px;

    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.favorite-name{
    margin-top:7px;

    font-size:12px;
    font-weight:600;

    color:#eee;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =====================================================
   ESTADO VAZIO
===================================================== */

.empty-state{
    min-height:
        calc(100vh - 300px);

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    padding:30px;
}

.empty-animation{
    width:150px;
    height:120px;

    position:relative;

    margin-bottom:20px;
}

.empty-card{
    position:absolute;

    width:64px;
    height:90px;

    border-radius:10px;

    background:white;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.35);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#111;

    font-size:34px;
    font-weight:bold;
}

.empty-card.left{
    left:7px;
    top:15px;

    transform:rotate(-23deg);
}

.empty-card.center{
    left:43px;
    top:3px;

    transform:rotate(0deg);

    z-index:2;
}

.empty-card.right{
    right:7px;
    top:15px;

    transform:rotate(23deg);
}

.empty-title{
    font-size:21px;
    font-weight:800;

    margin-bottom:8px;
}

.empty-text{
    color:#777;

    font-size:14px;
    line-height:1.5;

    max-width:300px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:85px;

    transform:
        translate(-50%,20px);

    background:#222;
    color:white;

    padding:11px 17px;

    border-radius:10px;

    font-size:13px;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:300;

    white-space:nowrap;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:68px;

    background:#101010;

    border-top:1px solid #222;

    display:flex;

    align-items:center;
    justify-content:space-around;

    z-index:100;
}

.menu-item{
    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    color:#666;

    cursor:pointer;
}

.menu-item svg{
    width:21px;
    height:21px;

    stroke:currentColor;
    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:11px;
}

.menu-item.active{
    color:white;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:600px){

    .favorites-grid{
        grid-template-columns:
            repeat(3,1fr);

        gap:12px;

        padding:0 14px;
    }

    .page-title{
        font-size:25px;
        padding-left:14px;
    }

    .filters{
        padding-left:14px;
    }

    .favorite-count{
        padding-left:14px;
    }
}

@media(max-width:380px){

    .favorites-grid{
        grid-template-columns:
            repeat(3,1fr);

        gap:9px;

        padding:0 12px;
    }

    .favorite-name{
        font-size:11px;
    }

    .profile-button,
    .header-button{
        width:38px;
        height:38px;
    }
}

</style>

</head>

<body>

<header class="header">

    <div class="logo">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>

    <div class="header-icons">

        <div
            class="header-button"
            onclick="abrirPesquisa()">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path
                    d="M16 16l5 5">
                </path>

            </svg>

        </div>

        <div
            class="profile-button"
            onclick="abrirPerfil()">

            <img
                id="profileImage"
                alt="Perfil">

            <svg
                id="profileIcon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    </div>

</header>

<h1 class="page-title">
    Favoritos
</h1>

<div class="filters">

    <button
        class="filter-button active"
        data-filter="all">

        Tudo

    </button>

    <button
        class="filter-button"
        data-filter="anime">

        Animes

    </button>

    <button
        class="filter-button"
        data-filter="manga">

        Mangás

    </button>

</div>

<div
    id="favoriteCount"
    class="favorite-count">

    0 favoritos

</div>

<div
    id="favoritesGrid"
    class="favorites-grid">
</div>

<div
    id="emptyState"
    class="empty-state">

    <div class="empty-animation">

        <div class="empty-card left">
            ?
        </div>

        <div class="empty-card center">
            ?
        </div>

        <div class="empty-card right">
            ?
        </div>

    </div>

    <div class="empty-title">
        Ainda não há favoritos
    </div>

    <div class="empty-text">
        Adicione os animes e mangás que você
        mais gosta aos seus favoritos.
    </div>

</div>

<div
    id="toast"
    class="toast">
</div>

<div class="bottom-menu">

    <div
        class="menu-item"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>

        </svg>

        <span>Mangás</span>

    </div>

    <div
        class="menu-item active">

        <svg viewBox="0 0 24 24">

            <path
                d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>

        </svg>

        <span>Mais</span>

    </div>

</div>

<!-- JAVASCRIPT -->

  <script>

const FAVORITES_KEY =
    "berryanime_favorites";

const PROFILE_KEY =
    "berryanime_profile_avatar";

let filtroAtual = "all";


/* =====================================================
   ELEMENTOS
===================================================== */

const favoritesGrid =
    document.getElementById(
        "favoritesGrid"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const favoriteCount =
    document.getElementById(
        "favoriteCount"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   LER FAVORITOS
===================================================== */

function obterFavoritos(){

    try{

        const salvo =
            localStorage.getItem(
                FAVORITES_KEY
            );

        if(!salvo){

            return [];

        }

        const dados =
            JSON.parse(salvo);

        return Array.isArray(dados)
            ? dados
            : [];

    }

    catch(error){

        console.error(
            "Erro ao ler favoritos:",
            error
        );

        return [];

    }

}


/* =====================================================
   SALVAR FAVORITOS
===================================================== */

function salvarFavoritos(
    favoritos
){

    try{

        localStorage.setItem(
            FAVORITES_KEY,
            JSON.stringify(
                favoritos
            )
        );

        return true;

    }

    catch(error){

        console.error(
            error
        );

        mostrarToast(
            "Não foi possível salvar"
        );

        return false;

    }

}


/* =====================================================
   NORMALIZAR FAVORITO
===================================================== */

function normalizarFavorito(
    item
){

    if(!item){

        return null;

    }

    const id =
        item.id ??
        item.mal_id ??
        item.animeId ??
        item.mangaId ??
        "";

    const titulo =
        item.title ??
        item.name ??
        item.titulo ??
        "Sem título";

    const imagem =
        item.image ??
        item.image_url ??
        item.poster ??
        item.poster_url ??
        item.images?.jpg?.large_image_url ??
        item.images?.jpg?.image_url ??
        item.images?.webp?.large_image_url ??
        item.images?.webp?.image_url ??
        "BerryAnime_logo_leve.jpg";

    let tipo =
        item.type ??
        item.mediaType ??
        item.media_type ??
        "anime";

    tipo =
        String(tipo)
        .toLowerCase();

    if(
        tipo.includes("manga") ||
        tipo.includes("manhwa") ||
        tipo.includes("manhua")
    ){

        tipo = "manga";

    }

    else{

        tipo = "anime";

    }

    return {

        id:String(id),

        title:String(titulo),

        image:String(imagem),

        type:tipo

    };

}


/* =====================================================
   PREPARAR FAVORITOS
===================================================== */

function prepararFavoritos(){

    const favoritos =
        obterFavoritos();

    const resultado = [];

    favoritos.forEach(
        function(item){

            const favorito =
                normalizarFavorito(
                    item
                );

            if(
                favorito &&
                favorito.id
            ){

                resultado.push(
                    favorito
                );

            }

        }
    );

    return resultado;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
){

    return String(texto)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CRIAR CARD
===================================================== */

function criarCard(
    favorito,
    index
){

    const titulo =
        escaparHTML(
            favorito.title
        );

    const imagem =
        escaparHTML(
            favorito.image
        );

    const tipo =
        favorito.type === "manga"
            ? "MANGÁ"
            : "ANIME";

    return `

        <article
            class="favorite-card"
            style="
                animation-delay:
                ${index * 0.04}s
            "
            onclick="
                abrirFavorito(
                    '${encodeURIComponent(favorito.id)}',
                    '${favorito.type}'
                )
            ">

            <div class="favorite-poster">

                <img
                    src="${imagem}"
                    alt="${titulo}"
                    loading="lazy"
                    onerror="
                        this.src=
                        'BerryAnime_logo_leve.jpg'
                    ">

                <div class="poster-gradient">
                </div>

                <div class="favorite-type">
                    ${tipo}
                </div>

                <button
                    class="remove-favorite"
                    onclick="
                        event.stopPropagation();
                        removerFavorito(
                            '${favorito.id}',
                            '${favorito.type}'
                        )
                    ">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M6 6l12 12">
                        </path>

                        <path
                            d="M18 6L6 18">
                        </path>

                    </svg>

                </button>

            </div>

            <div class="favorite-name">
                ${titulo}
            </div>

        </article>

    `;

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarFavoritos(){

    const favoritos =
        prepararFavoritos();

    let lista =
        favoritos;


    if(
        filtroAtual !== "all"
    ){

        lista =
            favoritos.filter(
                function(item){

                    return (
                        item.type ===
                        filtroAtual
                    );

                }
            );

    }


    const total =
        favoritos.length;


    favoriteCount.textContent =
        total === 1
            ? "1 favorito"
            : total + " favoritos";


    if(
        lista.length === 0
    ){

        favoritesGrid.innerHTML =
            "";

        emptyState.style.display =
            "flex";

        return;

    }


    emptyState.style.display =
        "none";


    favoritesGrid.innerHTML =
        lista
            .map(
                criarCard
            )
            .join("");

}


/* =====================================================
   REMOVER FAVORITO
===================================================== */

function removerFavorito(
    id,
    tipo
){

    const favoritos =
        obterFavoritos();

    const novaLista =
        favoritos.filter(
            function(item){

                const favorito =
                    normalizarFavorito(
                        item
                    );

                if(!favorito){

                    return false;

                }

                return !(
                    String(
                        favorito.id
                    ) === String(id)
                    &&
                    favorito.type === tipo
                );

            }
        );


    if(
        salvarFavoritos(
            novaLista
        )
    ){

        mostrarToast(
            "Removido dos favoritos"
        );

        setTimeout(
            function(){

                renderizarFavoritos();

            },
            180
        );

    }

}


/* =====================================================
   ABRIR FAVORITO
===================================================== */

function abrirFavorito(
    id,
    tipo
){

    const valor =
        decodeURIComponent(
            id
        );


    if(
        tipo === "manga"
    ){

        window.location.href =
            "manga.html?id=" +
            encodeURIComponent(
                valor
            );

        return;

    }


    window.location.href =
        "detalhes.html?id=" +
        encodeURIComponent(
            valor
        );

}


/* =====================================================
   FILTROS
===================================================== */

const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


filterButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                filterButtons.forEach(
                    function(item){

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                filtroAtual =
                    button.dataset.filter;


                renderizarFavoritos();

            }
        );

    }
);


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function mostrarToast(
    mensagem
){

    toast.textContent =
        mensagem;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   PERFIL
===================================================== */

function carregarPerfil(){

    const imagem =
        localStorage.getItem(
            PROFILE_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}


function abrirPesquisa(){

    mostrarToast(
        "Pesquisa em breve"
    );

}


/* =====================================================
   ATUALIZAÇÕES
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            PROFILE_KEY
        ){

            carregarPerfil();

        }

        if(
            event.key ===
            FAVORITES_KEY
        ){

            renderizarFavoritos();

        }

    }
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden
        ){

            carregarPerfil();

            renderizarFavoritos();

        }

    }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

carregarPerfil();

renderizarFavoritos();

</script>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Favoritos</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#090909;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(255,23,68,.08),
            transparent 35%
        ),
        #090909;

    color:white;

    padding-bottom:90px;

    overflow-x:hidden;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.header{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    position:relative;

    z-index:20;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:43px;
    height:43px;

    border-radius:50%;

    overflow:hidden;

    background:#171717;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 15px rgba(255,23,68,.18);
}

.logo img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =====================================================
   ÍCONES
===================================================== */

.header-icons{

    display:flex;

    align-items:center;

    gap:10px;
}

.header-button{

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;

    overflow:hidden;

    transition:
        transform .18s ease,
        background .18s ease;
}

.header-button:active{

    transform:scale(.90);

    background:#202020;
}

.header-button svg{

    width:25px;
    height:25px;

    stroke:white;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   PERFIL
===================================================== */

.profile-button{

    width:43px;
    height:43px;

    border-radius:50%;

    overflow:hidden;

    background:#181818;

    border:1px solid #303030;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;

    transition:
        transform .18s ease,
        border-color .18s ease;
}

.profile-button:active{

    transform:scale(.90);

    border-color:#ff1744;
}

.profile-button img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.profile-button svg{

    width:25px;
    height:25px;

    stroke:#ddd;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   ANIMAÇÃO DO PERFIL
===================================================== */

.profile-button.animar::after{

    content:"";

    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    border:2px solid #ff1744;

    animation:
        perfilRipple .55s ease-out forwards;
}

@keyframes perfilRipple{

    0%{
        width:10px;
        height:10px;
        opacity:.9;
    }

    100%{
        width:75px;
        height:75px;
        opacity:0;
    }
}


/* =====================================================
   CONTEÚDO
===================================================== */

.main{

    width:100%;

    max-width:700px;

    margin:0 auto;

    padding:12px 15px 30px;
}


/* =====================================================
   TÍTULO
===================================================== */

.page-title{

    font-size:30px;

    font-weight:800;

    letter-spacing:-.5px;

    margin-top:8px;

    margin-bottom:20px;
}

.page-title .red{

    color:#ff1744;
}


/* =====================================================
   FILTROS
===================================================== */

.filters{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:25px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{

    border:0;

    background:transparent;

    color:#888;

    font-size:16px;

    font-weight:700;

    padding:10px 18px;

    border-radius:22px;

    cursor:pointer;

    white-space:nowrap;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.filter:active{

    transform:scale(.94);
}

.filter.active{

    color:#111;

    background:white;

    box-shadow:
        0 4px 15px rgba(255,255,255,.08);
}


/* =====================================================
   GRADE
===================================================== */

.favorites-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    width:100%;
}


/* =====================================================
   CARD
===================================================== */

.favorite-card{

    min-width:0;

    position:relative;

    cursor:pointer;

    animation:
        cardAppear .35s ease both;
}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.poster{

    width:100%;

    aspect-ratio:
        2 / 3;

    border-radius:10px;

    overflow:hidden;

    background:#171717;

    position:relative;

    box-shadow:
        0 5px 15px rgba(0,0,0,.35);
}

.poster img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .25s ease;
}

.favorite-card:active .poster img{

    transform:scale(1.04);
}


/* =====================================================
   SOMBRA
===================================================== */

.poster-shadow{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );

    pointer-events:none;
}


/* =====================================================
   TIPO
===================================================== */

.type-badge{

    position:absolute;

    top:7px;
    left:7px;

    padding:4px 7px;

    border-radius:6px;

    background:
        rgba(0,0,0,.72);

    color:#fff;

    font-size:9px;

    font-weight:700;

    backdrop-filter:blur(5px);
}


/* =====================================================
   REMOVER
===================================================== */

.remove-favorite{

    position:absolute;

    top:6px;
    right:6px;

    width:31px;
    height:31px;

    border-radius:50%;

    border:0;

    background:
        rgba(0,0,0,.72);

    color:#ff1744;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:5;

    backdrop-filter:blur(5px);

    transition:
        transform .15s ease,
        background .15s ease;
}

.remove-favorite:active{

    transform:scale(.82);

    background:#ff1744;

    color:white;
}

.remove-favorite svg{

    width:17px;
    height:17px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   NOME
===================================================== */

.favorite-title{

    margin-top:8px;

    font-size:13px;

    font-weight:700;

    color:white;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.favorite-info{

    margin-top:4px;

    font-size:11px;

    color:#777;
}


/* =====================================================
   ESTADO VAZIO
===================================================== */

.empty{

    min-height:470px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px 15px;

    animation:
        emptyAppear .45s ease;
}

@keyframes emptyAppear{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   ÍCONE VAZIO BERRY
===================================================== */

.empty-visual{

    width:170px;

    height:125px;

    position:relative;

    margin-bottom:25px;
}

.empty-berry{

    position:absolute;

    width:76px;
    height:76px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ff758f,
            #ff1744 55%,
            #b9002d
        );

    box-shadow:
        0 12px 30px rgba(255,23,68,.25);

    left:47px;
    top:28px;

    animation:
        berryFloat 2.8s ease-in-out infinite;
}

.empty-berry::before,
.empty-berry::after{

    content:"";

    position:absolute;

    width:23px;
    height:13px;

    background:#47a447;

    top:-6px;

    border-radius:
        100% 0 100% 0;
}

.empty-berry::before{

    left:18px;

    transform:rotate(25deg);
}

.empty-berry::after{

    right:18px;

    transform:rotate(-25deg);
}

@keyframes berryFloat{

    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }

    50%{
        transform:translateY(-9px) rotate(2deg);
    }
}


/* =====================================================
   CORAÇÕES AO REDOR
===================================================== */

.empty-heart{

    position:absolute;

    color:#ff1744;

    opacity:.75;

    font-size:28px;

    animation:
        heartFloat 2.5s ease-in-out infinite;
}

.empty-heart.one{

    left:10px;
    top:55px;
}

.empty-heart.two{

    right:10px;
    top:40px;

    font-size:20px;

    animation-delay:.5s;
}

.empty-heart.three{

    right:25px;
    bottom:0;

    font-size:15px;

    animation-delay:1s;
}

@keyframes heartFloat{

    0%,100%{
        transform:translateY(0);
        opacity:.55;
    }

    50%{
        transform:translateY(-8px);
        opacity:1;
    }
}


/* =====================================================
   TEXTO VAZIO
===================================================== */

.empty-title{

    font-size:22px;

    font-weight:800;

    margin-bottom:8px;
}

.empty-sub{

    color:#888;

    font-size:14px;

    line-height:1.5;

    max-width:320px;
}

.empty-button{

    margin-top:20px;

    border:0;

    background:#ff1744;

    color:white;

    border-radius:13px;

    padding:13px 22px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.empty-button:active{

    transform:scale(.94);

    background:#dc123b;
}


/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:68px;

    background:
        rgba(16,16,16,.97);

    border-top:1px solid #242424;

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:100;

    backdrop-filter:blur(12px);
}

.menu-item{

    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    color:#666;

    cursor:pointer;

    transition:.2s;
}

.menu-item svg{

    width:22px;
    height:22px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.menu-item span{

    font-size:11px;
}

.menu-item.active{

    color:white;
}

.menu-item.active svg{

    stroke:#ff1744;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .main{
        padding-left:14px;
        padding-right:14px;
    }

    .page-title{
        font-size:29px;
    }

    .favorites-grid{
        grid-template-columns:
            repeat(3,1fr);

        gap:11px;
    }

    .favorite-title{
        font-size:12px;
    }

    .favorite-info{
        font-size:10px;
    }

    .remove-favorite{
        width:29px;
        height:29px;
    }

}

@media(max-width:380px){

    .favorites-grid{
        gap:9px;
    }

    .page-title{
        font-size:27px;
    }

    .empty{
        min-height:430px;
    }

    .empty-visual{
        transform:scale(.9);
    }

}


/* =====================================================
   ANIMAÇÃO DE REMOÇÃO
===================================================== */

.favorite-card.removing{

    animation:
        removeCard .28s ease forwards;
}

@keyframes removeCard{

    to{
        opacity:0;
        transform:
            scale(.75)
            rotate(4deg);
    }
}

</style>

</head>


<body>

<script>


/* =====================================================
   AVATAR DO PERFIL
===================================================== */

function carregarPerfil(){

    const imagem =
        localStorage.getItem(
            "berryanime_profile_avatar"
        ) ||
        localStorage.getItem(
            "berryanime_profile_image"
        );


    const img =
        document.getElementById(
            "profileImage"
        );

    const icon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        img.src =
            imagem;

        img.style.display =
            "block";

        icon.style.display =
            "none";

    }

}


function abrirPerfil(){

    const botao =
        document.getElementById(
            "profileButton"
        );


    botao.classList.add(
        "animar"
    );


    setTimeout(
        function(){

            window.location.href =
                "perfil.html";

        },
        180
    );

}


function abrirPesquisa(){

    window.location.href =
        "pesquisa.html";

}


/* =====================================================
   FAVORITOS
===================================================== */

/*
   O BerryAnime procura os favoritos
   nesta chave:

   berryanime_favorites

   Formato esperado:

   [
       {
           id: 1,
           title: "Nome do anime",
           image: "imagem.jpg",
           type: "anime"
       }
   ]

*/


const FAVORITES_KEY =
    "berryanime_favorites";


let favoritos = [];

let filtroAtual =
    "all";


const container =
    document.getElementById(
        "favoritesContainer"
    );


/* =====================================================
   CARREGAR FAVORITOS
===================================================== */

function carregarFavoritos(){

    try{

        const salvo =
            localStorage.getItem(
                FAVORITES_KEY
            );


        if(!salvo){

            favoritos = [];

            return;

        }


        const dados =
            JSON.parse(
                salvo
            );


        if(Array.isArray(dados)){

            favoritos =
                dados;

        }

        else{

            favoritos = [];

        }

    }

    catch(error){

        console.error(
            "Erro ao carregar favoritos:",
            error
        );

        favoritos = [];

    }

}

   SALVAR FAVORITOS
===================================================== */

function

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Meu Perfil</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#090909;
    color:white;
}

.content{
    width:100%;
    max-width:680px;
    margin:0 auto;
    padding:22px 23px 50px;
}


/* =====================================================
   TOPO
===================================================== */

.header{
    height:55px;
    display:flex;
    align-items:center;
    margin-bottom:25px;
}

.back{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    cursor:pointer;
}

.back svg{
    width:29px;
    height:29px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{
    margin-left:18px;
    font-size:27px;
    font-weight:700;
}


/* =====================================================
   CARTÃO
===================================================== */

.profile-card{
    width:100%;
    background:#151515;
    border:1px solid #303030;
    border-radius:24px;
    padding:28px 22px;
    text-align:center;
}


/* =====================================================
   AVATAR
===================================================== */

.avatar-area{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.avatar{
    width:105px;
    height:105px;
    border-radius:50%;
    border:2px solid #ff1744;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 0 22px rgba(255,23,68,.18);
    cursor:pointer;
    position:relative;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:50%;
}

.avatar-overlay{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:.2s;
}

.avatar:hover .avatar-overlay,
.avatar:active .avatar-overlay{
    opacity:1;
}

.avatar-overlay svg{
    width:30px;
    height:30px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.avatar-help{
    margin-top:10px;
    color:#888;
    font-size:13px;
}

.file-input{
    display:none;
}

.remove-avatar{
    margin-top:9px;
    border:0;
    background:transparent;
    color:#ff1744;
    font-size:13px;
    cursor:pointer;
}


/* =====================================================
   USUÁRIO
===================================================== */

.user-name{
    margin-top:18px;
    font-size:25px;
    font-weight:800;
}

.user-email{
    margin-top:7px;
    color:#999;
    font-size:14px;
    word-break:break-word;
}

.account-label{
    display:inline-block;
    margin-top:14px;
    padding:6px 12px;
    border-radius:20px;
    background:#211014;
    color:#ff1744;
    font-size:12px;
    font-weight:700;
}

.primary-button{
    width:100%;
    margin-top:20px;
    min-height:52px;
    border:0;
    border-radius:14px;
    background:#ff1744;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.primary-button:active{
    transform:scale(.98);
    background:#e9143d;
}


/* =====================================================
   SEÇÕES
===================================================== */

.section{
    width:100%;
    background:#151515;
    border:1px solid #303030;
    border-radius:20px;
    padding:20px;
    margin-top:16px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:13px;
}

.info-row{
    min-height:60px;
    display:flex;
    align-items:center;
}

.info-row + .info-row{
    border-top:1px solid #252525;
}

.info-icon{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.info-icon svg{
    width:24px;
    height:24px;
    stroke:#ff1744;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.info-text{
    flex:1;
    min-width:0;
    margin-left:13px;
}

.info-label{
    color:#777;
    font-size:12px;
    margin-bottom:4px;
}

.info-value{
    color:white;
    font-size:14px;
    word-break:break-word;
}

.copy-button{
    border:0;
    background:#222;
    color:#aaa;
    border-radius:9px;
    padding:8px 10px;
    cursor:pointer;
    font-size:12px;
}


/* =====================================================
   SAIR
===================================================== */

.danger{
    margin-top:16px;
    width:100%;
    background:#151515;
    border:1px solid #303030;
    border-radius:20px;
    overflow:hidden;
}

.danger-button{
    width:100%;
    min-height:70px;
    padding:15px 20px;
    border:0;
    background:transparent;
    color:#ff1744;
    display:flex;
    align-items:center;
    cursor:pointer;
    text-align:left;
}

.danger-button:active{
    background:#211014;
}

.danger-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.danger-icon svg{
    width:26px;
    height:26px;
    stroke:#ff1744;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.danger-text{
    margin-left:15px;
}

.danger-title{
    font-size:16px;
    font-weight:700;
}

.danger-sub{
    margin-top:4px;
    color:#888;
    font-size:13px;
}


/* =====================================================
   RODAPÉ
===================================================== */

.footer{
    text-align:center;
    margin-top:30px;
    color:#666;
    font-size:13px;
    line-height:1.6;
}


@media(max-width:380px){

    .content{
        padding-left:16px;
        padding-right:16px;
    }

    .header-title{
        font-size:25px;
    }

    .profile-card{
        padding:24px 17px;
    }

    .avatar{
        width:90px;
        height:90px;
    }

    .user-name{
        font-size:23px;
    }

    .section{
        padding:17px;
    }

}

</style>

</head>

<body>

<main class="content">


<!-- =====================================================
     TOPO
===================================================== -->

<header class="header">

    <div
        class="back"
        onclick="voltar()">

        <svg viewBox="0 0 24 24">

            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>

        </svg>

    </div>

    <div class="header-title">
        Meu Perfil
    </div>

</header>


<!-- =====================================================
     PERFIL
===================================================== -->

<section class="profile-card">

    <div class="avatar-area">

        <input
            type="file"
            id="avatarInput"
            class="file-input"
            accept="image/*">


        <div
            class="avatar"
            id="avatarButton">

            <img
                id="avatarImage"
                src="BerryAnime_logo_leve.jpg"
                alt="Foto de perfil">

            <div class="avatar-overlay">

                <svg viewBox="0 0 24 24">

                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>

                </svg>

            </div>

        </div>


        <div class="avatar-help">
            Toque na imagem para escolher da galeria
        </div>


        <button
            class="remove-avatar"
            id="removeAvatarButton">

            Restaurar avatar do BerryAnime

        </button>

    </div>


    <div
        id="userName"
        class="user-name">

        Carregando...

    </div>


    <div
        id="userEmail"
        class="user-email">

        ...

    </div>


    <div class="account-label">
        CONTA BERRYANIME
    </div>


    <button
        class="primary-button"
        onclick="editarNome()">

        Editar nome

    </button>

</section>


<!-- =====================================================
     INFORMAÇÕES
===================================================== -->

<section class="section">

    <div class="section-title">
        Informações da conta
    </div>


    <!-- EMAIL -->

    <div class="info-row">

        <div class="info-icon">

            <svg viewBox="0 0 24 24">

                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="2">
                </rect>

                <path d="M3 7l9 6 9-6"></path>

            </svg>

        </div>

        <div class="info-text">

            <div class="info-label">
                E-mail
            </div>

            <div
                id="emailInfo"
                class="info-value">

                ...

            </div>

        </div>

    </div>


    <!-- ID -->

    <div class="info-row">

        <div class="info-icon">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="8">
                </circle>

                <path d="M8 12h8"></path>
                <path d="M12 8v8"></path>

            </svg>

        </div>

        <div class="info-text">

            <div class="info-label">
                ID da conta
            </div>

            <div
                id="uidInfo"
                class="info-value">

                ...

            </div>

        </div>

        <button
            class="copy-button"
            onclick="copiarID()">

            Copiar

        </button>

    </div>


    <!-- DATA -->

    <div class="info-row">

        <div class="info-icon">

            <svg viewBox="0 0 24 24">

                <rect
                    x="4"
                    y="5"
                    width="16"
                    height="15"
                    rx="2">
                </rect>

                <path d="M8 3v4"></path>
                <path d="M16 3v4"></path>
                <path d="M4 10h16"></path>

            </svg>

        </div>

        <div class="info-text">

            <div class="info-label">
                Conta criada em
            </div>

            <div
                id="createdInfo"
                class="info-value">

                ...

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     SAIR
===================================================== -->

<section class="danger">

    <button
        class="danger-button"
        onclick="sairDaConta()">

        <div class="danger-icon">

            <svg viewBox="0 0 24 24">

                <path
                    d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5">
                </path>

                <path d="M14 8l5 4-5 4"></path>
                <path d="M19 12H9"></path>

            </svg>

        </div>

        <div class="danger-text">

            <div class="danger-title">
                Sair da conta
            </div>

            <div class="danger-sub">
                Encerrar sua sessão no BerryAnime
            </div>

        </div>

    </button>

</section>


<div class="footer">

    BerryAnime<br>
    Perfil da conta<br>
    Versão 1.0

</div>


</main>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged,
    updateProfile,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


let usuarioAtual = null;


/* =====================================================
   MESMA CHAVE DA HOME
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";


/* =====================================================
   ELEMENTOS
===================================================== */

const avatarInput =
    document.getElementById(
        "avatarInput"
    );

const avatarButton =
    document.getElementById(
        "avatarButton"
    );

const avatarImage =
    document.getElementById(
        "avatarImage"
    );

const removeAvatarButton =
    document.getElementById(
        "removeAvatarButton"
    );


/* =====================================================
   CARREGAR AVATAR
===================================================== */

function carregarAvatar(){

    const avatarSalvo =
        localStorage.getItem(
            AVATAR_KEY
        );


    if(
        avatarSalvo &&
        avatarSalvo.trim() !== ""
    ){

        avatarImage.src =
            avatarSalvo;

    }

    else{

        avatarImage.src =
            "BerryAnime_logo_leve.jpg";

    }

}


carregarAvatar();


/* =====================================================
   ABRIR GALERIA
===================================================== */

avatarButton.addEventListener(
    "click",
    function(){

        avatarInput.click();

    }
);


/* =====================================================
   ESCOLHER IMAGEM
===================================================== */

avatarInput.addEventListener(
    "change",
    function(event){

        const arquivo =
            event.target.files[0];


        if(!arquivo){

            return;

        }


        if(
            !arquivo.type.startsWith(
                "image/"
            )
        ){

            alert(
                "Escolha uma imagem válida."
            );

            return;

        }


        const leitor =
            new FileReader();


        leitor.onload =
        function(e){

            const imagem =
                e.target.result;


            avatarImage.src =
                imagem;


            try{

                localStorage.setItem(
                    AVATAR_KEY,
                    imagem
                );

            }

            catch(error){

                console.error(error);

                alert(
                    "A imagem é muito grande. Escolha uma imagem menor."
                );

            }

        };


        leitor.readAsDataURL(
            arquivo
        );

    }
);


/* =====================================================
   RESTAURAR AVATAR
===================================================== */

removeAvatarButton.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            AVATAR_KEY
        );


        avatarImage.src =
            "BerryAnime_logo_leve.jpg";


        avatarInput.value =
            "";

    }
);


/* =====================================================
   FIREBASE
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.replace(
                "index.html"
            );

            return;

        }


        usuarioAtual =
            user;


        let nome =
            user.displayName;


        if(
            !nome &&
            user.email
        ){

            nome =
                user.email
                .split("@")[0];

        }


        document
        .getElementById("userName")
        .textContent =
            nome || "Usuário";


        document
        .getElementById("userEmail")
        .textContent =
            user.email ||
            "Sem e-mail";


        document
        .getElementById("emailInfo")
        .textContent =
            user.email ||
            "Sem e-mail";


        document
        .getElementById("uidInfo")
        .textContent =
            user.uid;


        if(
            user.metadata &&
            user.metadata.creationTime
        ){

            const data =
                new Date(
                    user.metadata.creationTime
                );


            document
            .getElementById("createdInfo")
            .textContent =
                data.toLocaleDateString(
                    "pt-BR"
                );

        }

        else{

            document
            .getElementById("createdInfo")
            .textContent =
                "Indisponível";

        }

    }
);


/* =====================================================
   VOLTAR
===================================================== */

window.voltar =
function(){

    window.location.href =
        "mais.html";

};


/* =====================================================
   EDITAR NOME
===================================================== */

window.editarNome =
async function(){

    if(!usuarioAtual){

        alert(
            "Aguarde o carregamento da conta."
        );

        return;

    }


    const nomeAtual =
        usuarioAtual.displayName || "";


    const novoNome =
        prompt(
            "Digite o novo nome:",
            nomeAtual
        );


    if(novoNome === null){

        return;

    }


    const nome =
        novoNome.trim();


    if(!nome){

        alert(
            "Digite um nome válido."
        );

        return;

    }


    if(nome.length > 40){

        alert(
            "O nome deve ter no máximo 40 caracteres."
        );

        return;

    }


    try{

        await updateProfile(
            usuarioAtual,
            {
                displayName:nome
            }
        );


        document
        .getElementById("userName")
        .textContent =
            nome;


        alert(
            "Nome atualizado com sucesso!"
        );

    }

    catch(error){

        console.error(error);

        alert(
            "Não foi possível atualizar o nome."
        );

    }

};


/* =====================================================
   COPIAR ID
===================================================== */

window.copiarID =
async function(){

    if(!usuarioAtual){

        return;

    }


    const id =
        usuarioAtual.uid;


    try{

        await navigator.clipboard.writeText(
            id
        );

        alert(
            "ID copiado!"
        );

    }

    catch(error){

        prompt(
            "Copie o ID da sua conta:",
            id
        );

    }

};


/* =====================================================
   SAIR
===================================================== */

window.sairDaConta =
async function(){

    const confirmar =
        confirm(
            "Deseja realmente sair da sua conta?"
        );


    if(!confirmar){

        return;

    }


    try{

        await signOut(auth);


        window.location.replace(
            "index.html"
        );

    }

    catch(error){

        console.error(error);

        alert(
            "Não foi possível sair da conta."
        );

    }

};

</script>

</body>

      </html>

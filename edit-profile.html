<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime - Edit Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
    padding:20px 16px 40px;
}

.edit-page{
    width:100%;
    max-width:430px;
    margin:auto;
}

/* =========================
   TOP
========================= */

.top{
    height:48px;

    display:flex;
    align-items:center;

    margin-bottom:28px;
}

.back-button{
    width:40px;
    height:40px;

    border:0;
    background:transparent;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.back-button svg{
    width:24px;
    height:24px;

    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   TITLE
========================= */

.page-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:28px;
}

/* =========================
   AVATAR
========================= */

.avatar-area{
    display:flex;
    flex-direction:column;
    align-items:center;

    margin-bottom:30px;
}

.avatar{
    width:100px;
    height:100px;

    border-radius:50%;

    background:#151515;

    border:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.avatar svg{
    width:48px;
    height:48px;

    fill:none;
    stroke:#888;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-button{
    margin-top:12px;

    border:0;
    background:transparent;

    color:#ff1744;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
}

/* =========================
   INPUTS
========================= */

.label{
    display:block;

    color:#aaa;

    font-size:13px;

    margin-bottom:8px;
}

.input{
    width:100%;
    height:54px;

    border:1px solid #303030;
    border-radius:11px;

    background:#151515;
    color:white;

    outline:none;

    padding:0 15px;

    font-size:15px;

    margin-bottom:20px;
}

.input:focus{
    border-color:#ff1744;
}

/* =========================
   SAVE
========================= */

.save-button{
    width:100%;
    height:55px;

    border:0;
    border-radius:11px;

    background:#ff1744;

    color:white;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    margin-top:8px;
}

.save-button:active{
    transform:scale(.98);
}

.save-button:disabled{
    opacity:.6;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-top:15px;

    text-align:center;

    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    body{
        padding-left:14px;
        padding-right:14px;
    }

    .avatar{
        width:90px;
        height:90px;
    }

    .page-title{
        font-size:20px;
    }

}

</style>

</head>

<body>

<div id="app">

    <div class="edit-page">

        <div class="top">

            <button
                class="back-button"
                onclick="goBack()"
                aria-label="Back">

                <svg viewBox="0 0 24 24">

                    <path d="M19 12H5"></path>

                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

            </button>

        </div>


        <div class="page-title">
            Edit Profile
        </div>


        <div class="avatar-area">

            <div
                class="avatar"
                id="avatar">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="4">
                    </circle>

                    <path
                        d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                    </path>

                </svg>

            </div>

            <button
                class="photo-button"
                onclick="choosePhoto()">

                Change photo

            </button>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                hidden>

        </div>


        <label class="label">
            Display name
        </label>

        <input
            id="nameInput"
            class="input"
            type="text"
            placeholder="Your name"
            maxlength="40">


        <label class="label">
            Email
        </label>

        <input
            id="emailInput"
            class="input"
            type="email"
            disabled>


        <button
            id="saveButton"
            class="save-button">

            Save changes

        </button>


        <div
            id="message"
            class="message">
        </div>

    </div>

</div>


<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const avatar =
    document.getElementById("avatar");

const nameInput =
    document.getElementById("nameInput");

const emailInput =
    document.getElementById("emailInput");

const photoInput =
    document.getElementById("photoInput");

const saveButton =
    document.getElementById("saveButton");

const message =
    document.getElementById("message");


let currentUser = null;

let selectedPhoto = null;


/* =========================
   USER ICON
========================= */

function userIcon(){

    return `

        <svg viewBox="0 0 24 24">

            <circle
                cx="12"
                cy="8"
                r="4">
            </circle>

            <path
                d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
            </path>

        </svg>

    `;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,success=false){

    message.style.display = "block";

    message.textContent = text;

    message.style.color =
        success
        ? "#4cff88"
        : "#ff6b81";

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser = user;

        nameInput.value =
            user.displayName ||
            user.email?.split("@")[0] ||
            "";

        emailInput.value =
            user.email || "";

        if(user.photoURL){

            avatar.innerHTML = `

                <img
                    src="${user.photoURL}"
                    alt="Profile">

            `;

        }

    }
);


/* =========================
   PHOTO
========================= */

window.choosePhoto =
function(){

    photoInput.click();

};


photoInput.addEventListener(
    "change",
    function(){

        const file =
            photoInput.files[0];

        if(!file){
            return;
        }

        selectedPhoto = file;

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                avatar.innerHTML = `

                    <img
                        src="${event.target.result}"
                        alt="Profile">

                `;

            };

        reader.readAsDataURL(file);

    }
);


/* =========================
   SAVE
========================= */

saveButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){
            return;
        }

        const name =
            nameInput.value.trim();

        if(!name){

            showMessage(
                "Please enter your name."
            );

            return;

        }

        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        try{

            /*
             * O nome é salvo diretamente
             * no Firebase Authentication.
             */

            await updateProfile(
                currentUser,
                {
                    displayName:name
                }
            );


            /*
             * A foto selecionada é mostrada
             * imediatamente nesta tela.
             *
             * Para guardar a foto permanentemente
             * no Firebase Storage, faremos essa
             * parte no próximo passo.
             */

            showMessage(
                "Profile updated successfully.",
                true
            );


            setTimeout(
                function(){

                    window.location.href =
                        "profile.html";

                },
                1200
            );


        }

        catch(error){

            console.log(error);

            showMessage(
                error.code +
                ": " +
                error.message
            );

            saveButton.disabled = false;

            saveButton.textContent =
                "Save changes";

        }

    }
);


/* =========================
   BACK
========================= */

window.goBack =
function(){

    window.location.href =
        "profile.html";

};

</script>

</body>

  </html>

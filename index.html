<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050505;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}


/* =====================================================
   TELAS
===================================================== */

.screen{
    position:absolute;
    inset:0;

    width:100%;
    height:100vh;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:hidden;
}


/* =====================================================
   SPLASH
===================================================== */

#splash{

    background:#050505;

    justify-content:center;

    z-index:10;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#splash.hidden{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =====================================================
   LOGO DA SPLASH
===================================================== */

.splash-content{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    transform:translateY(25px);
}


/* =====================================================
   MORANGO
===================================================== */

.berry-logo{

    width:235px;

    height:235px;

    object-fit:contain;

    display:block;
}


/* =====================================================
   NOME BERRYANIME
===================================================== */

.logo-name{

    margin-top:5px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:43px;

    font-weight:900;

    letter-spacing:-2px;

    line-height:1;
}

.logo-name .berry{
    color:#ff1744;
}

.logo-name .anime{
    color:#ffffff;
}


/* =====================================================
   CÍRCULO DE CARREGAMENTO
===================================================== */

.loader{

    width:55px;

    height:55px;

    border-radius:50%;

    border:5px solid rgba(255,23,68,.18);

    border-top-color:#ff1744;

    border-right-color:#ff1744;

    margin-top:105px;

    animation:
        spin .8s linear infinite;
}


@keyframes spin{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}


/* =====================================================
   LOGIN
===================================================== */

#login{

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(190,0,45,.28),
            transparent 35%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(255,0,65,.13),
            transparent 30%
        ),

        #080808;

    justify-content:flex-start;

    padding:

        55px
        24px
        30px;

    opacity:0;

    visibility:hidden;

    transform:translateX(20px);

    transition:
        opacity .6s ease,
        transform .6s ease,
        visibility .6s ease;
}

#login.show{

    opacity:1;

    visibility:visible;

    transform:translateX(0);
}


/* =====================================================
   DECORAÇÃO DE FUNDO
===================================================== */

.background-glow{

    position:absolute;

    width:320px;

    height:320px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,65,.12),
            transparent 70%
        );

    top:-100px;

    right:-120px;

    pointer-events:none;
}


/* =====================================================
   CONTEÚDO LOGIN
===================================================== */

.login-content{

    position:relative;

    z-index:2;

    width:100%;

    max-width:430px;

    display:flex;

    flex-direction:column;

    align-items:center;

    margin-top:5px;
}


/* =====================================================
   LOGO LOGIN
===================================================== */

.login-logo{

    width:230px;

    height:230px;

    object-fit:contain;
}


/* =====================================================
   TÍTULO LOGIN
===================================================== */

.login-brand{

    margin-top:-8px;

    font-size:43px;

    font-weight:900;

    letter-spacing:-2px;
}

.login-brand .berry{
    color:#ff1744;
}

.login-brand .anime{
    color:white;
}


/* =====================================================
   DESCRIÇÃO
===================================================== */

.subtitle{

    margin-top:17px;

    text-align:center;

    font-size:18px;

    line-height:1.45;

    color:#eeeeee;

    max-width:330px;
}


/* =====================================================
   BOTÕES
===================================================== */

.buttons{

    width:100%;

    margin-top:65px;

    display:flex;

    flex-direction:column;

    gap:18px;
}


/* =====================================================
   BOTÃO LOGIN
===================================================== */

.btn{

    width:100%;

    min-height:64px;

    border-radius:14px;

    font-size:21px;

    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    font-family:Arial, sans-serif;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.btn:active{

    transform:scale(.97);

    opacity:.85;
}


.login-btn{

    background:transparent;

    color:#ff1744;

    border:2px solid #ff1744;
}


/* =====================================================
   BOTÃO REGISTRAR
===================================================== */

.register-btn{

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ed274e
        );

    color:white;

    border:0;
}


/* =====================================================
   OU
===================================================== */

.or{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    margin:0;
}

.or::before,
.or::after{

    content:"";

    height:1px;

    flex:1;

    background:#383838;
}

.or span{

    font-size:17px;

    font-weight:700;

    color:#999999;
}


/* =====================================================
   GOOGLE
===================================================== */

.google-btn{

    width:100%;

    min-height:64px;

    border:0;

    border-radius:13px;

    background:white;

    color:#333333;

    font-size:19px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    cursor:pointer;
}

.google-icon{

    font-size:27px;

    font-weight:900;

    color:#4285f4;
}


/* =====================================================
   DECORAÇÕES
===================================================== */

.decor{

    position:absolute;

    z-index:1;

    border-radius:50%;

    background:rgba(255,23,68,.15);
}

.decor.one{

    width:100px;

    height:100px;

    left:-55px;

    bottom:-30px;
}

.decor.two{

    width:70px;

    height:70px;

    right:-35px;

    bottom:100px;
}


/* =====================================================
   TELAS PEQUENAS
===================================================== */

@media(max-height:700px){

    #login{

        padding-top:25px;

    }

    .login-logo{

        width:170px;
        height:170px;
    }

    .login-brand{

        font-size:35px;
    }

    .subtitle{

        font-size:16px;

        margin-top:10px;
    }

    .buttons{

        margin-top:30px;

        gap:12px;
    }

    .btn,
    .google-btn{

        min-height:54px;
    }

}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-width:380px){

    .berry-logo{

        width:190px;
        height:190px;
    }

    .logo-name{

        font-size:36px;
    }

    .loader{

        width:45px;
        height:45px;

        margin-top:85px;
    }

    .login-logo{

        width:180px;
        height:180px;
    }

    .login-brand{

        font-size:36px;
    }

    .subtitle{

        font-size:16px;
    }

}


/* =====================================================
   CELULARES ALTOS
===================================================== */

@media(min-height:800px){

    .berry-logo{

        width:250px;
        height:250px;
    }

    .loader{

        margin-top:110px;
    }

}

</style>

</head>


<body>


<!-- ===================================================
     SPLASH SCREEN
=================================================== -->

<section
    id="splash"
    class="screen">

    <div class="splash-content">

        <img
            src="BerryAnime_logo_leve.jpg"
            class="berry-logo"
            alt="BerryAnime">

        <div class="logo-name">

            <span class="berry">
                BERRY
            </span>

            <span class="anime">
                ANIME
            </span>

        </div>

        <div
            class="loader"
            aria-label="Carregando">
        </div>

    </div>

</section>



<!-- ===================================================
     LOGIN SCREEN
=================================================== -->

<section
    id="login"
    class="screen">

    <div class="background-glow"></div>

    <div class="decor one"></div>

    <div class="decor two"></div>


    <div class="login-content">


        <!-- MORANGO -->

        <img
            src="BerryAnime_logo_leve.jpg"
            class="login-logo"
            alt="BerryAnime">


        <!-- NOME -->

        <div class="login-brand">

            <span class="berry">
                BERRY
            </span>

            <span class="anime">
                ANIME
            </span>

        </div>


        <!-- DESCRIÇÃO -->

        <p class="subtitle">

            Assista aos seus animes
            favoritos em um só lugar!

        </p>


        <!-- BOTÕES -->

        <div class="buttons">


            <!-- LOGIN -->

            <button
                class="btn login-btn"
                onclick="login()">

                👤
                &nbsp;
                LOGIN

            </button>


            <!-- OR -->

            <div class="or">

                <span>OR</span>

            </div>


            <!-- REGISTAR -->

            <button
                class="btn register-btn"
                onclick="register()">

                👤+
                &nbsp;
                REGISTAR

            </button>


            <!-- GOOGLE -->

            <button
                class="google-btn"
                onclick="googleLogin()">

                <span class="google-icon">
                    G
                </span>

                Entrar com Google

            </button>


        </div>

    </div>

</section>



<script>

/* =====================================================
   TROCA SPLASH → LOGIN
===================================================== */

setTimeout(function(){

    document
        .getElementById("splash")
        .classList
        .add("hidden");

    document
        .getElementById("login")
        .classList
        .add("show");

},3000);


/* =====================================================
   BOTÃO LOGIN
===================================================== */

function login(){

    alert(
        "A tela de Login será criada no próximo passo."
    );

}


/* =====================================================
   BOTÃO REGISTRAR
===================================================== */

function register(){

    alert(
        "A tela de Registro será criada no próximo passo."
    );

}


/* =====================================================
   GOOGLE
===================================================== */

function googleLogin(){

    alert(
        "O Login com Google será conectado no próximo passo."
    );

}

</script>


</body>
      </html>

<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BerryAnime</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050505;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100vh;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:hidden;
}


/* =====================================================
   SPLASH
===================================================== */

#splash{
    position:absolute;
    inset:0;

    background:#050505;

    justify-content:center;

    z-index:10;

    overflow:hidden;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#splash.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

#splash::after{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    right:-105px;
    bottom:-125px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,23,68,.20) 0%,
            rgba(255,23,68,.08) 38%,
            rgba(255,23,68,0) 72%
        );

    filter:blur(8px);

    pointer-events:none;

    z-index:0;
}

.splash-content{
    position:relative;
    z-index:2;

    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transform:translateY(-65px);
}

.berry-logo{
    width:205px;
    height:205px;

    object-fit:contain;
    display:block;

    mix-blend-mode:lighten;

    filter:
        brightness(1.10)
        contrast(1.70);
}

.logo-name{
    margin-top:2px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:43px;
    font-weight:900;

    letter-spacing:-2px;
    line-height:1;
}

.logo-name .berry{
    color:#ff1744;
}

.logo-name .anime{
    color:#ffffff;
}

.loader{
    width:40px;
    height:40px;

    border-radius:50%;

    border:4px solid rgba(255,23,68,.16);

    border-top-color:#ff1744;
    border-right-color:#ff1744;

    margin-top:72px;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }
}


/* =====================================================
   LOGIN SCREEN
===================================================== */

#login{
    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(190,0,45,.28),
            transparent 35%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(255,0,65,.13),
            transparent 30%
        ),

        #080808;

    justify-content:flex-start;

    padding:
        55px
        24px
        30px;

    opacity:0;
    visibility:hidden;

    transform:translateX(20px);

    transition:
        opacity .6s ease,
        transform .6s ease,
        visibility .6s ease;
}

#login.show{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
}

.background-glow{
    position:absolute;

    width:320px;
    height:320px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,65,.12),
            transparent 70%
        );

    top:-100px;
    right:-120px;

    pointer-events:none;
}

.login-content{
    position:relative;
    z-index:2;

    width:100%;
    max-width:430px;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin-top:5px;
}

.login-logo{
    width:190px;
    height:190px;

    object-fit:contain;
    display:block;

    mix-blend-mode:lighten;

    filter:
        brightness(1.10)
        contrast(1.70);
}

.login-brand{
    margin-top:-8px;

    font-size:43px;
    font-weight:900;

    letter-spacing:-2px;
}

.login-brand .berry{
    color:#ff1744;
}

.login-brand .anime{
    color:white;
}

.subtitle{
    margin-top:17px;

    text-align:center;

    font-size:18px;
    line-height:1.45;

    color:#eeeeee;

    max-width:330px;
}

.buttons{
    width:82%;
    max-width:360px;

    margin-top:58px;

    display:flex;
    flex-direction:column;

    gap:18px;
}

.btn{
    width:100%;
    min-height:58px;

    border-radius:14px;

    font-size:19px;
    font-weight:800;

    letter-spacing:.4px;

    cursor:pointer;

    font-family:Arial, sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.btn:active{
    transform:scale(.97);
    opacity:.85;
}

.btn-icon{
    width:23px;
    height:23px;

    flex:none;

    stroke:currentColor;
    fill:none;

    stroke-width:2.2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.login-btn{
    background:transparent;

    color:#ff1744;

    border:2px solid #ff1744;
}

.register-btn{
    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ed274e
        );

    color:white;

    border:0;
}

.or{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:16px;
}

.or::before,
.or::after{
    content:"";

    height:1px;
    flex:1;

    background:#383838;
}

.or span{
    font-size:16px;
    font-weight:700;

    color:#999999;
}


/* =====================================================
   GOOGLE
===================================================== */

.google-btn{
    width:100%;
    min-height:58px;

    border:0;
    border-radius:13px;

    background:white;
    color:#333333;

    font-size:18px;
    font-weight:600;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:14px;

    cursor:pointer;

    font-family:Arial, Helvetica, sans-serif;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.google-btn:active{
    transform:scale(.97);
    opacity:.85;
}

.google-btn:disabled{
    opacity:.65;
    cursor:wait;
}

.google-icon{
    width:25px;
    height:25px;

    display:block;
    flex:none;
}


/* =====================================================
   DECORAÇÕES
===================================================== */

.decor{
    position:absolute;
    z-index:1;

    border-radius:50%;

    background:rgba(255,23,68,.15);
}

.decor.one{
    width:100px;
    height:100px;

    left:-55px;
    bottom:-30px;
}

.decor.two{
    width:70px;
    height:70px;

    right:-35px;
    bottom:100px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-height:700px){

    #login{
        padding-top:25px;
    }

    .login-logo{
        width:150px;
        height:150px;
    }

    .login-brand{
        font-size:35px;
    }

    .subtitle{
        font-size:16px;
        margin-top:10px;
    }

    .buttons{
        width:80%;
        max-width:330px;

        margin-top:30px;

        gap:14px;
    }

    .btn,
    .google-btn{
        min-height:52px;
    }

    .splash-content{
        transform:translateY(-35px);
    }

    .berry-logo{
        width:175px;
        height:175px;
    }

    .logo-name{
        font-size:36px;
    }

    .loader{
        width:36px;
        height:36px;

        margin-top:55px;

        border-width:4px;
    }
}

@media(max-width:380px){

    .berry-logo{
        width:175px;
        height:175px;
    }

    .logo-name{
        font-size:36px;
    }

    .loader{
        width:36px;
        height:36px;

        margin-top:58px;
    }

    .login-logo{
        width:155px;
        height:155px;
    }

    .login-brand{
        font-size:36px;
    }

    .subtitle{
        font-size:16px;
    }

    .buttons{
        width:82%;
        max-width:310px;

        gap:13px;
    }

    .btn,
    .google-btn{
        min-height:52px;
        font-size:17px;
    }
}

@media(min-height:800px){

    .berry-logo{
        width:205px;
        height:205px;
    }

    .splash-content{
        transform:translateY(-65px);
    }

    .loader{
        width:40px;
        height:40px;

        margin-top:72px;
    }
}

</style></head><body><section
    id="splash"
    class="screen"><div class="splash-content">

    <img
        src="BerryAnime_logo_leve.jpg"
        class="berry-logo"
        alt="BerryAnime">

    <div class="logo-name">

        <span class="berry">BERRY</span>
        <span class="anime">ANIME</span>

    </div>

    <div
        class="loader"
        aria-label="Carregando">
    </div>

</div>

</section><section
    id="login"
    class="screen"><div class="background-glow"></div>

<div class="decor one"></div>

<div class="decor two"></div>

<div class="login-content">

    <img
        src="BerryAnime_logo_leve.jpg"
        class="login-logo"
        alt="BerryAnime">

    <div class="login-brand">

        <span class="berry">BERRY</span>
        <span class="anime">ANIME</span>

    </div>

    <p class="subtitle">

        Assista aos seus animes
        favoritos em um só lugar!

    </p>

    <div class="buttons">

        <button
            type="button"
            class="btn login-btn"
            id="loginButton">

            <svg
                class="btn-icon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

            <span>LOGIN</span>

        </button>


        <button
            type="button"
            class="btn register-btn"
            id="registerButton">

            <svg
                class="btn-icon"
                viewBox="0 0 24 24">

                <circle
                    cx="9"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M2 21c0-4 3-7 7-7">
                </path>

                <path
                    d="M19 14v7">
                </path>

                <path
                    d="M15.5 17.5h7">
                </path>

            </svg>

            <span>REGISTRAR</span>

        </button>


        <div class="or">
            <span>OU</span>
        </div>


        <button
            type="button"
            class="google-btn"
            id="googleButton">

            <svg
                class="google-icon"
                viewBox="0 0 48 48">

                <path
                    fill="#4285F4"
                    d="M47.5 24.5c0-1.7-.2-3.4-.5-5H24v9.5h13.2c-.6 3-2.3 5.5-4.9 7.2v6h7.9c4.6-4.2 7.3-10.4 7.3-17.7z">
                </path>

                <path
                    fill="#34A853"
                    d="M24 48c6.5 0 12-2.1 16-5.7l-7.9-6c-2.1 1.4-4.8 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.9H2.5v6.2C6.4 42.6 14.6 48 24 48z">
                </path>

                <path
                    fill="#FBBC05"
                    d="M10.6 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7v-6.2H2.5C.9 16.3 0 20 0 24s.9 7.7 2.5 10.9l8.1-6.2z">
                </path>

                <path
                    fill="#EA4335"
                    d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C36 2.3 30.5 0 24 0 14.6 0 6.4 5.4 2.5 13.1l8.1 6.2C12.5 13.7 17.8 9.5 24 9.5z">
                </path>

            </svg>

            <span>Entrar com Google</span>

        </button>

    </div>

</div>

</section><script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const splash =
    document.getElementById("splash");

const loginScreen =
    document.getElementById("login");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const googleButton =
    document.getElementById("googleButton");


let authChecked = false;

let splashFinished = false;

let redirected = false;


/* =====================================================
   MOSTRAR LOGIN
===================================================== */

function showLogin(){

    if(redirected){
        return;
    }

    splash.classList.add("hidden");

    loginScreen.classList.add("show");
}


/* =====================================================
   FIREBASE AUTH
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        authChecked = true;

        if(user){

            redirected = true;

            window.location.replace(
                "home.html"
            );

            return;
        }

        if(splashFinished){

            showLogin();

        }

    }
);


/* =====================================================
   SPLASH
===================================================== */

setTimeout(
    function(){

        splashFinished = true;

        if(authChecked){

            showLogin();

        }

    },
    3000
);


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "login.html";

    }
);


/* =====================================================
   REGISTRO
===================================================== */

registerButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "register.html";

    }
);


/* =====================================================
   GOOGLE
===================================================== */

googleButton.addEventListener(
    "click",
    async function(){

        if(redirected){
            return;
        }

        googleButton.disabled = true;

        const provider =
            new GoogleAuthProvider();


        provider.setCustomParameters({
            prompt: "select_account"
        });


        try{

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );


            if(result.user){

                redirected = true;

                window.location.replace(
                    "home.html"
                );

            }

        }

        catch(error){

            console.error(
                "Erro no login Google:",
                error
            );


            if(
                error.code !==
                "auth/popup-closed-by-user"
            ){

                alert(
                    "Não foi possível entrar com Google."
                );

            }


            googleButton.disabled = false;

        }

    }
);

</script>

</body>

</html>

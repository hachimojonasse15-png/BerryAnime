<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050505;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}


/* =====================================================
   TELAS
===================================================== */

.screen{
    position:absolute;
    inset:0;

    width:100%;
    height:100vh;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:hidden;
}


/* =====================================================
   SPLASH
===================================================== */

#splash{

    background:#050505;

    justify-content:center;

    z-index:10;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#splash.hidden{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =====================================================
   LOGO SPLASH
===================================================== */

.splash-content{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    transform:translateY(25px);
}


.berry-logo{

    width:235px;
    height:235px;

    object-fit:contain;

    display:block;
}


.logo-name{

    margin-top:5px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:43px;

    font-weight:900;

    letter-spacing:-2px;

    line-height:1;
}

.logo-name .berry{
    color:#ff1744;
}

.logo-name .anime{
    color:#ffffff;
}


/* =====================================================
   LOADER
===================================================== */

.loader{

    width:55px;
    height:55px;

    border-radius:50%;

    border:5px solid rgba(255,23,68,.18);

    border-top-color:#ff1744;
    border-right-color:#ff1744;

    margin-top:105px;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}


/* =====================================================
   LOGIN INICIAL
===================================================== */

#login{

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(190,0,45,.28),
            transparent 35%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(255,0,65,.13),
            transparent 30%
        ),

        #080808;

    justify-content:flex-start;

    padding:
        55px
        24px
        30px;

    opacity:0;

    visibility:hidden;

    transform:translateX(20px);

    transition:
        opacity .6s ease,
        transform .6s ease,
        visibility .6s ease;
}

#login.show{

    opacity:1;

    visibility:visible;

    transform:translateX(0);
}


/* =====================================================
   DECORAÇÃO
===================================================== */

.background-glow{

    position:absolute;

    width:320px;
    height:320px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,65,.12),
            transparent 70%
        );

    top:-100px;
    right:-120px;

    pointer-events:none;
}


.decor{

    position:absolute;

    z-index:1;

    border-radius:50%;

    background:rgba(255,23,68,.15);
}

.decor.one{

    width:100px;
    height:100px;

    left:-55px;
    bottom:-30px;
}

.decor.two{

    width:70px;
    height:70px;

    right:-35px;
    bottom:100px;
}


/* =====================================================
   CONTEÚDO LOGIN
===================================================== */

.login-content{

    position:relative;

    z-index:2;

    width:100%;

    max-width:430px;

    display:flex;

    flex-direction:column;

    align-items:center;

    margin-top:5px;
}


.login-logo{

    width:230px;
    height:230px;

    object-fit:contain;
}


.login-brand{

    margin-top:-8px;

    font-size:43px;

    font-weight:900;

    letter-spacing:-2px;
}

.login-brand .berry{
    color:#ff1744;
}

.login-brand .anime{
    color:white;
}


.subtitle{

    margin-top:17px;

    text-align:center;

    font-size:18px;

    line-height:1.45;

    color:#eeeeee;

    max-width:330px;
}


/* =====================================================
   BOTÕES
===================================================== */

.buttons{

    width:100%;

    margin-top:65px;

    display:flex;

    flex-direction:column;

    gap:18px;
}


.btn{

    width:100%;

    min-height:64px;

    border-radius:14px;

    font-size:21px;

    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    font-family:Arial,sans-serif;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.btn:active{

    transform:scale(.97);

    opacity:.85;
}


.login-btn{

    background:transparent;

    color:#ff1744;

    border:2px solid #ff1744;
}


.register-btn{

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ed274e
        );

    color:white;

    border:0;
}


/* =====================================================
   OU
===================================================== */

.or{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    margin:0;
}

.or::before,
.or::after{

    content:"";

    height:1px;

    flex:1;

    background:#383838;
}

.or span{

    font-size:17px;

    font-weight:700;

    color:#999999;
}


/* =====================================================
   GOOGLE
===================================================== */

.google-btn{

    width:100%;

    min-height:64px;

    border:0;

    border-radius:13px;

    background:white;

    color:#333333;

    font-size:19px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    cursor:pointer;
}

.google-icon{

    width:23px;
    height:23px;

    display:block;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-height:700px){

    #login{
        padding-top:25px;
    }

    .login-logo{

        width:170px;
        height:170px;
    }

    .login-brand{
        font-size:35px;
    }

    .subtitle{

        font-size:16px;

        margin-top:10px;
    }

    .buttons{

        margin-top:30px;

        gap:12px;
    }

    .btn,
    .google-btn{

        min-height:54px;
    }

}


@media(max-width:380px){

    .berry-logo{

        width:190px;
        height:190px;
    }

    .logo-name{
        font-size:36px;
    }

    .loader{

        width:45px;
        height:45px;

        margin-top:85px;
    }

    .login-logo{

        width:180px;
        height:180px;
    }

    .login-brand{
        font-size:36px;
    }

    .subtitle{
        font-size:16px;
    }

}


@media(min-height:800px){

    .berry-logo{

        width:250px;
        height:250px;
    }

    .loader{
        margin-top:110px;
    }

}

</style>

</head>

<body>


<!-- ===================================================
     SPLASH
=================================================== -->

<section
    id="splash"
    class="screen">

    <div class="splash-content">

        <img
            src="BerryAnime_logo_leve.jpg"
            class="berry-logo"
            alt="BerryAnime">

        <div class="logo-name">

            <span class="berry">BERRY</span>
            <span class="anime">ANIME</span>

        </div>

        <div
            class="loader"
            aria-label="Carregando">
        </div>

    </div>

</section>



<!-- ===================================================
     TELA INICIAL
=================================================== -->

<section
    id="login"
    class="screen">

    <div class="background-glow"></div>

    <div class="decor one"></div>
    <div class="decor two"></div>


    <div class="login-content">


        <img
            src="BerryAnime_logo_leve.jpg"
            class="login-logo"
            alt="BerryAnime">


        <div class="login-brand">

            <span class="berry">BERRY</span>
            <span class="anime">ANIME</span>

        </div>


        <p class="subtitle">

            Assista aos seus animes
            favoritos em um só lugar!

        </p>


        <div class="buttons">


            <!-- LOGIN -->

            <button
                class="btn login-btn"
                onclick="login()">

                👤
                &nbsp;
                LOGIN

            </button>


            <div class="or">

                <span>OR</span>

            </div>


            <!-- REGISTRAR -->

            <button
                class="btn register-btn"
                onclick="register()">

                👤+
                &nbsp;
                REGISTRAR

            </button>


            <!-- GOOGLE -->

            <button
                class="google-btn"
                id="googleButton">

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24">

                    <path
                        fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>

                    <path
                        fill="#34A853"
                        d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.74 9.74 0 0 0 12 21.6z"/>

                    <path
                        fill="#FBBC05"
                        d="M6.53 13.69A5.85 5.85 0 0 1 6.23 12c0-.59.1-1.17.3-1.69V7.78H3.28A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.03 4.22l3.25-2.53z"/>

                    <path
                        fill="#EA4335"
                        d="M12 6.28c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.33 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.72 5.38l3.25 2.53C7.3 8 9.46 6.28 12 6.28z"/>

                </svg>

                Continuar com Google

            </button>

        </div>

    </div>

</section>


<script type="module">

import {
    auth
} from "./firebase.js";

import {
    GoogleAuthProvider,
    signInWithRedirect
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   SPLASH → TELA INICIAL
===================================================== */

setTimeout(function(){

    document
        .getElementById("splash")
        .classList
        .add("hidden");

    document
        .getElementById("login")
        .classList
        .add("show");

},3000);


/* =====================================================
   LOGIN
===================================================== */

function login(){

    window.location.href =
        "login.html";

}


/* =====================================================
   REGISTRAR
===================================================== */

function register(){

    window.location.href =
        "register.html";

}


/* =====================================================
   GOOGLE
===================================================== */

const googleButton =
    document.getElementById("googleButton");


googleButton.addEventListener(
    "click",
    async function(){

        googleButton.disabled = true;

        googleButton.textContent =
            "Abrindo Google...";


        try{

            const provider =
                new GoogleAuthProvider();


            provider.addScope("profile");

            provider.addScope("email");


            await signInWithRedirect(
                auth,
                provider
            );


        }catch(error){

            console.log(error);

            googleButton.disabled = false;

            googleButton.innerHTML = `

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24">

                    <path
                        fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>

                    <path
                        fill="#34A853"
                        d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.74 9.74 0 0 0 12 21.6z"/>

                    <path
                        fill="#FBBC05"
                        d="M6.53 13.69A5.85 5.85 0 0 1 6.23 12c0-.59.1-1.17.3-1.69V7.78H3.28A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.03 4.22l3.25-2.53z"/>

                    <path
                        fill="#EA4335"
                        d="M12 6.28c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.33 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.72 5.38l3.25 2.53C7.3 8 9.46 6.28 12 6.28z"/>

                </svg>

                Continuar com Google

            `;

        }

    }
);

</script>

</body>
              </html>

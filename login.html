<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0">

<title>BerryAnime - Login</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


body{

    min-height:100vh;

    background:#080808;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px 18px;
}


.login{

    width:100%;

    max-width:420px;

    text-align:center;
}


.logo{

    width:115px;
    height:115px;

    object-fit:contain;

    margin-bottom:10px;
}


.brand{

    font-size:35px;

    font-weight:900;

    margin-bottom:8px;
}


.berry{
    color:#ff1744;
}


.anime{
    color:white;
}


.subtitle{

    color:#999;

    font-size:14px;

    margin-bottom:28px;
}


.input{

    width:100%;

    height:56px;

    margin-bottom:13px;

    padding:0 16px;

    background:#151515;

    color:white;

    border:1px solid #303030;

    border-radius:12px;

    outline:none;

    font-size:15px;
}


.input:focus{

    border-color:#ff1744;
}


.login-button{

    width:100%;

    height:57px;

    margin-top:5px;

    border:0;

    border-radius:12px;

    background:#ff1744;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}


.login-button:disabled{

    opacity:.6;

    cursor:not-allowed;
}


.message{

    display:none;

    margin-top:17px;

    font-size:14px;
}


.register-text{

    margin-top:25px;

    color:#888;

    font-size:14px;
}


.register-link{

    color:#ff1744;

    text-decoration:none;

    font-weight:bold;
}


.back{

    display:inline-block;

    margin-top:22px;

    color:#ff1744;

    text-decoration:none;

    font-size:14px;
}

</style>

</head>


<body>


<div class="login">


    <img
        src="BerryAnime_logo_leve.jpg"
        class="logo"
        alt="BerryAnime">


    <div class="brand">

        <span class="berry">
            BERRY
        </span>

        <span class="anime">
            ANIME
        </span>

    </div>


    <div class="subtitle">

        Entre na sua conta

    </div>


    <form id="loginForm">


        <input
            id="email"
            class="input"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
            required>


        <input
            id="senha"
            class="input"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
            required>


        <button
            type="submit"
            class="login-button"
            id="loginButton">

            ENTRAR

        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="register-text">

        Ainda não tem uma conta?

        <a
            href="register.html"
            class="register-link">

            Registrar

        </a>

    </div>


    <a
        href="index.html"
        class="back">

        ← Voltar

    </a>


</div>


<script type="module">

import {
    auth
} from "./firebase.js";


import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const form =
    document.getElementById("loginForm");


const message =
    document.getElementById("message");


const button =
    document.getElementById("loginButton");


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    sucesso=false
){

    message.style.display =
        "block";


    message.textContent =
        texto;


    message.style.color =
        sucesso
        ? "#4cff88"
        : "#ff6b81";

}


/* =====================================================
   LOGIN E-MAIL
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const senha =
            document
                .getElementById("senha")
                .value;


        button.disabled =
            true;


        button.textContent =
            "ENTRANDO...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                senha
            );


            mostrarMensagem(
                "Login realizado com sucesso!",
                true
            );


            setTimeout(
                function(){

                    window.location.href =
                        "home.html";

                },
                1200
            );


        }catch(error){

            console.log(error);


            let texto =
                "E-mail ou senha incorretos.";


            if(
                error.code ===
                "auth/user-not-found"
            ){

                texto =
                    "Esta conta não existe.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                texto =
                    "Senha incorreta.";

            }

            else if(
                error.code ===
                "auth/invalid-credential"
            ){

                texto =
                    "E-mail ou senha incorretos.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                texto =
                    "Muitas tentativas. Tente novamente mais tarde.";

            }


            mostrarMensagem(texto);


            button.disabled =
                false;


            button.textContent =
                "ENTRAR";

        }

    }
);

</script>

</body>

</html>

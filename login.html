<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>BerryAnime - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#080808;
}

body{
    font-family:Arial,sans-serif;
    color:white;
}

.login-page{
    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:45px 25px;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(255,0,65,.18),
            transparent 35%
        ),
        #080808;
}

.logo{
    width:190px;
    height:190px;
    object-fit:contain;
}

.brand{
    display:flex;
    font-size:40px;
    font-weight:900;
    letter-spacing:-2px;
    margin-top:-5px;
}

.berry{
    color:#ff1744;
}

.anime{
    color:white;
}

.subtitle{
    margin-top:12px;
    color:#aaa;
    font-size:17px;
    text-align:center;
}

.form{
    width:100%;
    max-width:420px;
    margin-top:45px;
}

.input{
    width:100%;
    height:58px;

    margin-bottom:16px;

    padding:0 18px;

    border-radius:12px;
    border:1px solid #333;

    background:#151515;
    color:white;

    font-size:16px;

    outline:none;
}

.input:focus{
    border-color:#ff1744;
}

.login-button{
    width:100%;
    height:60px;

    border:0;
    border-radius:12px;

    background:#ff1744;
    color:white;

    font-size:19px;
    font-weight:bold;

    margin-top:8px;
}

.back{
    margin-top:25px;

    background:none;
    border:0;

    color:#ff1744;

    font-size:16px;
}

</style>

</head>

<body>

<div class="login-page">

    <img
        src="BerryAnime_logo_leve.jpg"
        class="logo"
        alt="BerryAnime">

    <div class="brand">

        <span class="berry">BERRY</span>
        <span class="anime">ANIME</span>

    </div>

    <p class="subtitle">
        Entre na sua conta
    </p>

    <div class="form">

        <input
            class="input"
            type="email"
            placeholder="E-mail">

        <input
            class="input"
            type="password"
            placeholder="Senha">

        <button
            class="login-button"
            onclick="entrar()">

            ENTRAR

          <button
            class="back"
            onclick="voltar()">

            ← Voltar

        </button>

    </div>

</div>


<script>

function entrar(){

    alert(
        "Login será conectado no próximo passo."
    );

}

function voltar(){

    window.location.href = "index.html";

}

</script>

</body>
</html>

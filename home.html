<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,

               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

/* =====================================================
   TOPO
===================================================== */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

/* =====================================================
   LOGO
===================================================== */

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   ÍCONES
===================================================== */

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
    overflow:hidden;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   PERFIL CIRCULAR
===================================================== */

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
}

.profile-button:active{
    transform:scale(.92);
    border-color:#ff1744;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   TÍTULOS
===================================================== */

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

/* =====================================================
   LISTAS
===================================================== */

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

/* =====================================================
   CARDS
===================================================== */

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   EPISÓDIOS
===================================================== */

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.65);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

/* =====================================================
   CÍRCULO DE CARREGAMENTO
===================================================== */

.home-loader{
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader-circle{
    width:40px;
    height:40px;
    border:3px solid #292929;
    border-top-color:#ff1744;
    border-right-color:#ff1744;
    border-radius:50%;
    animation:berrySpin .8s linear infinite;
}

@keyframes berrySpin{

    to{
        transform:rotate(360deg);
    }

}

/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

.menu-item:active{
    color:white;
}

section{
    margin-bottom:18px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

    .logo{

    }

    .header-button{
        width:40px;

    }

    .header-button svg{

        height:23px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .profile-button svg{
        width:23px;
        height:23px;
    }

    .title-section{
        font-size:20px;

    }

    .container{
        padding-left:14px;

    .header-button{
        width:38px;
        height:38px;

    .anime-card{

        height:116px;

<script>

/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href = "perfil.html";

}


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    alert("A pesquisa ainda está sendo preparada.");

}


/* =====================================================
   FOTO DE PERFIL
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";


function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }
    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   API JIKAN
===================================================== */

const app =
    document.getElementById("app");


const API =
    "https://api.jikan.moe/v4";


/* =====================================================
   CACHE
===================================================== */

const CACHE_PREFIX =
    "berryanime_jikan_";


const CACHE_TIME =
    15 * 60 * 1000;


/* =====================================================
   CONTROLE DE REQUISIÇÕES
===================================================== */

/*
   Não fazemos dezenas de requisições ao mesmo tempo.

   Uma nova requisição só começa depois de um
   pequeno intervalo.

   Isso evita sobrecarregar a Jikan e reduz
   bastante os erros 429.
*/

let ultimaRequisicao =
    0;


const INTERVALO_API =
    450;


async function controlarVelocidade(){

    const agora =
        Date.now();


    const passou =
        agora - ultimaRequisicao;


    const espera =
        Math.max(
            0,
            INTERVALO_API - passou
        );


    if(espera > 0){

        await esperar(
            espera
        );

    }


    ultimaRequisicao =
        Date.now();

}


/* =====================================================
   ESPERAR
===================================================== */

function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   CACHE KEY
===================================================== */

function cacheKey(url){

    return (
        CACHE_PREFIX +
        encodeURIComponent(url)
    );

}


/* =====================================================
   LER CACHE
===================================================== */

function lerCache(url){

    try{

        const chave =
            cacheKey(url);


        const salvo =
            localStorage.getItem(
                chave
            );


        if(!salvo){

            return null;

        }


        const objeto =
            JSON.parse(
                salvo
            );


        if(
            !objeto ||
            !objeto.time ||
            !Array.isArray(objeto.data)
        ){

            return null;

        }


        const idade =
            Date.now() -
            objeto.time;


        if(
            idade > CACHE_TIME
        ){

            localStorage.removeItem(
                chave
            );

            return null;

        }


        return objeto.data;

    }
    catch(error){

        console.warn(
            "Erro ao ler cache:",
            error
        );

        return null;

    }

}


/* =====================================================
   SALVAR CACHE
===================================================== */

function salvarCache(
    url,
    data
){

    try{

        localStorage.setItem(

            cacheKey(url),

            JSON.stringify({

                time:
                    Date.now(),

                data:
                    data

            })

        );

    }
    catch(error){

        console.warn(
            "Não foi possível salvar cache:",
            error
        );

    }

}


/* =====================================================
   API
===================================================== */

async function api(
    url,
    tentativas = 3
){

    /*
       Primeiro tenta o cache.
    */

    const cache =
        lerCache(url);


    if(cache){

        console.log(
            "Jikan CACHE:",
            url
        );

        return cache;

    }


    /*
       Requisição real.
    */

    for(
        let tentativa = 1;
        tentativa <= tentativas;
        tentativa++
    ){

        try{

            await controlarVelocidade();


            console.log(
                "Jikan:",
                url,
                "tentativa:",
                tentativa
            );


            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    () =>
                        controller.abort(),
                    12000
                );


            const response =
                await fetch(

                    API + url,

                    {
                        method:
                            "GET",

                        signal:
                            controller.signal,

                        headers:{
                            "Accept":
                                "application/json"
                        }

                    }

                );


            clearTimeout(
                timeout
            );


            /*
               Rate limit.
            */

            if(
                response.status === 429
            ){

                console.warn(
                    "Jikan 429:",
                    url
                );


                if(
                    tentativa < tentativas
                ){

                    await esperar(
                        1800 *
                        tentativa
                    );

                    continue;

                }


                return [];

            }


            /*
               Servidor indisponível.
            */

            if(
                response.status === 503
            ){

                console.warn(
                    "Jikan 503:",
                    url
                );


                if(
                    tentativa < tentativas
                ){

                    await esperar(
                        2000
                    );

                    continue;

                }


                return [];

            }


            if(
                !response.ok
            ){

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const json =
                await response.json();


            const dados =
                Array.isArray(
                    json.data
                )
                    ? json.data
                    : [];


            salvarCache(
                url,
                dados
            );


            return dados;

        }
        catch(error){

            console.warn(
                "Erro Jikan:",
                url,
                error
            );


            if(
                tentativa < tentativas
            ){

                await esperar(
                    1200 *
                    tentativa
                );

            }

        }

    }


    return [];

}


/* =====================================================
   IMAGEM
===================================================== */

function imagemAnime(anime){

    return (

        anime?.images?.webp
            ?.large_image_url ||

        anime?.images?.jpg
            ?.large_image_url ||

        anime?.images?.webp
            ?.image_url ||

        anime?.images?.jpg
            ?.image_url ||

        ""

    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto){

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   CARD NORMAL
===================================================== */

function smallCard(anime){

    if(
        !anime ||
        !anime.mal_id
    ){

        return "";

    }


    const image =
        imagemAnime(anime);


    if(!image){

        return "";

    }


    const title =
        escapar(
            anime.title ||
            anime.title_english ||
            "Anime"
        );


    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${anime.mal_id})">

            <img
                src="${image}"
                alt="${title}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD EPISÓDIO
===================================================== */

function episodeCard(
    anime,
    index
){

    if(
        !anime ||
        !anime.mal_id
    ){

        return "";

    }


    const image =
        imagemAnime(anime);


    if(!image){

        return "";

    }


    const title =
        escapar(
            anime.title ||
            anime.title_english ||
            "Novo episódio"
        );


    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${anime.mal_id})">

            <img
                src="${image}"
                alt="${title}"
                loading="lazy">

            <div class="badge">
                Novo
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${title}
                </div>

                <div class="episode-sub">
                    ${index + 1}. Novo episódio
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   ABRIR DETALHES
===================================================== */

function abrirAnime(id){

    if(!id){

        return;

    }


    window.location.href =
        "detalhes.html?id=" +
        id;

}


/* =====================================================
   REMOVER REPETIDOS
===================================================== */

function removerDuplicados(
    lista
){

    const mapa =
        new Map();


    for(
        const anime of
        (lista || [])
    ){

        if(
            anime &&
            anime.mal_id &&
            !mapa.has(
                anime.mal_id
            )
        ){

            mapa.set(
                anime.mal_id,
                anime
            );

        }

    }


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   PEGAR ANIMES
===================================================== */

function pegarAnimes(
    lista,
    quantidade
){

    return removerDuplicados(
        lista
    ).slice(
        0,
        quantidade
    );

}


/* =====================================================
   SEÇÃO
===================================================== */

function criarSecao(
    id,
    nome
){

    const section =
        document.createElement(
            "section"
        );


    section.id =
        id;


    section.innerHTML = `

        <div class="title-section">
            ${escapar(nome)}
        </div>

        <div class="container">

            <div
                class="section-loading"
                style="
                    color:#666;
                    padding:20px 0;
                    font-size:14px;
                ">

                Carregando...

            </div>

        </div>

    `;


    app.appendChild(
        section
    );


    return section;

}


/* =====================================================
   CRIAR ESTRUTURA
===================================================== */

function criarEstrutura(){

    app.innerHTML = "";


    criarSecao(
        "em-alta",
        "Em Alta"
    );


    criarSecao(
        "novos-episodios",

    );

    );

    );


    criarSecao(
        "comedia",

    );


    criarSecao(

    );


    criarSecao(
        "slice-life",
        "Slice of Life"
    );


    criarSecao(

    );


    criarSecao(

        "Lançamentos"
    );


    criarSecao(

    );


    criarSecao(

        "Fantasia"
    );

        "talvez",
        "Talvez você goste"
    );


    criarSecao(
        "curtidos",
        "Os mais curtidos de hoje!"
    );

}


/* =====================================================
   ATUALIZAR SEÇÃO
===================================================== */

function atualizarSecao(
    id,
    lista,
    quantidade = 12,
    episodios = false
){

    const section =
        document.getElementById(
            id
        );


    if(!section){

        return;

    }


    const container =
        section.querySelector(
            ".container"
        );


    const animes =
        pegarAnimes(
            lista,
            quantidade
        );


    if(
        !animes.length
    ){

        container.innerHTML = `

            <div
                style="
                    color:#555;
                    padding:18px 0;
                    font-size:14px;
                ">

                Não foi possível carregar esta seção.

            </div>

        `;

        return;

    }


    if(episodios){

        container.innerHTML =
            animes
                .map(
                    (
                        anime,
                        index
                    ) =>
                        episodeCard(
                            anime,
                            index
                        )
                )
                .join("");

    }
    else{

        container.innerHTML =
            animes
                .map(
                    smallCard
                )
                .join("");

    }

}


/* =====================================================
   CONFIGURAÇÃO DAS SEÇÕES
===================================================== */

/*
   SOMENTE UMA página por requisição.

   Isso é proposital.

   Não vamos buscar 2, 3 ou 4 páginas de cada
   categoria porque isso multiplicaria as
   requisições e poderia causar 429.
*/

const secoes = [

===================================================== */

async function carregarSecao(
    config
){

    const dados =
        await api(
            config.url
        );


    atualizarSecao(

        config.id,

        dados,

        config.quantidade,

        config.episodios === true

    );


    return dados;

}


/* =====================================================
   FILA DE REQUISIÇÕES
===================================================== */

/*
   Aqui está uma das mudanças mais importantes.

   As seções são carregadas aos poucos.

   A Home NÃO espera todas as APIs terminarem.

   Cada seção aparece assim que sua própria
   requisição termina.
*/

async function carregarFila(){

    for(
        const config of secoes
    ){

        carregarSecao(
            config
        );

        /*
           Pequeno intervalo antes de iniciar
           a próxima.

           Isso mantém a Jikan tranquila.
        */

        await esperar(
            500
        );

    }

}


/* =====================================================
   CARREGAR HOME
===================================================== */

async function loadAnime(){

    criarEstrutura();


    /*
       Primeiro tentamos carregar Em Alta.

       Essa seção é a primeira coisa que o usuário
       deve ver.
    */

    const primeira =
        secoes[0];


    await carregarSecao(
        primeira
    );


    /*
       Depois iniciamos todas as outras
       progressivamente.
    */

    carregarFilaRestante();

}

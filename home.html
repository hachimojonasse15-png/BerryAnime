<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
    overflow:hidden;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
}

.profile-button:active{
    transform:scale(.92);
    border-color:#ff1744;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.65);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.88),
        rgba(0,0,0,.25),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

.menu-item:active{
    color:white;
}

section{
    margin-bottom:18px;
}

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .header-button svg{
        width:23px;
        height:23px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .profile-button svg{
        width:23px;
        height:23px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .release-card{
        margin:0 14px;
        height:180px;
    }

    .release-title{
        font-size:18px;
    }

    .bottom-menu{
        height:66px;
    }

    .menu-item svg{
        width:20px;
        height:20px;
    }

    .menu-item span{
        font-size:11px;
    }
}

@media(max-width:380px){

    .header{
        padding:0 12px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .profile-button{
        width:38px;
        height:38px;
    }

    .header-button{
        width:38px;
        height:38px;
    }

    .anime-card{
        min-width:78px;
        height:116px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>

    <div class="header-icons">

        <div
            class="header-button"
            onclick="abrirPesquisa()">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path d="M16 16l5 5"></path>

            </svg>

        </div>

        <div
            class="profile-button"
            id="profileButton"
            onclick="abrirPerfil()">

            <img
                id="profileImage"
                alt="Foto de perfil">

            <svg
                id="profileIcon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    </div>

</header>

<div id="app"></div>

<div class="bottom-menu">

    <div
        class="menu-item menu-active"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">
            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
        </svg>

        <span>Início</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>
            <path d="M6 7h3M6 10h3M15 7h3M15 10h3"></path>
        </svg>

        <span>Mangás</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">
            <path d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z"></path>
        </svg>

        <span>Favoritos</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
        </svg>

        <span>Mais</span>

    </div>

</div>

<script>

/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    alert(
        "A pesquisa ainda está sendo preparada."
    );

}


/* =====================================================
   FOTO DO PERFIL
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";


function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   API JIKAN
===================================================== */

const app =
    document.getElementById("app");

const API =
    "https://api.jikan.moe/v4";


async function api(url){

    try{

        const res =
            await fetch(
                API + url
            );


        if(!res.ok){

            throw new Error(
                "HTTP " + res.status
            );

        }


        const data =
            await res.json();


        return data.data || [];

    }

    catch(error){

        console.log(
            "Erro Jikan:",
            error
        );

        return [];

    }

}


/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
    "berryanime_home_cache_v5";


const CACHE_TIME =
    1000 * 60 * 30;


function salvarCache(dados){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:Date.now(),

                data:dados

            })
        );

    }

    catch(error){

        console.log(
            "Erro ao guardar cache:",
            error
        );

    }

}


function lerCache(){

    try{

        const salvo =
            localStorage.getItem(
                CACHE_KEY
            );


        if(!salvo){

            return null;

        }


        const objeto =
            JSON.parse(
                salvo
            );


        if(
            !objeto ||
            !objeto.data
        ){

            return null;

        }


        return objeto.data;

    }

    catch(error){

        return null;

    }

}


/* =====================================================
   CAPA DO ANIME
===================================================== */

function imagemAnime(anime){

    return (
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.jpg?.image_url ||
        anime?.images?.jpg?.small_image_url ||
        ""
    );

}


/* =====================================================
   CARD NORMAL
===================================================== */

function smallCard(anime){

    const image =
        imagemAnime(anime);

    const id =
        anime?.mal_id;


    if(
        !image ||
        !id
    ){

        return "";

    }


    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${image}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD DE EPISÓDIO
===================================================== */

function episodeCard(
    anime,
    index
){

    const image =
        imagemAnime(anime);

    const id =
        anime?.mal_id;


    if(
        !image ||
        !id
    ){

        return "";

    }


    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${image}"
                alt="${anime.title || "Novo episódio"}"
                loading="lazy">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${anime.title || "Novo episódio"}
                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   ABRIR DETALHES
===================================================== */

function abrirAnime(id){

    if(!id){

        return;

    }


    window.location.href =
        "detalhes.html?id=" + id;

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(lista){

    const mapa =
        new Map();


    (lista || []).forEach(
        anime => {

            if(
                anime &&
                anime.mal_id
            ){

                mapa.set(
                    anime.mal_id,
                    anime
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   SECÇÃO NORMAL
===================================================== */

function section(
    nome,
    lista
){

    const disponiveis =
        removerDuplicados(
            lista
        );


    if(
        !disponiveis.length
    ){

        return "";

    }


    const selecionados =
        disponiveis.slice(
            0,
            10
        );


    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    selecionados
                    .map(
                        smallCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   SECÇÃO DE EPISÓDIOS
===================================================== */

function episodeSection(
    nome,
    lista
){

    const disponiveis =
        removerDuplicados(
            lista
        );


    if(
        !disponiveis.length
    ){

        return "";

    }


    const selecionados =
        disponiveis.slice(
            0,
            8
        );


    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    selecionados
                    .map(
                        (anime,index) =>
                            episodeCard(
                                anime,
                                index
                            )
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   LANÇAMENTO
===================================================== */

function releaseSection(
    anime
){

    if(!anime){

        return "";

    }


    const id =
        anime?.mal_id;

    const image =
        imagemAnime(anime);


    if(
        !id ||
        !image
    ){

        return "";

    }


    return `

        <section>

            <div class="title-section">
                Lançamentos
            </div>

            <div
                class="release-card"
                onclick="abrirAnime(${id})">

                <img
                    src="${image}"
                    alt="${anime.title || "Lançamento"}">

                <div class="release-gradient"></div>

                <div class="release-info">

                    <div class="release-label">
                        DESTAQUE
                    </div>

                    <div class="release-title">
                        ${anime.title || "Lançamento"}
                    </div>

                    <div class="release-sub">
                        Acompanhe no BerryAnime
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   FIM DA PARTE 2
===================================================== */

 /* =====================================================
   BUSCAR GÉNERO
===================================================== */

async function buscarGenero(genero){

    return await api(
        "/anime?genres=" +
        genero +
        "&order_by=score" +
        "&sort=desc" +
        "&limit=15"
    );

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(dados){

    const popular =
        dados.popular || [];

    const airing =
        dados.airing || [];

    const score =
        dados.score || [];

    const favorites =
        dados.favorites || [];

    const action =
        dados.action || [];

    const comedy =
        dados.comedy || [];

    const shounen =
        dados.shounen || [];

    const slice =
        dados.slice || [];

    const romance =
        dados.romance || [];

    const fantasy =
        dados.fantasy || [];


    let html = "";


    /* 1 */

    html += section(
        "Em alta",
        popular
    );


    /* 2 */

    html += episodeSection(
        "Novos episódios",
        airing
    );


    /* 3 */

    html += section(
        "Mais bem avaliados",
        score
    );


    /* 4 */

    html += section(
        "Ação",
        action
    );


    /* 5 */

    html += section(
        "Comédia",
        comedy
    );


    /* 6 */

    html += section(
        "Shounen",
        shounen
    );


    /* 7 */

    html += section(
        "Slice of Life",
        slice
    );


    /* 8 */

    html += section(
        "Você vai amar",
        popular.slice(10,30)
    );


    /* 9 */

    html += releaseSection(
        airing[0] ||
        score[0] ||
        popular[0]
    );


    /* 10 */

    html += section(
        "Romance",
        romance
    );


    /* 11 */

    html += section(
        "Fantasia",
        fantasy
    );


    /* 12 */

    html += section(
        "Talvez você goste",
        score.slice(10,30)
    );


    /* 13 */

    html += section(
        "Os mais curtidos de hoje!",
        favorites
    );


    if(!html){

        html = `

            <div style="
                text-align:center;
                padding:60px 20px;
                color:#888;
            ">

                Não foi possível carregar
                os animes agora.

            </div>

        `;

    }


    app.innerHTML =
        html;

}


/* =====================================================
   ATUALIZAR HOME
===================================================== */

async function atualizarHome(){

    try{

        /*
         * Primeiro buscamos as listas principais.
         */

        const principais =
            await Promise.all([

                api(
                    "/top/anime?filter=bypopularity&limit=25"
                ),

                api(
                    "/seasons/now?limit=25"
                ),

                api(
                    "/anime?order_by=score&sort=desc&limit=25"
                )

            ]);


        /*
         * Depois buscamos os géneros.
         *
         * Eles também são pedidos
         * simultaneamente.
         */

        const generos =
            await Promise.all([

                buscarGenero("1"),

                buscarGenero("4"),

                buscarGenero("27"),

                buscarGenero("36"),

                buscarGenero("22"),

                buscarGenero("10")

            ]);


        const dados = {

            popular:
                principais[0],

            airing:
                principais[1],

            score:
                principais[2],

            favorites:
                principais[0],

            action:
                generos[0],

            comedy:
                generos[1],

            shounen:
                generos[2],

            slice:
                generos[3],

            romance:
                generos[4],

            fantasy:
                generos[5]

        };


        /*
         * Guardar tudo no cache.
         */

        salvarCache(
            dados
        );


        /*
         * Mostrar tudo na Home.
         */

        construirHome(
            dados
        );

    }

    catch(error){

        console.log(
            "Erro ao atualizar Home:",
            error
        );

    }

}


/* =====================================================
   INICIAR HOME
===================================================== */

function iniciarHome(){

    carregarFotoPerfil();


    /*
     * Mostrar cache imediatamente,
     * se existir.
     */

    const cache =
        lerCache();


    if(cache){

        construirHome(
            cache
        );

    }


    /*
     * Atualizar em segundo plano.
     */

    atualizarHome();

}


/* =====================================================
   VOLTAR PARA A HOME
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();


        const cache =
            lerCache();


        if(cache){

            construirHome(
                cache
            );

        }

    }
);


/* =====================================================
   FOTO DO PERFIL ALTERADA
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

iniciarHome();

</script>

</body>

</html>

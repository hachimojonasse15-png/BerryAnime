<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
}

.container::-webkit-scrollbar{
    display:none;
}

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.7);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.88),
        rgba(0,0,0,.25),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}

section{
    margin-bottom:18px;
}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#777;
    cursor:pointer;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .release-card{
        margin:0 14px;
        height:180px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>

    <div class="header-icons">

        <div
            class="header-button"
            onclick="abrirPesquisa()">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path
                    d="M16 16l5 5">
                </path>

            </svg>

        </div>

        <div
            class="profile-button"
            onclick="abrirPerfil()">

            <img
                id="profileImage"
                alt="Foto de perfil">

            <svg
                id="profileIcon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    </div>

</header>

<div id="app"></div>

<div class="bottom-menu">

    <div
        class="menu-item menu-active"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">
            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
        </svg>

        <span>Início</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>
        </svg>

        <span>Mangás</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">
            <path d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z"></path>
        </svg>

        <span>Favoritos</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
        </svg>

        <span>Mais</span>

    </div>

</div>

<script>

function abrirPerfil(){

    window.location.href="perfil.html";

}

function abrirPesquisa(){

    alert("A pesquisa ainda está sendo preparada.");

}

const AVATAR_KEY =
    "berryanime_profile_avatar";

function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(AVATAR_KEY);

    const img =
        document.getElementById("profileImage");

    const icon =
        document.getElementById("profileIcon");

    if(imagem){

        img.src=imagem;
        img.style.display="block";
        icon.style.display="none";

    }

}


const app =
    document.getElementById("app");

const API =
    "https://api.jikan.moe/v4";


/* =====================================================
   FILA DA JIKAN
===================================================== */

let ultimoPedido = 0;

const INTERVALO_JIKAN = 1200;

let filaJikan = Promise.resolve();


function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );

}


function pedidoFila(endpoint){

    const executar =
        filaJikan.then(
            async function(){

                const agora =
                    Date.now();

                const passou =
                    agora - ultimoPedido;

                if(
                    passou <
                    INTERVALO_JIKAN
                ){

                    await esperar(
                        INTERVALO_JIKAN -
                        passou
                    );

                }

                ultimoPedido =
                    Date.now();


                let resposta =
                    await fetch(
                        API + endpoint
                    );


                if(
                    resposta.status === 429
                ){

                    console.log(
                        "Jikan 429. Aguardando..."
                    );

                    await esperar(4000);

                    ultimoPedido =
                        Date.now();

                    resposta =
                        await fetch(
                            API + endpoint
                        );

                }


                if(!resposta.ok){

                    throw new Error(
                        "HTTP " +
                        resposta.status
                    );

                }


                const json =
                    await resposta.json();


                return Array.isArray(
                    json.data
                )
                    ? json.data
                    : [];

            }
        );


    filaJikan =
        executar.catch(
            () => []
        );


    return executar;

}


/* =====================================================
   API
===================================================== */

async function api(endpoint){

    try{

        return await pedidoFila(
            endpoint
        );

    }

    catch(error){

        console.log(
            "Erro Jikan:",
            endpoint,
            error
        );

        return [];

    }

}

/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
    "berryanime_home_final_v2";

const CACHE_TIME =
    1000 * 60 * 60;


function salvarCache(dados){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:Date.now(),

                data:dados

            })
        );

    }

    catch(error){

        console.log(
            "Erro cache:",
            error
        );

    }

}


function lerCache(){

    try{

        const valor =
            localStorage.getItem(
                CACHE_KEY
            );

        if(!valor){

            return null;

        }

        const objeto =
            JSON.parse(valor);

        if(
            !objeto ||
            !objeto.data
        ){

            return null;

        }

        return objeto.data;

    }

    catch(error){

        return null;

    }

}


/* =====================================================
   CAPA
===================================================== */

function imagemAnime(anime){

    return (
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.jpg?.image_url ||
        anime?.images?.jpg?.small_image_url ||
        ""
    );

}


/* =====================================================
   CARD
===================================================== */

function smallCard(anime){

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(anime);

    if(
        !id ||
        !imagem
    ){

        return "";

    }

    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

        </div>

    `;

}


function episodeCard(anime){

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(anime);

    if(
        !id ||
        !imagem
    ){

        return "";

    }

    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${anime.title || "Anime"}
                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


function abrirAnime(id){

    if(!id){

        return;

    }

    window.location.href =
        "detalhes.html?id=" + id;

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function unicos(lista){

    const mapa =
        new Map();

    (lista || []).forEach(
        anime => {

            if(
                anime &&
                anime.mal_id
            ){

                mapa.set(
                    anime.mal_id,
                    anime
                );

            }

        }
    );

    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   CRIAR SECÇÃO
===================================================== */

function criarSecao(
    titulo,
    lista,
    quantidade=10
){

    const animes =
        unicos(lista)
        .slice(0,quantidade);


    if(
        !animes.length
    ){

        return "";

    }


    return `

        <section>

            <div class="title-section">
                ${titulo}
            </div>

            <div class="container">

                ${
                    animes
                    .map(smallCard)
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   SECÇÃO EPISÓDIOS
===================================================== */

function criarEpisodios(lista){

    const animes =
        unicos(lista)
        .slice(0,8);


    if(
        !animes.length
    ){

        return "";

    }


    return `

        <section>

            <div class="title-section">
                Novos episódios
            </div>

            <div class="container">

                ${
                    animes
                    .map(episodeCard)
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   LANÇAMENTO
===================================================== */

function criarLancamento(lista){

    const anime =
        unicos(lista)[0];


    if(!anime){

        return "";

    }


    const id =
        anime.mal_id;

    const imagem =
        imagemAnime(anime);


    if(
        !id ||
        !imagem
    ){

        return "";

    }


    return `

        <section>

            <div class="title-section">
                Lançamentos
            </div>

            <div
                class="release-card"
                onclick="abrirAnime(${id})">

                <img
                    src="${imagem}"
                    alt="${anime.title || "Lançamento"}">

                <div class="release-gradient"></div>

                <div class="release-info">

                    <div class="release-label">
                        DESTAQUE
                    </div>

                    <div class="release-title">
                        ${anime.title || "Lançamento"}
                    </div>

                    <div class="release-sub">
                        Acompanhe no BerryAnime
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(dados){

    let html = "";


    html += criarSecao(
        "Em alta",
        dados.popular
    );


    html += criarEpisodios(
        dados.airing
    );


    html += criarSecao(
        "Mais bem avaliados",
        dados.score
    );


    html += criarSecao(
        "Ação",
        dados.action
    );


    html += criarSecao(
        "Comédia",
        dados.comedy
    );


    html += criarSecao(
        "Shounen",
        dados.shounen
    );


    html += criarSecao(
        "Slice of Life",
        dados.slice
    );


    html += criarSecao(
        "Você vai amar",
        dados.popularExtra
    );


    html += criarLancamento(
        dados.airingExtra
    );


    html += criarSecao(
        "Romance",
        dados.romance
    );


    html += criarSecao(
        "Fantasia",
        dados.fantasy
    );


    html += criarSecao(
        "Talvez você goste",
        dados.scoreExtra
    );


    html += criarSecao(
        "Os mais curtidos de hoje!",
        dados.favorites
    );


    if(!html){

        html = `

            <div style="
                text-align:center;
                padding:60px 20px;
                color:#777;
            ">

                Não foi possível carregar
                os animes agora.

            </div>

        `;

    }


    app.innerHTML =
        html;

}


/* =====================================================
   BUSCAR GÉNERO
===================================================== */

async function buscarGenero(id){

    return await api(
        "/anime?genres=" +
        id +
        "&order_by=popularity" +
        "&sort=asc" +
        "&limit=12"
    );

}


/* =====================================================
   CARREGAR DADOS PRINCIPAIS
===================================================== */

async function carregarDadosHome(){

    const dados = {

        popular:[],

        airing:[],

        score:[],

        action:[],

        comedy:[],

        shounen:[],

        slice:[],

        romance:[],

        fantasy:[],

        popularExtra:[],

        airingExtra:[],

        scoreExtra:[],

        favorites:[]

    };


    /*
     * PRIMEIROS PEDIDOS
     */

    const principais =
        await Promise.all([

            api(
                "/top/anime?filter=bypopularity&limit=25"
            ),

            api(
                "/seasons/now?limit=25"
            ),

            api(
                "/top/anime?limit=25"
            )

        ]);


    dados.popular =
        principais[0];

    dados.airing =
        principais[1];

    dados.score =
        principais[2];


    /*
     * Mostra imediatamente
     * as primeiras secções.
     */

    construirHome(dados);


    /*
     * GÉNEROS
     *
     * São feitos pela fila.
     * Portanto não há uma avalanche
     * de pedidos simultâneos.
     */

    dados.action =
        await buscarGenero(1);


    dados.comedy =
        await buscarGenero(4);


    dados.shounen =
        await buscarGenero(27);


    dados.slice =
        await buscarGenero(36);


    dados.romance =
        await buscarGenero(22);


    dados.fantasy =
        await buscarGenero(10);


    /*
     * OUTRAS LISTAS
     */

    dados.popularExtra =
        dados.popular.slice(10,25);


    dados.scoreExtra =
        dados.score.slice(10,25);


    dados.airingExtra =
        dados.airing.slice(8,20);


    dados.favorites =
        dados.popular.slice(5,20);


    /*
     * Agora todas as secções
     * estão prontas.
     */

    construirHome(dados);


    /*
     * Só agora guardamos o cache.
     */

    salvarCache(dados);


    return dados;

      }

      /* =====================================================
   ATUALIZAR HOME
===================================================== */

async function atualizarHome(){

    try{

        await carregarDadosHome();

    }

    catch(error){

        console.log(
            "Erro ao atualizar Home:",
            error
        );

    }

}


/* =====================================================
   INICIAR
===================================================== */

function iniciarHome(){

    carregarFotoPerfil();


    /*
     * Primeiro tenta mostrar
     * o cache antigo.
     */

    const cache =
        lerCache();


    if(cache){

        construirHome(cache);

    }


    /*
     * Depois atualiza tudo
     * pela fila da Jikan.
     */

    atualizarHome();

}


/* =====================================================
   VOLTAR PARA HOME
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();


        const cache =
            lerCache();


        if(cache){

            construirHome(cache);

        }

    }
);


/* =====================================================
   FOTO DE PERFIL
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);


/* =====================================================
   INICIAR HOME
===================================================== */

iniciarHome();

</script>

</body>

</html>

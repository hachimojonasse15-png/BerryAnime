<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#090909;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}


/* =====================================================
   TOPO
===================================================== */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:relative;
    z-index:20;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
    overflow:hidden;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   PERFIL
===================================================== */

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
}

.profile-button:active{
    transform:scale(.92);
    border-color:#ff1744;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   TÍTULOS
===================================================== */

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}


/* =====================================================
   LISTAS HORIZONTAIS
===================================================== */

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD NORMAL
===================================================== */

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    cursor:pointer;
    flex-shrink:0;
    transition:.2s;
}

.anime-card:active{
    transform:scale(.96);
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =====================================================
   CARD DE EPISÓDIO
===================================================== */

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.65);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}


/* =====================================================
   BANNER DE LANÇAMENTOS
   ESTILO NETFLIX / TOMATO
===================================================== */

.release-section{
    margin:0 0 28px;
}

.release-banner{
    position:relative;
    width:100%;
    height:470px;
    overflow:hidden;
    background:#111;
}


/* IMAGEM DE FUNDO */

.release-background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    filter:brightness(.72);
    transform:scale(1.02);
}


/* ESCURECIMENTO LATERAL */

.release-banner::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.96) 0%,
            rgba(0,0,0,.78) 30%,
            rgba(0,0,0,.35) 65%,
            rgba(0,0,0,.08) 100%
        );
}


/* ESCURECIMENTO INFERIOR */

.release-banner::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:55%;
    z-index:1;

    background:
        linear-gradient(
            transparent,
            #090909
        );
}


/* CONTEÚDO */

.release-content{
    position:absolute;
    z-index:3;
    left:20px;
    bottom:38px;
    width:min(600px,70%);
}


/* PEQUENO TEXTO */

.release-label{
    display:inline-flex;
    align-items:center;
    gap:6px;

    color:#ff1744;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;

    margin-bottom:8px;
}


/* TÍTULO */

.release-title{
    font-size:34px;
    line-height:1.05;
    font-weight:800;

    margin-bottom:10px;

    text-shadow:
        0 3px 12px rgba(0,0,0,.9);
}


/* INFORMAÇÕES */

.release-info{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;

    color:#ddd;
    font-size:13px;

    margin-bottom:10px;
}

.release-info span{
    white-space:nowrap;
}

.release-rating{
    color:#ffd54a;
    font-weight:bold;
}

.release-dot{
    color:#777;
}


/* GÉNEROS */

.release-genres{
    display:flex;
    gap:6px;
    flex-wrap:wrap;

    margin-bottom:10px;
}

.release-genre{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.12);

    padding:4px 8px;
    border-radius:5px;

    font-size:11px;
    color:#eee;
}


/* SINOPSE */

.release-synopsis{
    color:#ddd;
    font-size:13px;
    line-height:1.45;

    max-width:560px;

    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;

    margin-bottom:16px;
}


/* BOTÕES */

.release-buttons{
    display:flex;
    align-items:center;
    gap:9px;
}

.release-watch{
    border:none;
    background:white;
    color:#090909;

    padding:10px 17px;

    border-radius:5px;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    gap:7px;

    transition:.2s;
}

.release-watch:active{
    transform:scale(.95);
}

.release-list{
    border:none;
    background:rgba(255,255,255,.15);
    color:white;

    width:40px;
    height:40px;

    border-radius:50%;

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    backdrop-filter:blur(5px);

    transition:.2s;
}

.release-list:active{
    transform:scale(.92);
}


/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;

    height:68px;

    background:#101010;
    border-top:1px solid #222;

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:4px;

    text-align:center;

    font-size:12px;
    color:#777;

    cursor:pointer;

    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;

    stroke:currentColor;
    fill:none;

    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

.menu-item:active{
    color:white;
}

section{
    margin-bottom:18px;
}


/* =====================================================
   LOADER
===================================================== */

#homeLoader{
    min-height:260px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.berry-loader{
    width:40px;
    height:40px;

    border:3px solid #292929;
    border-top-color:#ff1744;

    border-radius:50%;

    animation:
        berrySpin .8s linear infinite;
}

@keyframes berrySpin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .header-button svg{
        width:23px;
        height:23px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .profile-button svg{
        width:23px;
        height:23px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .bottom-menu{
        height:66px;
    }

    .menu-item svg{
        width:20px;
        height:20px;
    }

    .menu-item span{
        font-size:11px;
    }


    /* BANNER MOBILE */

    .release-banner{
        height:500px;
    }

    .release-banner::before{
        background:
            linear-gradient(
                90deg,
                rgba(0,0,0,.95),
                rgba(0,0,0,.55),
                rgba(0,0,0,.18)
            );
    }

    .release-banner::after{
        height:65%;
    }

    .release-content{
        left:15px;
        bottom:30px;
        width:calc(100% - 30px);
    }

    .release-title{
        font-size:28px;
        max-width:330px;
    }

    .release-synopsis{
        font-size:12px;
        max-width:340px;
        -webkit-line-clamp:3;
    }

    .release-info{
        font-size:12px;
    }

}


@media(max-width:380px){

    .header{
        padding:0 12px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .profile-button{
        width:38px;
        height:38px;
    }

    .header-button{
        width:38px;
        height:38px;
    }

    .anime-card{
        min-width:78px;
        height:116px;
    }

    .release-banner{
        height:480px;
    }

    .release-title{
        font-size:25px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header class="header">

    <div class="logo">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>


    <div class="header-icons">


        <!-- PESQUISA -->

        <div
            class="header-button"
            onclick="abrirPesquisa()">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path
                    d="M16 16l5 5">
                </path>

            </svg>

        </div>


        <!-- PERFIL -->

        <div
            class="profile-button"
            id="profileButton"
            onclick="abrirPerfil()">

            <img
                id="profileImage"
                alt="Foto de perfil">

            <svg
                id="profileIcon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div id="app"></div>


<!-- =====================================================
     MENU INFERIOR
===================================================== -->

<div class="bottom-menu">

    <div
        class="menu-item menu-active"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>

            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>


    <div
        class="menu-item"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 4h7v16H4z"></path>

            <path d="M13 4h7v16h-7z"></path>

            <path
                d="M6 7h3M6 10h3M15 7h3M15 10h3">
            </path>

        </svg>

        <span>Mangás</span>

    </div>


    <div
        class="menu-item"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">

            <path
                d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>


    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 6h16"></path>

            <path d="M4 12h16"></path>

            <path d="M4 18h16"></path>

        </svg>

        <span>Mais</span>

    </div>

</div>


<script>

/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    alert(
        "A pesquisa ainda está sendo preparada."
    );

}


/* =====================================================
   CHAVE DO AVATAR
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";


/* =====================================================
   CARREGAR FOTO DO PERFIL
===================================================== */

function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   API JIKAN
===================================================== */

const app =
    document.getElementById(
        "app"
    );


const API =
    "https://api.jikan.moe/v4";


async function api(url){

    try{

        const res =
            await fetch(
                API + url
            );


        if(!res.ok){

            throw new Error(
                "Erro na API: " +
                res.status
            );

        }


        const data =
            await res.json();


        return data.data || [];

    }

    catch(e){

        console.log(
            "Erro:",
            e
        );

        return [];

    }

}


/* =====================================================
   ESPERAR
===================================================== */

function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   CÍRCULO DE CARREGAMENTO
===================================================== */

function mostrarLoader(){

    app.innerHTML = `

        <div id="homeLoader">

            <div
                class="berry-loader">
            </div>

        </div>

    `;

}


function esconderLoader(){

    const loader =
        document.getElementById(
            "homeLoader"
        );


    if(loader){

        loader.remove();

    }

}


/* =====================================================
   ANIMES JÁ USADOS
===================================================== */

const animesUsados =
    new Set();


/* =====================================================
   VERIFICAR ANIME
===================================================== */

function animeDisponivel(anime){

    if(
        !anime ||
        !anime.mal_id
    ){

        return false;

    }


    return !animesUsados.has(
        anime.mal_id
    );

}


/* =====================================================
   PEGAR SEM REPETIR
===================================================== */

function pegarSemRepetir(
    lista,
    quantidade
){

    const resultado = [];


    for(
        const anime of lista
    ){

        if(
            animeDisponivel(
                anime
            )
        ){

            resultado.push(
                anime
            );

            animesUsados.add(
                anime.mal_id
            );

        }


        if(
            resultado.length >= quantidade
        ){

            break;

        }

    }


    return resultado;

}

/* =====================================================
   CARD NORMAL
===================================================== */

function smallCard(anime){

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        anime.images?.webp?.large_image_url ||
        anime.images?.webp?.image_url ||
        "";


    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${anime.mal_id})">

            <img
                src="${image}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD DE EPISÓDIO
===================================================== */

function episodeCard(
    anime,
    index
){

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        anime.images?.webp?.large_image_url ||
        anime.images?.webp?.image_url ||
        "";


    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${anime.mal_id})">

            <img
                src="${image}"
                alt="${anime.title || "Anime"}"
                loading="lazy">


            <div class="badge">
                Novo
            </div>


            <div class="episode-shadow">
            </div>


            <div class="episode-text">

                <div class="episode-title">

                    ${anime.title ||
                      "Novo episódio"}

                </div>


                <div class="episode-sub">

                    ${index + 1}.
                    Novo episódio

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   CRIAR SECÇÃO
===================================================== */

function section(
    name,
    content
){

    return `

        <section>

            <div class="title-section">

                ${name}

            </div>


            <div class="container">

                ${content}

            </div>

        </section>

    `;

}


/* =====================================================
   BANNER DE LANÇAMENTO
===================================================== */

function releaseBanner(
    anime
){

    if(
        !anime ||
        !anime.mal_id
    ){

        return "";

    }


    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        anime.images?.webp?.large_image_url ||
        anime.images?.webp?.image_url ||
        "";


    const title =
        anime.title ||
        anime.title_english ||
        "Novo lançamento";


    const score =
        anime.score ?
        anime.score.toFixed(1) :
        "N/A";


    const year =
        anime.year ||
        anime.aired?.prop?.from?.year ||
        "----";


    let synopsis =
        anime.synopsis ||
        "Descubra este novo anime disponível no BerryAnime.";


    /*
     * Limitar a sinopse
     */

    if(
        synopsis.length > 260
    ){

        synopsis =
            synopsis.substring(
                0,
                260
            ) + "...";

    }


    /*
     * Géneros
     */

    let genresHTML = "";


    if(
        anime.genres &&
        anime.genres.length
    ){

        genresHTML =
            anime.genres
                .slice(0,4)
                .map(
                    genre => `

                        <span
                            class="release-genre">

                            ${genre.name}

                        </span>

                    `
                )
                .join("");

    }


    return `

        <section
            class="release-section">


            <div
                class="release-banner">


                <!-- IMAGEM -->

                <img
                    class="release-background"
                    src="${image}"
                    alt="${title}">


                <!-- CONTEÚDO -->

                <div
                    class="release-content">


                    <div
                        class="release-label">

                        🔥 NOVO LANÇAMENTO

                    </div>


                    <h1
                        class="release-title">

                        ${title}

                    </h1>


                    <div
                        class="release-info">


                        <span
                            class="release-rating">

                            ⭐ ${score}

                        </span>


                        <span
                            class="release-dot">

                            •
                        
                        </span>


                        <span>

                            ${year}

                        </span>


                        <span
                            class="release-dot">

                            •

                        </span>


                        <span>

                            Anime

                        </span>

                    </div>


                    <div
                        class="release-genres">

                        ${genresHTML}

                    </div>


                    <div
                        class="release-synopsis">

                        ${sinopseSegura(
                            synopsis
                        )}

                    </div>


                    <div
                        class="release-buttons">


                        <button
                            class="release-watch"
                            onclick="abrirAnime(${anime.mal_id})">

                            ▶
                            Assistir

                        </button>


                        <button
                            class="release-list"
                            onclick="adicionarFavorito(${anime.mal_id})">

                            +

                        </button>

                    </div>


                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   PROTEGER TEXTO
===================================================== */

function sinopseSegura(
    texto
){

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ABRIR DETALHES DO ANIME
===================================================== */

function abrirAnime(
    id
){

    if(!id){

        return;

    }


    window.location.href =
        "detalhes.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   ADICIONAR FAVORITO
===================================================== */

function adicionarFavorito(
    id
){

    if(!id){

        return;

    }


    let favoritos = [];


    try{

        favoritos =
            JSON.parse(
                localStorage.getItem(
                    "berryanime_favoritos"
                )
            ) || [];

    }

    catch(e){

        favoritos = [];

    }


    if(
        !favoritos.includes(id)
    ){

        favoritos.push(id);


        localStorage.setItem(
            "berryanime_favoritos",
            JSON.stringify(
                favoritos
            )
        );


        alert(
            "Anime adicionado à sua lista!"
        );

    }

    else{

        alert(
            "Este anime já está na sua lista."
        );

    }

}

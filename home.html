/* =========================
   SEÇÕES
========================= */

.section{

.section-title{
    margin:0 18px 10px;
    font-size:18px;
    font-weight:700;
}

/* =========================
   FILAS GRANDES
========================= */

.large-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 18px 4px;
    scrollbar-width:none;
}

.large-row::-webkit-scrollbar{
    display:none;
}

.large-card{
    width:calc((100vw - 56px) / 2);
    min-width:calc((100vw - 56px) / 2);
    height:145px;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    border-radius:11px;
    background:#18181b;
}

.large-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   CARDS PEQUENOS
========================= */

.small-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 18px 5px;
    scrollbar-width:none;
}

.small-row::-webkit-scrollbar{
    display:none;
}

.small-card{
    width:78px;
    min-width:78px;
    flex-shrink:0;
}

.small-card img{
    display:block;
    width:78px;
    height:112px;
    object-fit:cover;
    border-radius:9px;
    background:#18181b;
}

/* =========================
   CONTINUE ASSISTINDO
========================= */

.continue-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 18px;
    scrollbar-width:none;
}

.continue-row::-webkit-scrollbar{
    display:none;
}

.continue-card{
    width:78vw;
    min-width:78vw;
    height:175px;
    position:relative;
    overflow:hidden;
    border-radius:12px;
}

.continue-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.continue-gradient{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:55px 13px 12px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.continue-title{
    font-size:16px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:4px;
    margin-top:8px;
    background:#555;
    border-radius:5px;
}

.progress-bar{
    width:45%;
    height:100%;
    background:#ed1745;
    border-radius:5px;

/* =========================
   BARRA DE NAVEGAÇÃO

/* =====================================================
   ANILIST API
===================================================== */

const API =
    "https://graphql.anilist.co";


/* =====================================================
   CONSULTA GRAPHQL
===================================================== */

async function buscar(
    query,
    variables = {}
){

    try{

        const response =
            await fetch(API,{
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    query:query,
                    variables:variables
                })
            });

        if(!response.ok){

            throw new Error(
                "Erro na AniList API"
            );

        }

        const json =
            await response.json();

        return (
            json?.data?.Page?.media ||
            []
        );

    }catch(error){

        console.error(
            "AniList:",
            error
        );

        return [];

    }

}


/* =====================================================
   QUERY BASE
===================================================== */

const QUERY_ANIME = `

query(
    $page:Int,
    $perPage:Int,
    $sort:[MediaSort],
    $status:MediaStatus,
    $genre:String
){

    Page(
        page:$page,
        perPage:$perPage
    ){

        media(
            type:ANIME,
            sort:$sort,
            status:$status,
            genre:$genre
        ){

            id

            title{
                romaji
                english
                native
            }

            coverImage{
                large
                extraLarge
                color
            }

            bannerImage

            description

            averageScore

            popularity

            episodes

            status

            genres

            startDate{
                year
                month
                day
            }

        }

    }

}

`;


/* =====================================================
   NOME
===================================================== */

function nomeAnime(anime){

    return (
        anime?.title?.english ||
        anime?.title?.romaji ||
        anime?.title?.native ||
        "Anime"
    );

}


/* =====================================================
   IMAGEM
===================================================== */

function imagem(anime){

    return (
        anime?.coverImage?.extraLarge ||
        anime?.coverImage?.large ||
        ""
    );

}


/* =====================================================
   BANNER
===================================================== */

function banner(anime){

    return (
        anime?.bannerImage ||
        anime?.coverImage?.extraLarge ||
        anime?.coverImage?.large ||
        ""
    );

}


/* =====================================================
   CARD PEQUENO
   SOMENTE CAPA
===================================================== */

function cardPequeno(anime){

    return `

        <div
            class="small-card"
            onclick="abrirAnime(${anime.id})">

            <img
                src="${imagem(anime)}"
                alt="${nomeAnime(anime)}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD GRANDE
   SOMENTE IMAGEM
===================================================== */

function cardGrande(anime){

    return `

        <div
            class="large-card"
            onclick="abrirAnime(${anime.id})">

            <img
                src="${banner(anime)}"
                alt="${nomeAnime(anime)}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   EM ALTA
===================================================== */

async function emAlta(){

    const lista =
        await buscar(
            QUERY_ANIME,
            {
                page:1,
                perPage:10,
                sort:["TRENDING_DESC"]
            }
        );

    document.getElementById(
        "emAlta"
    ).innerHTML =
        lista.map(cardGrande).join("");

}

function carregarHistorico(){

            localStorage.getItem(

        );

    if(!lista.length){

        "block";

/* =====================================================
   CONTINUE ASSISTINDO
===================================================== */

function carregarContinue(){

    const lista =
        JSON.parse(
            localStorage.getItem(
                "berryanime_continue"
            ) || "[]"
        );

    if(!lista.length){

        return;

    }

    document.getElementById(
        "continueSection"
    ).style.display =
        "block";

    document.getElementById(
        "continueAssistindo"
    ).innerHTML =

        lista.map(anime => `

            <div
                class="continue-card"
                onclick="abrirAnime(${anime.id})">

                <img
                    src="${
                        anime.bannerImage ||
                        anime.coverImage?.extraLarge ||
                        anime.coverImage?.large ||
                        anime.image ||
                        ""
                    }"
                    alt="${
                        nomeAnime(anime)
                    }">

                <div
                    class="continue-gradient">

                    <div
                        class="continue-title">

                        ${
                            nomeAnime(anime)
                        }

                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar">
                        </div>

                    </div>

                </div>

            </div>

        `).join("");

}

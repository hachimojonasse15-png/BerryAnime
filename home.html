<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

/* =====================================================
   TOPO
===================================================== */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

/* =====================================================
   LOGO
===================================================== */

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   ÍCONES
===================================================== */

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
    overflow:hidden;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   PERFIL
===================================================== */

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
}

.profile-button:active{
    transform:scale(.92);
    border-color:#ff1744;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   TÍTULOS
===================================================== */

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

/* =====================================================
   LISTAS
===================================================== */

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

/* =====================================================
   CARDS
===================================================== */

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   EPISÓDIOS
===================================================== */

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.65);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

/* =====================================================
   LANÇAMENTO
===================================================== */

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.88),
            rgba(0,0,0,.25),
            rgba(0,0,0,.05)
        );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}

/* =====================================================
   MENU
===================================================== */

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

.menu-item:active{
    color:white;
}

section{
    margin-bottom:18px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .header-button svg{
        width:23px;
        height:23px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .profile-button svg{
        width:23px;
        height:23px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .release-card{
        margin:0 14px;
        height:180px;
    }

    .release-title{
        font-size:18px;
    }

    .bottom-menu{
        height:66px;
    }

    .menu-item svg{
        width:20px;
        height:20px;
    }

    .menu-item span{
        font-size:11px;
    }
}

@media(max-width:380px){

    .header{
        padding:0 12px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .profile-button{
        width:38px;
        height:38px;
    }

    .header-button{
        width:38px;
        height:38px;
    }

    .anime-card{
        min-width:78px;
        height:116px;
    }

}

</style>

</head>

<script>

/* =====================================================
   BERRYANIME - HOME
   Jikan API v4
===================================================== */


/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href = "perfil.html";

}


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    alert("A pesquisa ainda está sendo preparada.");

}


/* =====================================================
   FOTO DO PERFIL
===================================================== */

const AVATAR_KEY = "berryanime_profile_avatar";

function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(AVATAR_KEY);

    const profileImage =
        document.getElementById("profileImage");

    const profileIcon =
        document.getElementById("profileIcon");


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src = imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.removeAttribute("src");

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   ELEMENTOS
===================================================== */

const app =
    document.getElementById("app");


/* =====================================================
   JIKAN API
===================================================== */

const API =
    "https://api.jikan.moe/v4";


/*
 * Mantemos uma distância segura entre
 * as requisições para reduzir 429.
 */

const INTERVALO_API =
    1200;

let ultimaRequisicao = 0;


/* =====================================================
   UTILITÁRIO
===================================================== */

function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   REQUISIÇÃO JIKAN
===================================================== */

async function api(
    url,
    tentativa = 0
){

    const agora =
        Date.now();


    const tempoDesdeUltima =
        agora -
        ultimaRequisicao;


    const esperaNecessaria =
        Math.max(
            0,
            INTERVALO_API -
            tempoDesdeUltima
        );


    if(
        esperaNecessaria > 0
    ){

        await esperar(
            esperaNecessaria
        );

    }


    ultimaRequisicao =
        Date.now();


    try{

        console.log(
            "🍓 Jikan:",
            url
        );


        const resposta =
            await fetch(
                API + url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        /* =========================
           RATE LIMIT
        ========================= */

        if(
            resposta.status === 429
        ){

            console.warn(
                "⚠️ Jikan 429"
            );


            if(
                tentativa >= 4
            ){

                return [];

            }


            const espera429 =
                5000 +
                (
                    tentativa *
                    3000
                );


            await esperar(
                espera429
            );


            return api(
                url,
                tentativa + 1
            );

        }


        /* =========================
           ERROS DO SERVIDOR
        ========================= */

        if(
            resposta.status === 500 ||
            resposta.status === 502 ||
            resposta.status === 503 ||
            resposta.status === 504
        ){

            console.warn(
                "⚠️ Jikan indisponível:",
                resposta.status
            );


            if(
                tentativa < 3
            ){

                await esperar(
                    4000 +
                    (
                        tentativa *
                        2000
                    )
                );


                return api(
                    url,
                    tentativa + 1
                );

            }


            return [];

        }


        /* =========================
           OUTROS ERROS
        ========================= */

        if(
            !resposta.ok
        ){

            console.warn(
                "⚠️ Jikan HTTP:",
                resposta.status
            );


            return [];

        }


        const json =
            await resposta.json();


        if(
            !json ||
            !Array.isArray(
                json.data
            )
        ){

            console.warn(
                "⚠️ Resposta sem data:",
                url
            );


            return [];

        }


        return json.data;

    }

    catch(error){

        console.warn(
            "⚠️ Erro de rede:",
            error
        );


        if(
            tentativa < 3
        ){

            await esperar(
                4000 +
                (
                    tentativa *
                    2000
                )
            );


            return api(
                url,
                tentativa + 1
            );

        }


        return [];

    }

}


/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
    "berryanime_home_cache_v10";


/*
 * Cache válido durante 6 horas.
 */

const CACHE_TIME =
    1000 *
    60 *
    60 *
    6;


/*
 * Cache de emergência:
 * pode ser usado até 72 horas.
 */

const CACHE_FALLBACK_TIME =
    1000 *
    60 *
    60 *
    72;


/* =====================================================
   SALVAR CACHE
===================================================== */

function salvarCache(
    dados
){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:
                    Date.now(),

                data:
                    dados

            })
        );

    }

    catch(error){

        console.warn(
            "Erro ao salvar cache:",
            error
        );

    }

}


/* =====================================================
   LER CACHE
===================================================== */

function lerCache(
    aceitarAntigo = false
){

    try{

        const salvo =
            localStorage.getItem(
                CACHE_KEY
            );


        if(
            !salvo
        ){

            return null;

        }


        const objeto =
            JSON.parse(
                salvo
            );


        if(
            !objeto ||
            !objeto.data
        ){

            return null;

        }


        const idade =
            Date.now() -
            (
                objeto.time ||
                0
            );


        const limite =
            aceitarAntigo
                ? CACHE_FALLBACK_TIME
                : CACHE_TIME;


        if(
            idade >
            limite
        ){

            return null;

        }


        return objeto.data;

    }

    catch(error){

        console.warn(
            "Erro ao ler cache:",
            error
        );


        return null;

    }

}


/* =====================================================
   IMAGEM DO ANIME
===================================================== */

function imagemAnime(
    anime
){

    return (

        anime?.images?.webp
            ?.large_image_url ||

        anime?.images?.webp
            ?.image_url ||

        anime?.images?.jpg
            ?.large_image_url ||

        anime?.images?.jpg
            ?.image_url ||

        anime?.images?.jpg
            ?.small_image_url ||

        ""

    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
){

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ABRIR ANIME
===================================================== */

function abrirAnime(
    id
){

    if(
        !id
    ){

        return;

    }


    window.location.href =
        "detalhes.html?id=" +
        encodeURIComponent(
            id
        );

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(
    lista
){

    const mapa =
        new Map();


    (
        lista || []
    )
    .forEach(
        anime => {

            if(
                anime &&
                anime.mal_id
            ){

                mapa.set(
                    anime.mal_id,
                    anime
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   VALIDAR ANIME
===================================================== */

function animeValido(
    anime
){

    return !!(
        anime &&
        anime.mal_id &&
        imagemAnime(anime)
    );

}


/* =====================================================
   FILTRAR VÁLIDOS
===================================================== */

function somenteValidos(
    lista
){

    return removerDuplicados(
        lista
    )
    .filter(
        animeValido
    );

}


/* =====================================================
   CARD NORMAL
===================================================== */

function smallCard(
    anime
){

    const imagem =
        imagemAnime(
            anime
        );


    const id =
        anime?.mal_id;


    if(
        !imagem ||
        !id
    ){

        return "";

    }


    const titulo =
        escaparHTML(
            anime.title ||
            "Anime"
        );


    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${titulo}"
                loading="lazy"
                decoding="async"
                onerror="this.style.display='none';">

        </div>

    `;

}


/* =====================================================
   CARD EPISÓDIO
===================================================== */

function episodeCard(
    anime
){

    const imagem =
        imagemAnime(
            anime
        );


    const id =
        anime?.mal_id;


    if(
        !imagem ||
        !id
    ){

        return "";

    }


    const titulo =
        escaparHTML(
            anime.title ||
            "Novo episódio"
        );


    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${titulo}"
                loading="lazy"
                decoding="async"
                onerror="this.style.display='none';">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${titulo}
                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   SEÇÃO NORMAL
===================================================== */

function section(
    nome,
    lista
){

    const disponiveis =
        somenteValidos(
            lista
        );


    if(
        !disponiveis.length
    ){

        return "";

    }


    const selecionados =
        disponiveis.slice(
            0,
            10
        );


    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    selecionados
                    .map(
                        smallCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   SEÇÃO EPISÓDIOS
===================================================== */

function episodeSection(
    nome,
    lista
){

    const disponiveis =
        somenteValidos(
            lista
        );


    if(
        !disponiveis.length
    ){

        return "";

    }


    const selecionados =
        disponiveis.slice(
            0,
            8
        );


    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    selecionados
                    .map(
                        episodeCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   LANÇAMENTO
===================================================== */

function releaseSection(
    anime
){

    if(
        !anime
    ){

        return "";

    }


    const id =
        anime?.mal_id;


    const imagem =
        imagemAnime(
            anime
        );


    if(
        !id ||
        !imagem
    ){

        return "";

    }


    const titulo =
        escaparHTML(
            anime.title ||
            "Lançamento"
        );


    return `

        <section>

            <div class="title-section">
                Lançamentos
            </div>

            <div
                class="release-card"
                onclick="abrirAnime(${id})">

                <img
                    src="${imagem}"
                    alt="${titulo}"
                    loading="eager"
                    decoding="async"
                    onerror="this.style.display='none';">

                <div class="release-gradient"></div>

                <div class="release-info">

                    <div class="release-label">
                        DESTAQUE
                    </div>

                    <div class="release-title">
                        ${titulo}
                    </div>

                    <div class="release-sub">
                        Acompanhe no BerryAnime
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   ENCONTRAR GÊNERO
===================================================== */

function porGenero(
    lista,
    genero
){

    const procurado =
        String(
            genero || ""
        )
        .toLowerCase()
        .trim();


    return (
        lista || []
    )
    .filter(
        anime => {

            const grupos = [

                ...(Array.isArray(anime?.genres)
                    ? anime.genres
                    : []),

                ...(Array.isArray(anime?.themes)
                    ? anime.themes
                    : []),

                ...(Array.isArray(anime?.demographics)
                    ? anime.demographics
                    : [])

            ];


            return grupos.some(
                item => {

                    const nome =
                        String(
                            item?.name ||
                            ""
                        )
                        .toLowerCase()
                        .trim();


                    return (
                        nome ===
                        procurado
                    );

                }
            );

        }
    );

}


/* =====================================================
   UNIVERSO
===================================================== */

function criarUniverso(
    dados
){

    return somenteValidos([

        ...(dados.popular || []),

        ...(dados.airing || []),

        ...(dados.score || []),

        ...(dados.favorites || [])

    ]);

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(

){

    ){

    }

    const airing =

    const favorites =
        dados.favorites || [];

    /* =================================================

/* =====================================================
   ATUALIZAR HOME
===================================================== */

async function atualizarHome(){

    console.log(
        "🍓 Atualizando BerryAnime..."
    );


    const dados = {

        popular: [],

        airing: [],

        score: [],

        favorites: []

    };


    /*
     * Cada requisição é feita separadamente.
     *
     * Se uma falhar, as outras continuam.
     */


    /* =================================================
       1 — POPULARES
    ================================================= */

    const populares1 =
        await api(
            "/top/anime?filter=bypopularity&page=1&limit=25"
        );


    dados.popular =
        somenteValidos(
            populares1
        );


    /*
     * Mostra imediatamente os populares
     * se a primeira requisição funcionar.
     */

    if(
        dados.popular.length
    ){

        dados.favorites =
            dados.popular.slice(
                0,
                15
            );


        construirHome(
            dados
        );

    }


    /* =================================================
       2 — SEGUNDA PÁGINA POPULARES
    ================================================= */

    const populares2 =
        await api(
            "/top/anime?filter=bypopularity&page=2&limit=25"
        );


    if(
        populares2.length
    ){

        dados.popular =
            somenteValidos([

                ...dados.popular,

                ...populares2

            ]);

    }


    dados.favorites =
        dados.popular.slice(
            0,
            15
        );


    construirHome(
        dados
    );


    /* =================================================
       3 — TEMPORADA ATUAL
    ================================================= */

    const temporada =
        await api(
            "/seasons/now?page=1&limit=25"
        );


    if(
        temporada.length
    ){

        dados.airing =
            somenteValidos(
                temporada
            );

    }


    /*
     * Atualiza imediatamente.
     */

    construirHome(
        dados
    );


    /* =================================================
       4 — MAIS BEM AVALIADOS
    ================================================= */

    const score1 =
        await api(
            "/top/anime?filter=bypopularity&page=1&limit=25"
        );


    /*
     * Não usamos a mesma lista diretamente.
     *
     * Pegamos agora o ranking por nota.
     */

    const scoreReal =
        await api(
            "/top/anime?sort=desc&limit=25&page=1"
        );


    if(
        scoreReal.length
    ){

        dados.score =
            somenteValidos(
                scoreReal
            );

    }

    else if(
        score1.length
    ){

        dados.score =
            somenteValidos(
                score1
            );

    }


    construirHome(
        dados
    );


    /* =================================================
       5 — SEGUNDA PÁGINA DO RANKING
    ================================================= */

    const score2 =
        await api(
            "/top/anime?sort=desc&limit=25&page=2"
        );


    if(
        score2.length
    ){

        dados.score =
            somenteValidos([

                ...dados.score,

                ...score2

            ]);

    }


    /* =================================================
       FAVORITOS
    ================================================= */

    if(
        !dados.favorites.length
    ){

        dados.favorites =
            dados.popular.slice(
                0,
                15
            );

    }


    /* =================================================
       SALVAR CACHE
    ================================================= */

    /*
     * Só guarda o cache quando temos
     * pelo menos alguma informação válida.
     */

    if(
        dados.popular.length ||
        dados.airing.length ||
        dados.score.length
    ){

        salvarCache(
            dados
        );

    }


    /* =================================================
       RESULTADO FINAL
    ================================================= */

    construirHome(
        dados
    );


    console.log(
        "🍓 BerryAnime atualizado.",
        dados
    );

}


/* =====================================================
   INICIAR HOME
===================================================== */

function iniciarHome(){

    carregarFotoPerfil();


    /*
     * Primeiro tenta o cache normal.
     */

    let cache =
        lerCache(
            false
        );


    /*
     * Se não existir cache recente,
     * tenta um cache antigo de emergência.
     */

    if(
        !cache
    ){

        cache =
            lerCache(
                true
            );

    }


    /*
     * Mostra o cache imediatamente.
     *
     * Assim a página não fica vazia
     * enquanto a Jikan responde.
     */

    if(
        cache
    ){

        construirHome(
            cache
        );

    }


    /*
     * Atualiza os dados em segundo plano.
     */

    atualizarHome()
        .catch(
            erro => {

                console.warn(
                    "Erro ao atualizar Home:",
                    erro
                );


                /*
                 * Se a API falhar completamente,
                 * mantém o cache que já foi mostrado.
                 */

                if(
                    cache
                ){

                    construirHome(
                        cache
                    );

                }

            }
        );

}


/* =====================================================
   QUANDO VOLTAR PARA A HOME
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();

    }
);


/* =====================================================
   ATUALIZAR FOTO DO PERFIL
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

iniciarHome();


/* =====================================================
   FIM DO SCRIPT
===================================================== */

</script>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    background:#0b0b0d;
    color:#fff;
}

body{
    padding-bottom:76px;
}


/* =====================================================
   TOPO
===================================================== */

.topbar{
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;
}

.logo{
    width:43px;
    height:43px;

    object-fit:contain;
}

.top-right{
    display:flex;
    align-items:center;

    gap:20px;
}


/* PESQUISA */

.search-icon{
    width:27px;
    height:27px;

    fill:none;
    stroke:#fff;
    stroke-width:2.2;

    stroke-linecap:round;
    stroke-linejoin:round;

    cursor:pointer;
}


/* PERFIL */

.profile{
    width:40px;
    height:40px;

    border-radius:50%;

    background:#303033;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.profile svg{
    width:24px;
    height:24px;

    fill:#777;
}


/* =====================================================
   SEÇÕES
===================================================== */

.section{
    margin-top:18px;
}

.section-title{
    margin:0 18px 11px;

    font-size:20px;
    line-height:24px;

    font-weight:700;
}


/* =====================================================
   CARDS GRANDES
   EM ALTA / NOVOS EPISÓDIOS
===================================================== */

.large-row{
    display:flex;

    gap:12px;

    overflow-x:auto;

    padding:0 18px 5px;

    scrollbar-width:none;
}

.large-row::-webkit-scrollbar{
    display:none;
}

.large-card{

    width:59vw;
    min-width:59vw;

    height:180px;

    flex-shrink:0;

    position:relative;

    overflow:hidden;

    border-radius:12px;

    background:#18181b;

    cursor:pointer;
}


/*
   A API AniList fornece bannerImage.
   Assim usamos a imagem horizontal sem
   cortar personagens.
*/

.large-card img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* gradiente inferior */

.large-gradient{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:60px 12px 11px;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.94)
    );
}

.large-title{

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.large-info{

    margin-top:4px;

    font-size:12px;

    color:#ddd;
}


/* =====================================================
   CARDS PEQUENOS
===================================================== */

.small-row{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:0 18px 5px;

    scrollbar-width:none;
}

.small-row::-webkit-scrollbar{
    display:none;
}

.small-card{

    width:132px;
    min-width:132px;

    flex-shrink:0;

    cursor:pointer;
}

.small-card img{

    display:block;

    width:132px;
    height:180px;

    object-fit:contain;

    border-radius:9px;

    background:#18181b;
}


/*
   IMPORTANTE:
   Não mostramos nome nos cards pequenos.
*/


/* =====================================================
   CONTINUE ASSISTINDO
===================================================== */

.continue-row{

    display:flex;

    gap:12px;

    overflow-x:auto;

    padding:0 18px;

    scrollbar-width:none;
}

.continue-row::-webkit-scrollbar{
    display:none;
}

    min-width:78vw;

    height:175px;

    overflow:hidden;

    border-radius:12px;

    background:#18181b;

.continue-card img{

    height:100%;

    right:0;

.continue-title{

    font-size:16px;

    font-weight:bold;
}

.progress{

    width:100%;
    height:4px;

    margin-top:8px;

    background:#555;

    border-radius:5px;
}

.progress-bar{

    width:45%;
    height:100%;

    background:#ed1745;

    border-radius:5px;

/* =====================================================
   LANÇAMENTO
===================================================== */

.release-card{

    margin:0 18px;

    border-radius:13px;

    overflow:hidden;

    background:#1a1a1c;

    position:relative;
}

.release-image{

    width:100%;

    aspect-ratio:16/9;

    display:block;

    object-fit:cover;

    background:#18181b;
}

.release-content{

    padding:13px 16px 18px;
}

.release-title{

    font-size:19px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.release-meta{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:8px;

    color:#aaa;

    font-size:13px;

.age{

    color:#fff;

    border-radius:5px;

    line-height:20px;

    color:#ddd;

    -webkit-box-orient:vertical;

    overflow:hidden;

.release-buttons{

    position:absolute;

    height:48px;

    }

        height:205px;
    }

</style>

/* =====================================================
   ANILIST API
===================================================== */

const API =
    "https://graphql.anilist.co";


/* =====================================================
   CONSULTA BASE
===================================================== */

async function buscar(
    sort,
    perPage = 15,
    extra = ""
){

    const query = `

        query {

            Page(
                page: 1,
                perPage: ${perPage}
            ){

                media(
                    type: ANIME
                    sort: ${sort}
                    ${extra}
                ){

                    id

                    title{
                        romaji
                        english
                        native
                    }

                    description

                    episodes

                    status

                    popularity

                    averageScore

                    coverImage{
                        large
                        extraLarge
                    }

                    bannerImage

                    genres

                    nextAiringEpisode{
                        episode
                        airingAt
                    }

                }

            }

        }

    `;


    try{

        const response =
            await fetch(API,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    query:query
                })

            });


        if(!response.ok){

            throw new Error(
                "Erro na AniList"
            );

        }


        const json =
            await response.json();


        return (
            json.data?.Page?.media
            || []
        );


    }catch(error){

        console.error(error);

        return [];

    }

}


/* =====================================================
   TÍTULO
===================================================== */

function titulo(anime){

    return (
        anime.title?.english ||
        anime.title?.romaji ||
        anime.title?.native ||
        "Anime"
    );

}


/* =====================================================
   CAPA
===================================================== */

function capa(anime){

    return (
        anime.coverImage?.extraLarge ||
        anime.coverImage?.large ||
        ""
    );

}


/* =====================================================
   BANNER
===================================================== */

function banner(anime){

    return (
        anime.bannerImage ||
        capa(anime)
    );

}


/* =====================================================
   CARD PEQUENO
   SEM NOME
===================================================== */

function cardPequeno(anime){

    return `

        <div
            class="small-card"
            onclick="abrirAnime(${anime.id})">

            <img
                src="${capa(anime)}"
                alt="${titulo(anime)}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD GRANDE
   NOME + EPISÓDIO
===================================================== */

function cardGrande(anime){

    let episodio = "";


    if(anime.nextAiringEpisode){

        episodio =
            "Episódio " +
            anime.nextAiringEpisode.episode;

    }
    else if(anime.episodes){

        episodio =
            anime.episodes +
            " episódios";

    }
    else{

        episodio =
            "Em exibição";

    }


    return `

        <div
            class="large-card"
            onclick="abrirAnime(${anime.id})">

            <img
                src="${banner(anime)}"
                alt="${titulo(anime)}"
                loading="lazy">

            <div
                class="large-gradient">

                <div
                    class="large-title">

                    ${titulo(anime)}

                </div>

                <div
                    class="large-info">

                    ${episodio}

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   EM ALTA
   8 ANIMES
===================================================== */

async function carregarEmAlta(){

    const lista =
        await buscar(
            "TRENDING_DESC",
            8
        );


    document.getElementById(
        "emAlta"
    ).innerHTML =
        lista.map(

}

/* =====================================================
   LANÇAMENTO
   1 ANIME
===================================================== */

async function carregarLancamento(){

    const lista =
        await buscar(
            "START_DATE_DESC",
            1
        );


    const anime =
        lista[0];


    if(!anime){

        return;

    }


    document.getElementById(
        "lancamento"
    ).innerHTML = `

        <div
            class="release-card"
            onclick="abrirAnime(${anime.id})">

            <img
                class="release-image"
                src="${banner(anime)}"
                alt="${titulo(anime)}"
                loading="lazy">


            <div
                class="release-buttons">

                <div
                    class="release-button">

                    ▶

                </div>

                <div
                    class="release-button">

                    ⓘ

                </div>

            </div>


            <div
                class="release-content">

                <div
                    class="release-title">

                    ${titulo(anime)}

                </div>


                <div
                    class="release-meta">

                    <span class="age">
                        14
                    </span>

                    <span>
                        ${anime.genres?.[0] || "Anime"}
                    </span>

                </div>


                <div
                    class="release-description">

                    ${limparDescricao(
                        anime.description
                    )}

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   LIMPAR DESCRIÇÃO
===================================================== */

function limparDescricao(texto){

    if(!texto){

        return "Novo anime disponível no BerryAnime.";

    }


    return texto
        .replace(/<[^>]*>/g,"")
        .replace(/&quot;/g,'"')
        .replace(/&#039;/g,"'")
        .replace(/&amp;/g,"&");

}


/* =====================================================
   CATEGORIA
===================================================== */

async function categoria(
    elemento,
    genero
){

    const lista =

            "POPULARITY_DESC",
            15,
            `genre: ${genero}`
        );


    document.getElementById(
        elemento

        lista.map(
            cardPequeno
        ).join("");

}

/* =====================================================
   HISTÓRICO
===================================================== */

function carregarHistorico(){

    const lista =
        JSON.parse(
            localStorage.getItem(
                "berryanime_historico"
            ) || "[]"
        );


    if(!lista.length){

        return;

    }


    document.getElementById(
        "historicoSection"
    ).style.display =
        "block";


    document.getElementById(
        "historico"
    ).innerHTML =
        lista
        .slice(0,15)
        .map(cardPequeno)
        .join("");

}


/* =====================================================
   CONTINUE ASSISTINDO
===================================================== */

function carregarContinue(){

    const lista =
        JSON.parse(
            localStorage.getItem(
                "berryanime_continue"
            ) || "[]"
        );


    if(!lista.length){

        return;

    }


    document.getElementById(
        "continueSection"
    ).style.display =
        "block";


    document.getElementById(
        "continueAssistindo"
    ).innerHTML =

        lista.map(anime => `

            <div
                class="continue-card"
                onclick="
                    abrirAnime(${anime.id})
                ">

                <img
                    src="${
                        anime.bannerImage
                        || anime.coverImage?.large
                        || anime.cover
                    }"
                    alt="${titulo(anime)}">


                <div
                    class="continue-gradient">

                    <div
                        class="continue-title">

                        ${titulo(anime)}

                    </div>


                    <div
                        class="progress">

                        <div
                            class="progress-bar">
                        </div>

                    </div>

                </div>

            </div>

        `).join("");

}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BerryAnime</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    background:#090909;
    color:white;
    padding-bottom:80px;

}


/* TOPO */

.header{

    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;

}


.logo{

    width:45px;
    height:45px;

    border-radius:50%;

    background:#ff4054;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;

}



.header-icons{

    display:flex;
    align-items:center;
    gap:20px;

}


.search{

    font-size:28px;

}



.user{

    width:38px;
    height:38px;

    border-radius:50%;

    background:
    linear-gradient(135deg,#ff00cc,#4000ff);

}



/* TITULOS */

.title-section{

    font-size:22px;
    font-weight:bold;

    margin:20px 15px 12px;

}



/* LISTAS */

.container{

    display:flex;
    gap:12px;

    overflow-x:auto;

    padding:0 15px;

    scrollbar-width:none;

}


.container::-webkit-scrollbar{

    display:none;

}



/* CARD PEQUENO */

.anime-card{

    min-width:92px;
    height:135px;

    border-radius:7px;

    overflow:hidden;

    background:#171717;

}



.anime-card img{

    width:100%;
    height:100%;

    object-fit:cover;

}



/* NOVOS EPISÓDIOS */


.episode-card{

    min-width:270px;

    height:160px;

    border-radius:9px;

    overflow:hidden;

    position:relative;

}



.episode-card img{

    width:100%;
    height:100%;

    object-fit:cover;

}



.episode-shadow{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:80px;

    background:linear-gradient(
    transparent,
    rgba(0,0,0,.95)
    );

}



.badge{

    position:absolute;

    top:8px;
    right:8px;

    background:#555;

    padding:4px 8px;

    font-size:11px;

    border-radius:4px;

}



.episode-text{

    position:absolute;

    bottom:10px;

    left:10px;

}



.episode-title{

    font-size:15px;

    font-weight:bold;

}



.episode-sub{

    color:#ddd;

    font-size:12px;

    margin-top:4px;

}



/* MENU INFERIOR */


.bottom-menu{

    position:fixed;

    bottom:0;

    left:0;
    right:0;

    height:65px;

    background:#101010;

    border-top:1px solid #222;

    display:flex;

    justify-content:space-around;

    align-items:center;

}



.menu-item{

    text-align:center;

    font-size:12px;

    color:#777;

}



.menu-active{

    color:white;

}



</style>

</head>


<body>


<header class="header">


<div class="logo">
🍓
</div>


<div class="header-icons">

<div class="search">
⌕
</div>


<div class="user"></div>


</div>


</header>

  <div id="app"></div>



<div class="bottom-menu">


<div class="menu-item menu-active">

⌂<br>
Início

</div>


<div class="menu-item">

▣<br>
Anime

</div>


<div class="menu-item">

♡<br>
Favoritos

</div>


<div class="menu-item">

☰<br>
Mais

</div>


</div>



<script>


const app = document.getElementById("app");


const API = "https://api.jikan.moe/v4";



async function api(url){

    try{

        const res = await fetch(API + url);

        const data = await res.json();

        return data.data || [];

    }

    catch(e){

        return [];

    }

}




function smallCard(anime){

return `

<div class="anime-card">

<img src="${anime.images.jpg.image_url}">

</div>

`;

}




function episodeCard(anime,index){

return `

<div class="episode-card">


<img src="${anime.images.jpg.large_image_url}">



<div class="badge">

Dublado

</div>



<div class="episode-shadow"></div>



<div class="episode-text">


<div class="episode-title">

${anime.title}

</div>


<div class="episode-sub">

${index + 1}. O caçador mais fraco

</div>


</div>



</div>

`;

}





function section(name,content){


return `

<section>


<div class="title-section">

${name}

</div>


<div class="container">

${content}

</div>


</section>

`;

}




async function loadAnime(){



// populares

let popular = await api(
"/top/anime?filter=bypopularity"
);



app.innerHTML += section(

"Em alta",

popular
.slice(0,12)
.map(smallCard)
.join("")

);





// novos episódios

let airing = await api(

"/seasons/now"

);



app.innerHTML += section(

"Novos episódios",

airing
.slice(0,10)
.map(episodeCard)
.join("")

);






// lançamentos

let latest = await api(

"/anime?order_by=start_date&sort=desc"

);



app.innerHTML += section(

"Novos animes",

latest
.slice(0,12)
.map(smallCard)
.join("")

);






// ação

let action = await api(

"/anime?genres=1&order_by=popularity"

);



app.innerHTML += section(

"Ação",

action
.slice(0,12)
.map(smallCard)
.join("")

);







// fantasia

let fantasy = await api(

"/anime?genres=10&order_by=popularity"

);



app.innerHTML += section(

"Fantasia",

fantasy
.slice(0,12)
.map(smallCard)
.join("")

);







// romance

let romance = await api(

"/anime?genres=22&order_by=popularity"

);



app.innerHTML += section(

"Romance",

romance
.slice(0,12)
.map(smallCard)
.join("")

);





loadAnime();


</script>

 <style>

/* AJUSTES FINAIS DE ESCALA */

@media (max-width:600px){


.header{

    height:65px;
    padding:0 14px;

}


.logo{

    width:42px;
    height:42px;

    font-size:21px;

}



.title-section{

    font-size:20px;

    margin-left:14px;

}



.container{

    padding-left:14px;

    gap:10px;

}



.anime-card{

    min-width:82px;

    height:122px;

}



.episode-card{

    min-width:285px;

    height:165px;

}


}




/* EFEITO DE DESLIZE SUAVE */

.container{

scroll-behavior:smooth;

}



/* PRIMEIRO CARD SEMPRE ALINHADO */

section{

margin-bottom:18px;

}



/* SOMBRA NOS CARDS */

.anime-card,
.episode-card{

box-shadow:

0 4px 12px rgba(0,0,0,.35);

}



/* ESCONDER TEXTO DOS CARDS NORMAIS */

.anime-card{

position:relative;

}



/* NOVOS EPISÓDIOS COM MAIS DESTAQUE */

.episode-title{

max-width:220px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}



/* MENU IGUAL APP */

.bottom-menu{

z-index:100;

}



</style>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button,
.profile-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    overflow:hidden;
}

.header-button:active,
.profile-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg,
.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-button{
    background:#181818;
    border:1px solid #333;
    flex-shrink:0;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.7);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.88),
        rgba(0,0,0,.25),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

section{
    margin-bottom:18px;
}

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button,
    .profile-button{
        width:40px;
        height:40px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .release-card{
        margin:0 14px;
        height:180px;
    }

    .release-title{
        font-size:18px;
    }

    .bottom-menu{
        height:66px;
    }

}

</style>

</head>

<script>

/* =====================================================
   PERFIL E PESQUISA
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}

function abrirPesquisa(){

    alert(
        "A pesquisa ainda está sendo preparada."
    );

}


/* =====================================================
   FOTO DO PERFIL
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";

function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );

    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }
    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   API
===================================================== */

const app =
    document.getElementById("app");

const API =
    "https://api.jikan.moe/v4";


/* =====================================================
   SISTEMA DE FILA JIKAN
===================================================== */

let ultimaRequisicao =
    0;

const INTERVALO_API =
    1200;


function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


async function api(url){

    const agora =
        Date.now();

    const espera =
        Math.max(
            0,
            INTERVALO_API -
            (agora - ultimaRequisicao)
        );

    if(espera > 0){

        await esperar(
            espera
        );

    }

    ultimaRequisicao =
        Date.now();

    try{

        const res =
            await fetch(
                API + url
            );

        if(
            res.status === 429
        ){

            console.log(
                "Jikan 429. Aguardando..."
            );

            await esperar(
                3500
            );

            return api(url);

        }

        if(!res.ok){

            throw new Error(
                "HTTP " +
                res.status
            );

        }

        const json =
            await res.json();

        return json.data || [];

    }

    catch(error){

        console.log(
            "Erro Jikan:",
            url,
            error
        );

        return [];

    }

}


/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
    "berryanime_home_cache_v6";

const CACHE_TIME =
    1000 * 60 * 30;


function salvarCache(dados){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:
                    Date.now(),

                data:
                    dados

            })
        );

    }

    catch(error){

        console.log(
            "Erro cache:",
            error
        );

    }

}


function lerCache(){

    try{

        const salvo =
            localStorage.getItem(
                CACHE_KEY
            );

        if(!salvo){

            return null;

        }

        const objeto =
            JSON.parse(
                salvo
            );

        if(
            !objeto ||
            !objeto.data
        ){

            return null;

        }

        return objeto.data;

    }

    catch(error){

        return null;

    }

}


/* =====================================================
   CAPA
===================================================== */

function imagemAnime(anime){

    return (
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.jpg?.image_url ||
        anime?.images?.jpg?.small_image_url ||
        ""
    );

}


/* =====================================================
   CARD
===================================================== */

function smallCard(anime){

    const image =
        imagemAnime(
            anime
        );

    const id =
        anime?.mal_id;

    if(
        !image ||
        !id
    ){

        return "";

    }

    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${image}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   ABRIR ANIME
===================================================== */

function abrirAnime(id){

    if(!id){

        return;

    }

    window.location.href =
        "detalhes.html?id=" +
        id;

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(lista){

    const mapa =
        new Map();

    (lista || []).forEach(
        anime => {

            if(
                anime &&
                anime.mal_id
            ){

                mapa.set(
                    anime.mal_id,
                    anime
                );

            }

        }
    );

    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   SECÇÃO NORMAL

   IMPORTANTE:
   NÃO usamos um Set global aqui.
   Cada secção pode mostrar os seus próprios
   animes mesmo que apareçam noutra secção.
===================================================== */

function section(
    nome,
    lista
){

    const disponiveis =
        removerDuplicados(
            lista
        );

    if(
        !disponiveis.length
    ){

        return `

            <section>

                <div class="title-section">
                    ${nome}
                </div>

                <div class="container">

                    <div style="
                        color:#777;
                        padding:15px 0;
                    ">
                        Nenhum anime encontrado.
                    </div>

                </div>

            </section>

        `;

    }

    const selecionados =
        disponiveis
        .slice(0,10);


    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    selecionados
                    .map(
                        smallCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}

/* =====================================================
   CARD DE EPISÓDIO
===================================================== */

function episodeCard(anime){

    const image =
        imagemAnime(
            anime
        );

    const id =
        anime?.mal_id;

    if(
        !image ||
        !id
    ){

        return "";

    }

    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${image}"
                alt="${anime.title || "Novo episódio"}"
                loading="lazy">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${anime.title || "Novo episódio"}
                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   SECÇÃO EPISÓDIOS
===================================================== */

function episodeSection(
    nome,
    lista
){

    const disponiveis =
        removerDuplicados(
            lista
        );

    if(
        !disponiveis.length
    ){

        return "";

    }

    const selecionados =
        disponiveis.slice(
            0,
            8
        );


    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    selecionados
                    .map(
                        episodeCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   LANÇAMENTO
===================================================== */

function releaseSection(
    anime
){

    if(!anime){

        return "";

    }

    const id =
        anime?.mal_id;

    const image =
        imagemAnime(
            anime
        );

    if(
        !id ||
        !image
    ){

        return "";

    }

    return `

        <section>

            <div class="title-section">
                Lançamentos
            </div>

            <div
                class="release-card"
                onclick="abrirAnime(${id})">

                <img
                    src="${image}"
                    alt="${anime.title || "Lançamento"}">

                <div class="release-gradient"></div>

                <div class="release-info">

                    <div class="release-label">
                        DESTAQUE
                    </div>

                    <div class="release-title">
                        ${anime.title || "Lançamento"}
                    </div>

                    <div class="release-sub">
                        Acompanhe no BerryAnime
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(
    dados
){

    if(!dados){

        return;

    }


    const popular =
        dados.popular || [];

    const airing =
        dados.airing || [];

    const score =
        dados.score || [];

    const favorites =
        dados.favorites || [];


    const action =
        dados.action || [];

    const comedy =
        dados.comedy || [];

    const shounen =
        dados.shounen || [];

    const slice =
        dados.slice || [];

    const romance =
        dados.romance || [];

    const fantasy =
        dados.fantasy || [];


    let html = "";


    /* =================================================
       1. EM ALTA
    ================================================= */

    html += section(
        "🔥 Em alta",
        popular
    );


    /* =================================================
       2. NOVOS EPISÓDIOS
    ================================================= */

    html += episodeSection(
        "Novos episódios",
        airing
    );


    /* =================================================
       3. MAIS BEM AVALIADOS
    ================================================= */

    html += section(
        "Mais bem avaliados",
        score
    );


    /* =================================================
       4. AÇÃO
    ================================================= */

    html += section(
        "⚔️ Ação",
        action
    );


    /* =================================================
       5. COMÉDIA
    ================================================= */

    html += section(
        "😂 Comédia",
        comedy
    );


    /* =================================================
       6. SHOUNEN
    ================================================= */

    html += section(
        "🔥 Shounen",
        shounen
    );


    /* =================================================
       7. SLICE OF LIFE
    ================================================= */

    html += section(
        "🌿 Slice of Life",
        slice
    );


    /* =================================================
       8. VOCÊ VAI AMAR
    ================================================= */

    html += section(
        "❤️ Você vai amar",
        popular.slice(
            10,
            30
        )
    );


    /* =================================================
       9. LANÇAMENTOS
    ================================================= */

    const lancamento =
        airing.length
            ? airing[0]
            : (
                score.length
                    ? score[0]
                    : null
            );


    html += releaseSection(
        lancamento
    );


    /* =================================================
       10. ROMANCE
    ================================================= */

    html += section(
        "❤️ Romance",
        romance
    );


    /* =================================================
       11. FANTASIA
    ================================================= */

    html += section(
        "✨ Fantasia",
        fantasy
    );


    /* =================================================
       12. TALVEZ VOCÊ GOSTE
    ================================================= */

    html += section(
        "Talvez você goste",
        score.slice(
            10,
            30
        )
    );


    /* =================================================
       13. MAIS CURTIDOS
    ================================================= */

    html += section(
        "Os mais curtidos de hoje!",
        favorites
    );


    if(!html){

        html = `

            <div style="
                text-align:center;
                padding:60px 20px;
                color:#888;
            ">

                Não foi possível carregar
                os animes agora.

            </div>

        `;

    }


    app.innerHTML =
        html;

}


/* =====================================================
   CARREGAR DADOS DA HOME
===================================================== */

async function atualizarHome(){

    console.log(
        "Iniciando atualização da Home..."
    );


    /*
     * AQUI ESTÁ A DIFERENÇA IMPORTANTE:
     *
     * Não fazemos Promise.all.
     *
     * Os pedidos entram numa fila.
     *
     * Isso reduz muito os erros 429.
     */


    const dados = {

        popular:[],

        airing:[],

        score:[],

        action:[],

        comedy:[],

        shounen:[],

        slice:[],

        romance:[],

        fantasy:[],

        favorites:[]

    };


    /* =================================================
       1. POPULARES
    ================================================= */

    dados.popular =
        await api(
            "/top/anime?filter=bypopularity&limit=25"
        );


    /* =================================================
       2. TEMPORADA ATUAL
    ================================================= */

    dados.airing =
        await api(
            "/seasons/now?limit=25"
        );


    /* =================================================
       3. MAIS BEM AVALIADOS
    ================================================= */

    dados.score =
        await api(
            "/anime?order_by=score&sort=desc&limit=25"
        );


    /*
     * Agora buscamos cada género separadamente.
     *
     * IDs oficiais de géneros Jikan:
     *
     * Action       = 1
     * Comedy       = 4
     * Fantasy      = 10
     * Romance      = 22
     * Shounen      = 27
     * Slice of Life= 36
     */


    /* =================================================
       4. AÇÃO
    ================================================= */

    dados.action =
        await api(
            "/anime?genres=1&order_by=popularity&sort=asc&limit=15"
        );


    /* =================================================
       5. COMÉDIA
    ================================================= */

    dados.comedy =
        await api(
            "/anime?genres=4&order_by=popularity&sort=asc&limit=15"
        );


    /* =================================================
       6. SHOUNEN
    ================================================= */

    dados.shounen =
        await api(
            "/anime?genres=27&order_by=popularity&sort=asc&limit=15"
        );


    /* =================================================
       7. SLICE OF LIFE
    ================================================= */

    dados.slice =
        await api(
            "/anime?genres=36&order_by=popularity&sort=asc&limit=15"
        );


    /* =================================================
       8. ROMANCE
    ================================================= */

    dados.romance =
        await api(
            "/anime?genres=22&order_by=popularity&sort=asc&limit=15"
        );


    /* =================================================
       9. FANTASIA
    ================================================= */

    dados.fantasy =
        await api(
            "/anime?genres=10&order_by=popularity&sort=asc&limit=15"
        );


    /* =================================================
       10. FAVORITOS
    ================================================= */

    dados.favorites =
        dados.popular.slice(
            0,
            15
        );


    /*
     * Guardar tudo no cache.
     */

    salvarCache(
        dados
    );


    /*
     * Mostrar tudo.
     */

    construirHome(
        dados
    );


    console.log(
        "Home atualizada.",
        dados
    );

      }

   /* =====================================================
   INICIAR HOME
===================================================== */

function iniciarHome(){

    carregarFotoPerfil();


    /*
     * Primeiro tenta mostrar o cache.
     */

    const cache =
        lerCache();


    if(cache){

        construirHome(
            cache
        );

    }


    /*
     * Depois busca dados novos.
     */

    atualizarHome();

}


/* =====================================================
   QUANDO VOLTAR PARA A HOME
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();


        const cache =
            lerCache();


        if(cache){

            construirHome(
                cache
            );

        }

    }
);


/* =====================================================
   ATUALIZAR FOTO DO PERFIL
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

iniciarHome();

</script>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:#fff;
    padding-bottom:80px;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#181818;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    background:#171717;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.7);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
    cursor:pointer;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.88),
        rgba(0,0,0,.25),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}

.section-loading{
    display:flex;
    gap:12px;
    padding:0 15px;
    overflow:hidden;
}

.loading-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    background:linear-gradient(
        90deg,
        #141414 25%,
        #222 50%,
        #141414 75%
    );
    background-size:200% 100%;
    animation:loading 1.3s infinite;
}

@keyframes loading{

    0%{
        background-position:200% 0;
    }

    100%{
        background-position:-200% 0;
    }

}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:#fff;
}

section{
    margin-bottom:18px;
}

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .header-button svg{
        width:23px;
        height:23px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .profile-button svg{
        width:23px;
        height:23px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .release-card{
        margin:0 14px;
        height:180px;
    }

    .release-title{
        font-size:18px;
    }

    .bottom-menu{
        height:66px;
    }

}

@media(max-width:380px){

    .header{
        padding:0 12px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .profile-button{
        width:38px;
        height:38px;
    }

    .header-button{
        width:38px;
        height:38px;
    }

    .anime-card{
        min-width:78px;
        height:116px;
    }

}

</style>

</head>

<body>

        </svg>

        <span>Mais</span>

<script>

/* =====================================================
   JAVASCRIPT — PARTE 1
===================================================== */

const app =
    document.getElementById("app");

const API =
    "https://api.jikan.moe/v4";

const AVATAR_KEY =
    "berryanime_profile_avatar";

const CACHE_KEY =
    "berryanime_home_cache_v13";

const CACHE_TIME =
    1000 * 60 * 60 * 6;

const CACHE_MAX_TIME =
    1000 * 60 * 60 * 72;

const INTERVALO_API =
    1600;

let ultimaRequisicao =
    0;


/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}

function abrirPesquisa(){

    alert(
        "A pesquisa ainda está sendo preparada."
    );

}

function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );

    if(
        !profileImage ||
        !profileIcon
    ){

        return;

    }

    if(
        imagem &&
        imagem.trim()
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   UTILITÁRIOS
===================================================== */

function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}

function escaparHTML(texto){

    return String(
        texto || ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function imagemAnime(anime){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.webp?.image_url ||
        anime?.images?.jpg?.image_url ||
        anime?.images?.jpg?.small_image_url ||
        ""
    );

}

function abrirAnime(id){

    if(!id){
        return;
    }

    window.location.href =
        "detalhes.html?id=" +
        encodeURIComponent(id);

}

function removerDuplicados(lista){

    const mapa =
        new Map();

    (
        lista || []
    ).forEach(
        anime => {

            if(
                anime &&
                anime.mal_id
            ){

                mapa.set(
                    anime.mal_id,
                    anime
                );

            }

        }
    );

    return Array.from(
        mapa.values()
    );

}

function somenteValidos(lista){

    return removerDuplicados(
        lista
    ).filter(
        anime =>
            anime?.mal_id &&
            imagemAnime(anime)
    );

}


/* =====================================================
   CACHE
===================================================== */

function salvarCache(dados){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:
                    Date.now(),

                data:
                    dados

            })
        );

    }
    catch(error){

        console.warn(
            "Erro ao guardar cache:",
            error
        );

    }

}

function lerCache(antigo = false){

    try{

        const salvo =
            localStorage.getItem(
                CACHE_KEY
            );

        if(!salvo){
            return null;
        }

        const objeto =
            JSON.parse(
                salvo
            );

        if(
            !objeto ||
            !objeto.data
        ){

            return null;

        }

        const idade =
            Date.now() -
            Number(
                objeto.time || 0
            );

        const limite =
            antigo
                ? CACHE_MAX_TIME
                : CACHE_TIME;

        if(
            idade > limite
        ){

            return null;

        }

        return objeto.data;

    }
    catch(error){

        return null;

    }

}


/* =====================================================
   JAVASCRIPT — PARTE 2
===================================================== */


/* =====================================================
   API JIKAN COM RETRY E TIMEOUT
===================================================== */

async function fetchComTimeout(
    url,
    timeout = 15000
){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () =>
                controller.abort(),
            timeout
        );

    try{

        return await fetch(
            url,
            {
                method:"GET",

                headers:{
                    "Accept":
                        "application/json"
                },

                signal:
                    controller.signal
            }
        );

    }
    finally{

        clearTimeout(
            timer
        );

    }

}


async function api(
    endpoint,
    tentativa = 0
){

    const agora =
        Date.now();

    const intervalo =
        agora -
        ultimaRequisicao;

    const espera =
        Math.max(
            0,
            INTERVALO_API -
            intervalo
        );

    if(
        espera > 0
    ){

        await esperar(
            espera
        );

    }

    ultimaRequisicao =
        Date.now();

    try{

        console.log(
            "🍓 Jikan:",
            endpoint
        );

        const resposta =
            await fetchComTimeout(
                API +
                endpoint
            );


        /* ---------------------------------------------
           RATE LIMIT
        --------------------------------------------- */

        if(
            resposta.status ===
            429
        ){

            console.warn(
                "⚠️ Jikan 429"
            );

            if(
                tentativa >= 3
            ){

                return [];

            }

            await esperar(
                5000 +
                tentativa * 3000
            );

            return api(
                endpoint,
                tentativa + 1
            );

        }


        /* ---------------------------------------------
           ERROS DO SERVIDOR
        --------------------------------------------- */

        if(
            resposta.status >= 500
        ){

            console.warn(
                "⚠️ Jikan servidor:",
                resposta.status
            );

            if(
                tentativa < 2
            ){

                await esperar(
                    4000 +
                    tentativa * 2500
                );

                return api(
                    endpoint,
                    tentativa + 1
                );

            }

            return [];

        }


        if(
            !resposta.ok
        ){

            console.warn(
                "⚠️ Jikan HTTP:",
                resposta.status
            );

            return [];

        }


        const json =
            await resposta.json();


        if(
            !json ||
            !Array.isArray(
                json.data
            )
        ){

            return [];

        }


        return json.data;

    }
    catch(error){

        console.warn(
            "⚠️ Falha Jikan:",
            endpoint,
            error
        );


        if(
            tentativa < 2
        ){

            await esperar(
                3500 +
                tentativa * 2000
            );

            return api(
                endpoint,
                tentativa + 1
            );

        }


        return [];

    }

}


/* =====================================================
   CARDS
===================================================== */

function smallCard(anime){

    const imagem =
        imagemAnime(
            anime
        );

    const id =
        anime?.mal_id;

    if(
        !imagem ||
        !id
    ){

        return "";

    }

    const titulo =
        escaparHTML(
            anime.title ||
            "Anime"
        );

    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${titulo}"
                loading="lazy"
                decoding="async"
                onerror="
                    this.parentElement.style.display='none';
                ">

        </div>

    `;

}


function episodeCard(anime){

    const imagem =
        imagemAnime(
            anime
        );

    const id =
        anime?.mal_id;

    if(
        !imagem ||
        !id
    ){

        return "";

    }

    const titulo =
        escaparHTML(
            anime.title ||
            "Novo episódio"
        );

    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${titulo}"
                loading="lazy"
                decoding="async"
                onerror="
                    this.parentElement.style.display='none';
                ">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${titulo}
                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   SEÇÃO NORMAL
===================================================== */

function section(
    nome,
    lista
){

    const disponiveis =
        somenteValidos(
            lista
        );

    if(
        !disponiveis.length
    ){

        return "";

    }

    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    disponiveis
                    .slice(0,10)
                    .map(
                        smallCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   SEÇÃO DE EPISÓDIOS
===================================================== */

function episodeSection(
    nome,
    lista
){

    const disponiveis =
        somenteValidos(
            lista
        );

    if(
        !disponiveis.length
    ){

        return "";

    }

    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    disponiveis
                    .slice(0,8)
                    .map(
                        episodeCard
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   LANÇAMENTOS
===================================================== */

function releaseSection(
    anime
){

    if(!anime){
        return "";
    }

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(
            anime
        );

    if(
        !id ||
        !imagem
    ){

        return "";

    }

    const titulo =
        escaparHTML(
            anime.title ||
            "Lançamento"
        );

    return `

        <section>

            <div class="title-section">
                Lançamentos
            </div>

            <div
                class="release-card"
                onclick="abrirAnime(${id})">

                <img
                    src="${imagem}"
                    alt="${titulo}"
                    loading="lazy"
                    decoding="async">

                <div class="release-gradient"></div>

                <div class="release-info">

                    <div class="release-label">
                        DESTAQUE
                    </div>

                    <div class="release-title">
                        ${titulo}
                    </div>

                    <div class="release-sub">
                        Acompanhe no BerryAnime
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   GÊNERO
===================================================== */

function porGenero(
    lista,
    genero
){

    const procurado =
        String(
            genero || ""
        )
        .toLowerCase()
        .trim();

    return (
        lista || []
    ).filter(
        anime => {

            const generos =
                Array.isArray(
                    anime?.genres
                )
                    ? anime.genres
                    : [];

            return generos.some(
                item => {

                    const nome =
                        String(
                            item?.name ||
                            ""
                        )
                        .toLowerCase()
                        .trim();

                    return (
                        nome ===
                        procurado
                    );

                }
            );

        }
    );

}


/* =====================================================
   UNIVERSO
===================================================== */

function criarUniverso(
    dados
){

    return somenteValidos([

        ...(dados.popular || []),

        ...(dados.airing || []),

        ...(dados.score || [])

    ]);

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(
    dados
){

    if(!dados){
        return;
    }


    const popular =
        dados.popular || [];

    const airing =
        dados.airing || [];

    const score =
        dados.score || [];

    const favorites =
        dados.favorites || [];


    const universo =
        criarUniverso(
            dados
        );


    let html = "";


    /* ---------------------------------------------
       1 — EM ALTA
    --------------------------------------------- */

    html += section(
        "🔥 Em alta",
        popular
    );


    /* ---------------------------------------------
       2 — NOVOS EPISÓDIOS
    --------------------------------------------- */

    html += episodeSection(
        "Novos episódios",

/* =====================================================
   ATUALIZAÇÃO DA HOME
===================================================== */

async function atualizarHome(){

    console.log(
        "🍓 Iniciando atualização..."
    );


    /*
     * IMPORTANTE:
     *
     * Fazemos somente 3 chamadas principais:
     *
     * 1. Top por popularidade
     * 2. Temporada atual
     * 3. Top por nota
     *
     * O código antigo fazia várias chamadas
     * adicionais para cada gênero.
     *
     * Isso aumentava muito a possibilidade
     * de receber 429 da Jikan.
     */

    const dados = {

        popular: [],

        airing: [],

        score: [],

        favorites: []

    };


    /* =================================================
       1 — POPULARES
    ================================================= */

    try{

        const populares =
            await api(
                "/top/anime" +
                "?filter=bypopularity" +
                "&page=1" +
                "&limit=25"
            );


        dados.popular =
            somenteValidos(
                populares
            );


        dados.favorites =
            dados.popular.slice(
                0,
                15
            );


        /*
         * Mostra imediatamente
         * o que conseguiu carregar.
         */

        construirHome(
            dados
        );

    }
    catch(error){

        console.warn(
            "Erro nos populares:",
            error
        );

    }


    /* =================================================
       2 — TEMPORADA ATUAL
    ================================================= */

    try{

        const temporada =
            await api(
                "/seasons/now" +
                "?page=1" +
                "&limit=25"
            );


        dados.airing =
            somenteValidos(
                temporada
            );


        dados.favorites =
            dados.popular.slice(
                0,
                15
            );


        /*
         * Atualiza sem apagar
         * o que já carregou.
         */

        construirHome(
            dados
        );

    }
    catch(error){

        console.warn(
            "Erro na temporada:",
            error
        );

    }


    /* =================================================
       3 — MAIS BEM AVALIADOS
    ================================================= */

    try{

        const avaliados =
            await api(
                "/top/anime" +
                "?page=1" +
                "&limit=25"
            );


        dados.score =
            somenteValidos(
                avaliados
            );


        construirHome(
            dados
        );

    }
    catch(error){

        console.warn(
            "Erro nos avaliados:",
            error
        );

    }


    /* =================================================
       FAVORITOS
    ================================================= */

    dados.favorites =
        dados.popular.slice(
            0,
            15
        );


    /* =================================================
       SALVAR CACHE
    ================================================= */

    if(
        dados.popular.length ||
        dados.airing.length ||
        dados.score.length
    ){

        salvarCache(
            dados
        );

    }


    /* =================================================
       RESULTADO FINAL
    ================================================= */

    construirHome(
        dados
    );


    console.log(
        "🍓 Home concluída."
    );

}

/* =====================================================
   INICIAR HOME
===================================================== */

function iniciarHome(){

    carregarFotoPerfil();


    /*
     * Primeiro tenta cache recente.
     */

    const cache =
        lerCache(
            false
        );


    if(
        cache
    ){

        console.log(
            "🍓 Cache recente encontrado."
        );

        construirHome(
            cache
        );

    }
    else{

        /*
         * Se não houver cache recente,
         * tenta cache antigo.
         */

        const cacheAntigo =
            lerCache(
                true
            );


        if(
            cacheAntigo
        ){

            console.log(
                "🍓 Cache antigo usado como fallback."
            );

            construirHome(
                cacheAntigo
            );

        }
        else{

            /*
             * Só mostra loading se
             * realmente não houver dados guardados.
             */

            mostrarLoading();

        }

    }


    /*
     * Atualização em segundo plano.
     *
     * O cache continua visível enquanto
     * a Jikan responde.
     */

    atualizarHome()
        .catch(
            error => {

                console.error(
                    "❌ Erro inesperado:",
                    error
                );


                /*
                 * Nunca deixar a tela vazia
                 * se existir cache.
                 */

                const fallback =
                    lerCache(
                        true
                    );


                if(
                    fallback
                ){

                    construirHome(
                        fallback
                    );

                }

            }
        );

}

/*
 * Pré-carrega algumas imagens do primeiro conjunto.
 *
 * Isso ajuda a evitar que todas as capas
 * sejam requisitadas exatamente ao mesmo tempo.
 */

function prepararImagens(){

    const imagens =
        document.querySelectorAll(
            ".anime-card img, .episode-card img"
        );

    imagens.forEach(
        imagem => {

            imagem.addEventListener(
                "error",
                function(){

                    /*
                     * Se uma capa individual falhar,
                     * removemos somente aquele card.
                     *
                     * Uma capa quebrada não pode
                     * destruir a seção inteira.
                     */

                    const card =
                        this.closest(
                            ".anime-card, .episode-card"
                        );

                    if(card){

                        card.style.display =
                            "none";

                    }

                },
                {
                    once:true
                }
            );

        }
    );

}


/*
 * Observa novas capas que forem criadas
 * quando a Home for atualizada.
 */

const observadorHome =
    new MutationObserver(
        function(){

            prepararImagens();

        }
    );


if(app){

    observadorHome.observe(
        app,
        {
            childList:true,
            subtree:true
        }
    );

}


/*
 * Pequeno atraso para não executar
 * tudo exatamente no mesmo instante
 * da abertura da página.
 */

setTimeout(
    function(){

        iniciarHome();

    },
    100
);

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:82px;
}

/* =====================================================
   TOPO
===================================================== */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   TÍTULOS
===================================================== */

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}


/* =====================================================
   LISTA HORIZONTAL
===================================================== */

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD NORMAL
===================================================== */

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
    cursor:pointer;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =====================================================
   PLACEHOLDER
===================================================== */

.card-placeholder{
    min-width:92px;
    height:135px;
    border-radius:7px;
    background:#151515;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
}

.card-placeholder::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.06),
        transparent
    );
    animation:brilho 1.2s infinite;
}

@keyframes brilho{

    from{
        transform:translateX(-100%);
    }

    to{
        transform:translateX(100%);
    }

}


/* =====================================================
   EPISÓDIOS
===================================================== */

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    background:#171717;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
    cursor:pointer;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:90px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.72);
    padding:5px 8px;
    font-size:11px;
    border-radius:4px;
    z-index:2;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
    z-index:2;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:230px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}


/* =====================================================
   LANÇAMENTO
===================================================== */

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
    cursor:pointer;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.88),
        rgba(0,0,0,.28),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}


/* =====================================================
   ERRO / VAZIO
===================================================== */

.section-error{
    min-width:220px;
    color:#777;
    font-size:13px;
    padding:15px;
}


/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}


/* =====================================================
   SEÇÕES
===================================================== */

section{
    margin-bottom:18px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

    .anime-card,

@media(max-width:380px){

        width:38px;

    .anime-card,
    .card-placeholder{
        min-width:78px;
        height:116px;
    }

}

</style>

<script>

/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}


function abrirPesquisa(){

    alert(
        "A pesquisa ainda está sendo preparada."
    );

}


/* =====================================================
   FOTO DO PERFIL
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";


function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   JIKAN
===================================================== */

const API =
    "https://api.jikan.moe/v4";


/* =====================================================
   CACHE INDIVIDUAL POR SECÇÃO
===================================================== */

const CACHE_PREFIX =
    "berryanime_section_v1_";

const CACHE_TIME =
    1000 * 60 * 60;


function lerSecaoCache(
    nome
){

    try{

        const valor =
            localStorage.getItem(
                CACHE_PREFIX + nome
            );

        if(!valor){

            return null;

        }

        const objeto =
            JSON.parse(
                valor
            );

        if(
            !objeto ||
            !Array.isArray(
                objeto.data
            )
        ){

            return null;

        }

        if(
            Date.now() -
            objeto.time >
            CACHE_TIME
        ){

            return null;

        }

        return objeto.data;

    }

    catch(error){

        return null;

    }

}


function salvarSecaoCache(
    nome,
    dados
){

    try{

        localStorage.setItem(

            CACHE_PREFIX + nome,

            JSON.stringify({

                time:
                    Date.now(),

                data:
                    dados

            })

        );

    }

    catch(error){

        console.log(
            "Cache:",
            error
        );

    }

}


/* =====================================================
   PEDIDO JIKAN
===================================================== */

async function pedirJikan(
    endpoint
){

    try{

        const resposta =
            await fetch(
                API + endpoint
            );


        if(
            resposta.status ===
            429
        ){

            console.log(
                "Jikan 429:",
                endpoint
            );

            return null;

        }


        if(
            !resposta.ok
        ){

            console.log(
                "Jikan HTTP:",
                resposta.status,
                endpoint
            );

            return null;

        }


        const json =
            await resposta.json();


        return Array.isArray(
            json.data
        )
        ? json.data
        : [];

    }

    catch(error){

        console.log(
            "Jikan erro:",
            endpoint,
            error
        );

        return null;

    }

}


/* =====================================================
   FILA PARA EVITAR 429
===================================================== */

let ultimaRequisicao =
    0;


const INTERVALO_API =
    450;


function esperar(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


async function pedirFila(
    endpoint
){

    const agora =
        Date.now();


    const espera =
        Math.max(
            0,
            INTERVALO_API -
            (agora -
            ultimaRequisicao)
        );


    if(
        espera > 0
    ){

        await esperar(
            espera
        );

    }


    ultimaRequisicao =
        Date.now();


    let dados =
        await pedirJikan(
            endpoint
        );


    /*
     * Se a Jikan responder 429,
     * esperamos e tentamos novamente
     * apenas uma vez.
     */

    if(
        dados === null
    ){

        await esperar(
            1200
        );


        ultimaRequisicao =
            Date.now();


        dados =
            await pedirJikan(
                endpoint
            );

    }


    return dados;

}


/* =====================================================
   IMAGEM
===================================================== */

function imagemAnime(
    anime
){

    return (

        anime?.images?.jpg
            ?.large_image_url ||

        anime?.images?.jpg
            ?.image_url ||

        anime?.images?.jpg
            ?.small_image_url ||

        ""

    );

}


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function escapar(
    texto
){

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    );

}


/* =====================================================
   ABRIR ANIME
===================================================== */

function abrirAnime(
    id
){

    if(!id){

        return;

    }


    window.location.href =
        "detalhes.html?id=" +
        id;

}


/* =====================================================
   CARD NORMAL
===================================================== */

function criarCard(
    anime
){

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(
            anime
        );


    if(
        !id ||
        !imagem
    ){

        return "";

    }


    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${escapar(
                    anime.title ||
                    "Anime"
                )}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD EPISÓDIO
===================================================== */

function criarEpisodeCard(
    anime
){

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(
            anime
        );


    if(
        !id ||
        !imagem
    ){

        return "";

    }


    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${escapar(
                    anime.title ||
                    "Anime"
                )}"
                loading="lazy">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">

                    ${escapar(
                        anime.title ||
                        "Novo episódio"
                    )}

                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   MOSTRAR CARDS
===================================================== */

function mostrarCards(
    elemento,
    animes
){

    if(
        !elemento
    ){

        return;

    }


    const lista =
        Array.isArray(
            animes
        )
        ? animes
        : [];


    const html =
        lista
        .slice(0,10)
        .map(
            criarCard
        )
        .filter(Boolean)
        .join("");


    if(html){

        elemento.innerHTML =
            html;

    }

    else{

        elemento.innerHTML = `

            <div class="section-error">
                Nenhum anime encontrado.
            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR EPISÓDIOS
===================================================== */

function mostrarEpisodios(
    elemento,

){

    if(
        !elemento
    ){

    }

        .map(

            </div>

        `;

}


/* =====================================================
   CARREGAR UMA SECÇÃO
===================================================== */

async function carregarSecao(
    nome,
    endpoint,
    tipo = "normal"
){

    const elemento =
        document.getElementById(
            nome
        );


    if(
        !elemento
    ){

        return;

    }


    /*
     * PRIMEIRO:
     * cache aparece imediatamente.
     */

    const cache =
        lerSecaoCache(
            nome
        );


    if(cache){

        if(
            tipo ===
            "episode"
        ){

            mostrarEpisodios(
                elemento,
                cache
            );

        }

        else{

            mostrarCards(
                elemento,
                cache
            );

        }

    }


    /*
     * SEGUNDO:
     * atualiza pela API.
     */

    const dados =
        await pedirFila(
            endpoint
        );


    /*
     * Se falhou mas temos cache,
     * mantemos o cache.
     */

    if(
        dados === null
    ){

        if(cache){

            return;

        }

        elemento.innerHTML = `

            <div class="section-error">
                Não foi possível carregar agora.
            </div>

        `;

        return;

    }


    /*
     * Guardar cache
     */

    salvarSecaoCache(
        nome,
        dados
    );


    /*
     * Mostrar
     */

    if(
        tipo ===
        "episode"
    ){

        mostrarEpisodios(
            elemento,
            dados
        );

    }

    else{

        mostrarCards(
            elemento,
            dados
        );

    }

}

/* =====================================================
   LANÇAMENTO
===================================================== */

function mostrarLancamento(
    anime
){

    const elemento =
        document.getElementById(
            "release"
        );


    if(
        !elemento
    ){

        return;

    }


    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(
            anime
        );


    if(
        !id ||
        !imagem
    ){

        elemento.innerHTML = `

            <div class="section-error">
                Nenhum lançamento encontrado.
            </div>

        `;

        return;

    }


    elemento.innerHTML = `

        <div
            class="release-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${escapar(
                    anime.title ||
                    "Lançamento"
                )}">

            <div class="release-gradient"></div>

            <div class="release-info">

                <div class="release-label">
                    DESTAQUE
                </div>

                <div class="release-title">
                    ${escapar(
                        anime.title ||
                        "Lançamento"
                    )}
                </div>

                <div class="release-sub">
                    Acompanhe no BerryAnime
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   CARREGAR LANÇAMENTO
===================================================== */

async function carregarLancamento(){

    const elemento =
        document.getElementById(
            "release"
        );


    const cache =
        lerSecaoCache(
            "release"
        );


    if(cache){

        mostrarLancamento(
            cache[0]
        );

    }


    const dados =
        await pedirFila(
            "/seasons/now?limit=10"
        );


    if(
        dados === null
    ){

        return;

    }


    if(
        dados.length
    ){

        const anime =
            dados[0];


        salvarSecaoCache(
            "release",
            [anime]
        );


        mostrarLancamento(
            anime
        );

    }

}


/* =====================================================
   VOCÊ VAI AMAR
===================================================== */

async function carregarVoceVaiAmar(){

    const elemento =
        document.getElementById(
            "love"
        );


    const cache =
        lerSecaoCache(
            "love"
        );


    if(cache){

        mostrarCards(
            elemento,
            cache
        );

    }


    const dados =
        await pedirFila(
            "/top/anime?filter=favorite&limit=10"
        );


    if(
        dados === null
    ){

        return;

    }


    salvarSecaoCache(
        "love",
        dados
    );


    mostrarCards(
        elemento,
        dados
    );

}


/* =====================================================
   INICIALIZAR HOME
===================================================== */

async function iniciarHome(){

    carregarFotoPerfil();


    /*
     * Todas as secções são iniciadas.
     *
     * A fila controla as requisições
     * para evitar o erro 429.
     */

    const tarefas = [

        carregarSecao(
            "popular",
            "/top/anime?filter=bypopularity&limit=10"
        ),

        carregarSecao(
            "airing",
            "/seasons/now?limit=10",
            "episode"
        ),

        carregarSecao(
            "score",
            "/top/anime?filter=airing&limit=10"
        ),

        carregarSecao(
            "action",
            "/anime?genres=1&order_by=score&sort=desc&limit=10"
        ),

        carregarSecao(
            "comedy",
            "/anime?genres=4&order_by=score&sort=desc&limit=10"
        ),

        carregarSecao(
            "shounen",
            "/anime?genres=27&order_by=score&sort=desc&limit=10"
        ),

        carregarSecao(
            "slice",
            "/anime?genres=36&order_by=score&sort=desc&limit=10"
        ),

        carregarVoceVaiAmar(),

        carregarLancamento(),

        carregarSecao(
            "romance",
            "/anime?genres=22&order_by=score&sort=desc&limit=10"
        ),

        carregarSecao(
            "fantasy",
            "/anime?genres=10&order_by=score&sort=desc&limit=10"
        ),

        carregarSecao(
            "maybe",
            "/top/anime?limit=10"
        ),

        carregarSecao(
            "favorites",
            "/top/anime?filter=favorite&limit=10"
        )

    ];


    /*
     * Esperamos todas as tarefas apenas
     * para saber quando terminaram.
     *
     * A Home NÃO fica bloqueada:
     * cada secção aparece assim que
     * a sua própria chamada termina.
     */

    await Promise.allSettled(
        tarefas
    );

}

/* =====================================================
   INICIAR
===================================================== */

iniciarHome();

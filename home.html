<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
    overflow:hidden;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    flex-shrink:0;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.7);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

.release-card{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#151515;
}

.release-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.release-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.88),
        rgba(0,0,0,.25),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    bottom:18px;
    right:18px;
}

.release-label{
    display:inline-block;
    background:#ff1744;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

.release-title{
    font-size:20px;
    font-weight:bold;
}

.release-sub{
    margin-top:5px;
    color:#ddd;
    font-size:12px;
}

section{
    margin-bottom:18px;
}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .release-card{
        margin:0 14px;
        height:180px;
    }

    .release-title{
        font-size:18px;
    }

    .bottom-menu{
        height:66px;
    }

}

@media(max-width:380px){

    .anime-card{
        min-width:78px;
        height:116px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>

    <div class="header-icons">

        <div
            class="header-button"
            onclick="abrirPesquisa()">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path
                    d="M16 16l5 5">
                </path>

            </svg>

        </div>

        <div
            class="profile-button"
            onclick="abrirPerfil()">

            <img
                id="profileImage"
                alt="Foto de perfil">

            <svg
                id="profileIcon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    </div>

</header>

<div id="app"></div>

<div class="bottom-menu">

    <div
        class="menu-item menu-active"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">
            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
        </svg>

        <span>Início</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>
            <path d="M6 7h3M6 10h3M15 7h3M15 10h3"></path>
        </svg>

        <span>Mangás</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">
            <path d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z"></path>
        </svg>

        <span>Favoritos</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
        </svg>

        <span>Mais</span>

    </div>

</div>

<script>

/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href="perfil.html";

}

function abrirPesquisa(){

    alert("A pesquisa ainda está sendo preparada.");

}

const AVATAR_KEY =
    "berryanime_profile_avatar";


function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(AVATAR_KEY);

    const img =
        document.getElementById("profileImage");

    const icon =
        document.getElementById("profileIcon");

    if(imagem){

        img.src=imagem;
        img.style.display="block";
        icon.style.display="none";

    }

}


/* =====================================================
   API JIKAN
===================================================== */

const app =
    document.getElementById("app");

const API =
    "https://api.jikan.moe/v4";


async function api(endpoint){

    try{

        const resposta =
            await fetch(API + endpoint);

        if(!resposta.ok){

            console.log(
                "Jikan HTTP:",
                resposta.status,
                endpoint
            );

            return [];

        }

        const json =
            await resposta.json();

        return Array.isArray(json.data)
            ? json.data
            : [];

    }

    catch(erro){

        console.log(
            "Erro Jikan:",
            endpoint,
            erro
        );

        return [];

    }

}


/* =====================================================
   CACHE
===================================================== */

const CACHE_KEY =
    "berryanime_home_final_v1";


function salvarCache(dados){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
                time:Date.now(),
                data:dados
            })
        );

    }

    catch(e){

        console.log("Cache:",e);

    }

}


function lerCache(){

    try{

        const valor =
            localStorage.getItem(CACHE_KEY);

        if(!valor){

            return null;

        }

        const objeto =
            JSON.parse(valor);

        return objeto?.data || null;

    }

    catch(e){

        return null;

    }

}


/* =====================================================
   CAPA
===================================================== */

function imagemAnime(anime){

    return (
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.jpg?.image_url ||
        anime?.images?.jpg?.small_image_url ||
        ""
    );

}


/* =====================================================
   CARD NORMAL
===================================================== */

function smallCard(anime){

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(anime);

    if(!id || !imagem){

        return "";

    }

    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   CARD EPISÓDIO
===================================================== */

function episodeCard(anime){

    const id =
        anime?.mal_id;

    const imagem =
        imagemAnime(anime);

    if(!id || !imagem){

        return "";

    }

    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${id})">

            <img
                src="${imagem}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

            <div class="badge">
                NOVO
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${anime.title || "Anime"}
                </div>

                <div class="episode-sub">
                    Episódio recente
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   ABRIR DETALHES
===================================================== */

function abrirAnime(id){

    if(!id){

        return;

    }

    window.location.href =
        "detalhes.html?id=" + id;

}

 /* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function unicos(lista){

    const mapa =
        new Map();

    (lista || []).forEach(anime => {

        if(
            anime &&
            anime.mal_id
        ){

            mapa.set(
                anime.mal_id,
                anime
            );

        }

    });

    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   SECÇÃO NORMAL
   IMPORTANTE:
   NÃO usamos "usados".
   Cada secção pode ter os seus próprios animes.
===================================================== */

function criarSecao(nome,lista){

    const animes =
        unicos(lista).slice(0,10);

    if(!animes.length){

        return "";

    }

    return `

        <section>

            <div class="title-section">
                ${nome}
            </div>

            <div class="container">

                ${
                    animes
                    .map(smallCard)
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   SECÇÃO EPISÓDIOS
===================================================== */

function criarSecaoEpisodios(lista){

    const animes =
        unicos(lista).slice(0,8);

    if(!animes.length){

        return "";

    }

    return `

        <section>

            <div class="title-section">
                Novos episódios
            </div>

            <div class="container">

                ${
                    animes
                    .map(episodeCard)
                    .join("")
                }

            </div>

        </section>

    `;

}


/* =====================================================
   LANÇAMENTO
===================================================== */

function criarLancamento(lista){

    const anime =
        unicos(lista)[0];

    if(!anime){

        return "";

    }

    const id =
        anime.mal_id;

    const imagem =
        imagemAnime(anime);

    if(!id || !imagem){

        return "";

    }

    return `

        <section>

            <div class="title-section">
                Lançamentos
            </div>

            <div
                class="release-card"
                onclick="abrirAnime(${id})">

                <img
                    src="${imagem}"
                    alt="${anime.title || "Lançamento"}">

                <div class="release-gradient"></div>

                <div class="release-info">

                    <div class="release-label">
                        DESTAQUE
                    </div>

                    <div class="release-title">
                        ${anime.title || "Lançamento"}
                    </div>

                    <div class="release-sub">
                        Acompanhe no BerryAnime
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(dados){

    let html = "";


    /* =================================================
       1. EM ALTA
    ================================================= */

    html += criarSecao(
        "Em alta",
        dados.popular
    );


    /* =================================================
       2. NOVOS EPISÓDIOS
    ================================================= */

    html += criarSecaoEpisodios(
        dados.airing
    );


    /* =================================================
       3. MAIS BEM AVALIADOS
    ================================================= */

    html += criarSecao(
        "Mais bem avaliados",
        dados.score
    );


    /* =================================================
       4. AÇÃO
    ================================================= */

    html += criarSecao(
        "Ação",
        dados.action
    );


    /* =================================================
       5. COMÉDIA
    ================================================= */

    html += criarSecao(
        "Comédia",
        dados.comedy
    );


    /* =================================================
       6. SHOUNEN
    ================================================= */

    html += criarSecao(
        "Shounen",
        dados.shounen
    );


    /* =================================================
       7. SLICE OF LIFE
    ================================================= */

    html += criarSecao(
        "Slice of Life",
        dados.slice
    );


    /* =================================================
       8. VOCÊ VAI AMAR
    ================================================= */

    html += criarSecao(
        "Você vai amar",
        dados.popularExtra
    );


    /* =================================================
       9. LANÇAMENTOS
    ================================================= */

    html += criarLancamento(
        dados.airingExtra
    );


    /* =================================================
       10. ROMANCE
    ================================================= */

    html += criarSecao(
        "Romance",
        dados.romance
    );


    /* =================================================
       11. FANTASIA
    ================================================= */

    html += criarSecao(
        "Fantasia",
        dados.fantasy
    );


    /* =================================================
       12. TALVEZ VOCÊ GOSTE
    ================================================= */

    html += criarSecao(
        "Talvez você goste",
        dados.scoreExtra
    );


    /* =================================================
       13. MAIS CURTIDOS
    ================================================= */

    html += criarSecao(
        "Os mais curtidos de hoje!",
        dados.favorites
    );


    if(!html){

        html = `

            <div style="
                padding:60px 20px;
                text-align:center;
                color:#777;
            ">

                Não foi possível carregar
                os animes agora.

            </div>

        `;

    }


    app.innerHTML =
        html;

}


/* =====================================================
   BUSCAR UM GÉNERO DIRETAMENTE NA JIKAN
===================================================== */

async function buscarGenero(id){

    return await api(
        "/anime?genres=" +
        id +
        "&order_by=popularity&sort=asc&limit=12"
    );

}


/* =====================================================
   BUSCAR DADOS
===================================================== */

async function carregarDadosHome(){

    /*
     * IDs oficiais dos géneros MyAnimeList/Jikan:
     *
     * Action = 1
     * Comedy = 4
     * Fantasy = 10
     * Romance = 22
     * Shounen = 27
     * Slice of Life = 36
     */

    const dados = {

        popular:[],

        airing:[],

        score:[],

        action:[],

        comedy:[],

        shounen:[],

        slice:[],

        romance:[],

        fantasy:[],

        popularExtra:[],

        airingExtra:[],

        scoreExtra:[],

        favorites:[]

    };


    /*
     * PRIMEIRO BLOCO
     *
     * Apenas três pedidos.
     */

    const primeiro =
        await Promise.all([

            api(
                "/top/anime?filter=bypopularity&limit=25"
            ),

            api(
                "/seasons/now?limit=25"
            ),

            api(
                "/top/anime?limit=25"
            )

        ]);


    dados.popular =
        primeiro[0];

    dados.airing =
        primeiro[1];

    dados.score =
        primeiro[2];


    /*
     * Mostrar logo as primeiras secções.
     */

    construirHome(dados);


    /*
     * SEGUNDO BLOCO
     *
     * Géneros.
     *
     * Cada pedido é separado para evitar
     * sobrecarregar a Jikan ao mesmo tempo.
     */

    dados.action =
        await buscarGenero(1);

    construirHome(dados);


    dados.comedy =
        await buscarGenero(4);

    construirHome(dados);


    dados.shounen =
        await buscarGenero(27);

    construirHome(dados);


    dados.slice =
        await buscarGenero(36);

    construirHome(dados);


    dados.romance =
        await buscarGenero(22);

    construirHome(dados);


    dados.fantasy =
        await buscarGenero(10);

    construirHome(dados);


    /*
     * OUTRAS SECÇÕES
     */

    dados.popularExtra =
        dados.popular.slice(10,25);


    dados.scoreExtra =
        dados.score.slice(10,25);


    dados.airingExtra =
        dados.airing.slice(8,20);


    dados.favorites =
        dados.popular.slice(5,20);


    construirHome(dados);


    /*
     * Guardar tudo.
     */

    salvarCache(dados);

    return dados;

      }

      /* =====================================================
   ATUALIZAR HOME
===================================================== */

async function atualizarHome(){

    try{

        const dados =
            await carregarDadosHome();

        salvarCache(dados);

    }

    catch(error){

        console.log(
            "Erro ao atualizar Home:",
            error
        );

    }

}


/* =====================================================
   INICIAR HOME
===================================================== */

async function iniciarHome(){

    carregarFotoPerfil();


    /*
     * CACHE:
     *
     * Se já visitaste a Home antes,
     * as secções aparecem imediatamente.
     */

    const cache =
        lerCache();


    if(cache){

        construirHome(cache);

    }


    /*
     * Depois atualizamos os dados.
     */

    atualizarHome();

}


/* =====================================================
   QUANDO VOLTAR À HOME
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();


        const cache =
            lerCache();


        if(cache){

            construirHome(cache);

        }

    }
);


/* =====================================================
   FOTO DE PERFIL ALTERADA
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

iniciarHome();

</script>

</body>

</html>

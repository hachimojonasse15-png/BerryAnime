<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BerryAnime</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    background:#090909;
    color:#fff;
    min-height:100%;
}

body{
    padding-bottom:78px;
    overflow-x:hidden;
}

button{
    font:inherit;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#171717;
    box-shadow:0 3px 15px rgba(255,23,68,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn,
.profile-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:0;
    color:#fff;
    cursor:pointer;
}

.header-btn:active,
.profile-btn:active{
    background:#202020;
    transform:scale(.94);
}

.header-btn svg{
    width:25px;
    height:25px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.profile-btn{
    background:#171717;
    border:1px solid #303030;
    overflow:hidden;
}

.profile-btn img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.profile-btn svg{
    width:24px;
    height:24px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

#app{
    width:100%;
}

.section{
    margin:0 0 22px;
}

.section-title{
    font-size:22px;
    font-weight:700;
    margin:20px 15px 13px;
}

.row{
    display:flex;
    gap:11px;
    overflow-x:auto;
    padding:0 15px 3px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
}

.row::-webkit-scrollbar{
    display:none;
}

.card{
    width:92px;
    min-width:92px;
    height:136px;
    border-radius:8px;
    overflow:hidden;
    background:#171717;
    position:relative;
    flex-shrink:0;
    cursor:pointer;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#171717;
}

.card-title{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:28px 7px 7px;
    font-size:11px;
    line-height:14px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.92)
    );
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card.no-image{
    display:flex;
    align-items:flex-end;
    padding:8px;
    background:
        linear-gradient(
            145deg,
            #242424,
            #111
        );
}

.card.no-image .card-title{
    position:static;
    padding:0;
    background:none;
    white-space:normal;
}

.episode-card{
    width:270px;
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    background:#171717;
    position:relative;
    flex-shrink:0;
    cursor:pointer;
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 35%,
        rgba(0,0,0,.95)
    );
}

.episode-info{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
}

.episode-title{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    margin-top:4px;
    font-size:12px;
    color:#ddd;
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    padding:4px 7px;
    border-radius:5px;
    background:rgba(0,0,0,.7);
    font-size:10px;
    font-weight:700;
}

.release{
    margin:0 15px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    background:#171717;
    cursor:pointer;
}

.release img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.release-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.9),
        rgba(0,0,0,.35),
        rgba(0,0,0,.05)
    );
}

.release-info{
    position:absolute;
    left:18px;
    right:18px;
    bottom:18px;
}

.release-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    background:#ff1744;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

.release-name{
    font-size:20px;
    font-weight:700;
    max-width:80%;
}

.release-sub{
    color:#ddd;
    font-size:12px;
    margin-top:5px;
}

.loading-card{
    width:92px;
    min-width:92px;
    height:136px;
    border-radius:8px;
    background:
        linear-gradient(
            90deg,
            #151515 25%,
            #202020 50%,
            #151515 75%
        );
    background-size:200% 100%;
    animation:skeleton 1.2s infinite;
}

.loading-wide{
    width:270px;
    min-width:270px;
    height:160px;
    border-radius:9px;
    background:
        linear-gradient(
            90deg,
            #151515 25%,
            #202020 50%,
            #151515 75%
        );
    background-size:200% 100%;
    animation:skeleton 1.2s infinite;
}

@keyframes skeleton{
    0%{
        background-position:200% 0;
    }
    100%{
        background-position:-200% 0;
    }
}

.section-message{
    color:#777;
    font-size:15px;
    padding:8px 15px 10px;
}

.retry-btn{
    margin:4px 15px 10px;
    border:1px solid #333;
    background:#171717;
    color:#fff;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
}

.bottom-menu{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    z-index:1000;
    display:flex;
    background:#101010;
    border-top:1px solid #252525;
}

.menu-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#777;
    cursor:pointer;
}

.menu-item.active{
    color:#fff;
}

.menu-item svg{
    width:22px;
    height:22px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:11px;
}

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-btn,
    .profile-btn{
        width:40px;
        height:40px;
    }

    .section-title{
        font-size:21px;
        margin-left:14px;
    }

    .row{
        padding-left:14px;
        gap:10px;
    }

    .card{
        width:82px;
        min-width:82px;
        height:122px;
    }

    .loading-card{
        width:82px;
        min-width:82px;
        height:122px;
    }

    .episode-card{
        width:285px;
        min-width:285px;
        height:165px;
    }

    .loading-wide{
        width:285px;
        min-width:285px;
        height:165px;
    }

    .release{
        margin:0 14px;
        height:180px;
    }

    .release-name{
        font-size:18px;
    }

    .bottom-menu{
        height:66px;
    }
}

@media(max-width:380px){

    .card,
    .loading-card{
        width:78px;
        min-width:78px;
        height:116px;
    }

    .header{
        padding:0 12px;
    }

    .logo,
    .header-btn,
    .profile-btn{
        width:38px;
        height:38px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime"

<main id="app">

<nav class="bottom-menu">

    <div
        class="menu-item active"
        onclick="window.location.href='home.html'">

            <path d="M5 10v10h14V10"></path>
        </svg>

    </div>

        class="menu-item"
        onclick="window.location.href='mangas.html'">

            <path d="M13 4h7v16h-7z"></path>

        class="menu-item"

        <svg viewBox="0 0 24 24">

        </svg>

        <span>Favoritos</span>

    </div>

    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
        </svg>

        <span>Mais</span>

    </div>

</nav>

<script>
"use strict";

const API_BASE = "https://api.jikan.moe/v4";

const HOME_CACHE_KEY = "berryanime_home_new_v1";

const HOME_CACHE_TIME = 1000 * 60 * 60 * 6;

const PROFILE_KEY = "berryanime_profile_avatar";

const homeContent =
    document.getElementById("homeContent");

let apiLastRequest = 0;

let carregando = false;

let dadosHome = {
    popular: [],
    airing: [],
    score: [],
    favorites: []
};

function esperar(ms){
    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function escapar(valor){

    return String(valor || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function imagemAnime(anime){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.webp?.image_url ||
        anime?.images?.jpg?.image_url ||
        ""
    );
}

function tituloAnime(anime){

    return (
        anime?.title ||
        anime?.title_english ||
        anime?.title_japanese ||
        "Anime"
    );
}

function removerDuplicados(lista){

    const mapa = new Map();

    for(const anime of (lista || [])){

        if(anime?.mal_id){

            mapa.set(
                anime.mal_id,
                anime
            );

        }

    }

    return Array.from(mapa.values());
}

function todasCategorias(anime){

    return [

        ...(Array.isArray(anime?.genres)
            ? anime.genres
            : []),

        ...(Array.isArray(anime?.demographics)
            ? anime.demographics
            : [])

    ];
}

function pertenceGenero(anime, nome){

    const procurado =
        String(nome)
            .toLowerCase()
            .trim();

    return todasCategorias(anime)
        .some(item =>
            String(item?.name || "")
                .toLowerCase()
                .trim() === procurado
        );
}

function cacheSalvar(){

    try{

        localStorage.setItem(
            HOME_CACHE_KEY,
            JSON.stringify({
                time:Date.now(),
                data:dadosHome
            })
        );

    }catch(e){

        console.log(
            "Cache indisponível:",
            e
        );

    }
}

function cacheLer(){

    try{

        const bruto =
            localStorage.getItem(
                HOME_CACHE_KEY
            );

        if(!bruto){
            return null;
        }

        const objeto =
            JSON.parse(bruto);

        if(!objeto?.data){
            return null;
        }

        const idade =
            Date.now() -
            Number(objeto.time || 0);

        if(idade > HOME_CACHE_TIME){
            return null;
        }

        return objeto.data;

    }catch(e){

        return null;

    }
}

function mostrarLoading(){

    homeContent.innerHTML = `

        ${loadingSection("🔥 Em alta",false)}

        ${loadingSection("🆕 Novos episódios",true)}

        ${loadingSection("⭐ Mais bem avaliados",false)}

        ${loadingSection("⚔️ Ação",false)}

    `;
}

function loadingSection(titulo,wide){

    let cards = "";

    for(
        let i = 0;
        i < (wide ? 3 : 5);
        i++
    ){

        cards += wide
            ? `<div class="loading-wide"></div>`
            : `<div class="loading-card"></div>`;

    }

    return `

        <section class="section">

            <h2 class="section-title">
                ${titulo}
            </h2>

            <div class="row">
                ${cards}
            </div>

        </section>

    `;
}

/* =====================================================
   CONSTRUIR HOME
===================================================== */

function construirHome(dados){

    if(!dados) return;

    let html = "";

    html += section(
        "🔥 Em alta",
        dados.popular
    );

    html += episodeSection(
        "Novos episódios",
        dados.airing
    );

    html += section(
        "⭐ Mais bem avaliados",
        dados.score
    );

    html += section(
        "⚔️ Ação",
        dados.action
    );

    html += section(
        "😂 Comédia",
        dados.comedy
    );

    html += section(
        "🔥 Shounen",
        dados.shounen
    );

    html += section(
        "🌿 Slice of Life",
        dados.slice
    );

    html += section(
        "❤️ Você vai amar",
        dados.love
    );

    if(dados.release){

        html += releaseSection(
            dados.release
        );

    }

    html += section(
        "❤️ Romance",
        dados.romance
    );

    html += section(
        "✨ Fantasia",
        dados.fantasy
    );

    html += section(
        "Talvez você goste",
        dados.recommendations
    );

    html += section(
        "❤️ Os mais curtidos de hoje!",
        dados.favorites
    );


    if(!html.trim()){

        html = `
            <div style="
                text-align:center;
                padding:80px 20px;
                color:#777;
                font-size:16px;
            ">
                Nenhum anime encontrado.
            </div>
        `;

    }


    app.innerHTML = html;

}


/* =====================================================
   DADOS INICIAIS
===================================================== */

function dadosVazios(){

    return {

        popular: [],
        airing: [],
        score: [],

        action: [],
        comedy: [],
        shounen: [],
        slice: [],

        love: [],

        release: null,

        romance: [],
        fantasy: [],

        recommendations: [],
        favorites: []

    };

}


/* =====================================================
   BUSCAR ANIMES
===================================================== */

async function carregarHome(){

    console.log(
        "🍓 Iniciando carregamento da BerryAnime..."
    );


    const dados =
        dadosVazios();


    /*
     * Mostra a estrutura imediatamente.
     */

    construirHome(
        dados
    );


    /*
     * Cada grupo é carregado
     * independentemente.
     *
     * Assim, se uma requisição
     * falhar, as outras continuam.
     */

    const tarefas = [

        carregarPopulares(
            dados
        ),

        carregarAiring(
            dados
        ),

        carregarScore(
            dados
        ),

        carregarGeneros(
            dados
        )

    ];


    await Promise.allSettled(
        tarefas
    );


    /*
     * Favoritos e recomendações
     * usam os dados que já foram
     * carregados.
     */

    dados.favorites =
        dados.popular.slice(
            0,
            10
        );


    dados.love =
        dados.popular.slice(
            5,
            15
        );


    dados.recommendations =
        dados.score.slice(
            5,
            15
        );


    /*
     * Lançamento principal.
     */

    dados.release =
        dados.airing[0] ||
        dados.popular[0] ||
        dados.score[0] ||
        null;


    construirHome(
        dados
    );


    salvarCache(
        dados
    );


    console.log(
        "🍓 BerryAnime carregada.",
        dados
    );

}


/* =====================================================
   POPULARES
===================================================== */

async function carregarPopulares(
    dados
){

    try{

        const resultado =
            await apiSeguro(
                "/top/anime?filter=bypopularity&page=1&limit=20"
            );


        if(
            resultado.length
        ){

            dados.popular =
                resultado;

            construirHome(
                dados
            );

        }

    }

    catch(error){

        console.log(
            "Erro populares:",
            error
        );

    }

}


/* =====================================================
   ANIMES DA TEMPORADA
===================================================== */

async function carregarAiring(
    dados
){

    try{

        const resultado =
            await apiSeguro(
                "/seasons/now?page=1&limit=20"
            );


        if(
            resultado.length
        ){

            dados.airing =
                resultado;

            construirHome(
                dados
            );

        }

    }

    catch(error){

        console.log(
            "Erro temporada:",
            error
        );

    }

}


/* =====================================================
   MAIS BEM AVALIADOS
===================================================== */

async function carregarScore(
    dados
){

    try{

        const resultado =
            await apiSeguro(
                "/top/anime?page=1&limit=20"
            );


        if(
            resultado.length
        ){

            dados.score =
                resultado;

            construirHome(
                dados
            );

        }

    }

    catch(error){

        console.log(
            "Erro avaliações:",
            error
        );

    }

}


/* =====================================================
   GÉNEROS
===================================================== */

async function carregarGeneros(
    dados
){

    try{

        const universo = [];

        universo.push(
            ...dados.popular
        );

        universo.push(
            ...dados.airing
        );

        universo.push(
            ...dados.score
        );


        const unicos =
            removerDuplicados(
                universo
            );


        dados.action =
            porGenero(
                unicos,
                "Action"
            );


        dados.comedy =
            porGenero(
                unicos,
                "Comedy"
            );


        dados.shounen =
            porGenero(
                unicos,
                "Shounen"
            );


        dados.slice =
            porGenero(
                unicos,
                "Slice of Life"
            );


        dados.romance =
            porGenero(
                unicos,
                "Romance"
            );


        dados.fantasy =
            porGenero(
                unicos,
                "Fantasy"
            );


        construirHome(
            dados
        );

    }

    catch(error){

        console.log(
            "Erro géneros:",
            error
        );

    }

}


/* =====================================================
   CACHE
===================================================== */

function salvarCache(
    dados
){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:
                    Date.now(),

                data:
                    dados

            })
        );

    }

    catch(error){

        console.log(
            "Não foi possível guardar cache:",
            error
        );

    }

}


function lerCache(){

    try{

        const valor =
            localStorage.getItem(
                CACHE_KEY
            );


        if(!valor){

            return null;

        }


        const objeto =
            JSON.parse(
                valor
            );


        if(
            !objeto ||
            !objeto.data
        ){

            return null;

        }


        const idade =
            Date.now() -
            (
                objeto.time || 0
            );


        if(
            idade >
            CACHE_TIME
        ){

            return null;

        }


        return objeto.data;

    }

    catch(error){

        console.log(
            "Cache inválido:",
            error
        );

        return null;

    }

}


/* =====================================================
   INICIAR
===================================================== */

function iniciarHome(){

    carregarFotoPerfil();


    const cache =
        lerCache();


    if(cache){

        console.log(
            "🍓 Usando cache."
        );

        construirHome(
            cache
        );

    }


    /*
     * Não esperamos a API.
     * A Home abre primeiro.
     */

    carregarHome();

}


/* =====================================================
   EVENTOS
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();

    }
);


window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);

   INICIAR HOME
===================================================== */

iniciarHome();

</script>

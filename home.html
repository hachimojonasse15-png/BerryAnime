<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BerryAnime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#090909;
    color:white;
    padding-bottom:80px;
}

/* =====================================================
   TOPO
===================================================== */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

/* =====================================================
   LOGO
===================================================== */

.logo{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 12px rgba(255,64,84,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   ÍCONES
===================================================== */

.header-icons{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-button{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
    transition:.15s;
    overflow:hidden;
}

.header-button:active{
    background:#222;
    transform:scale(.94);
}

.header-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   PERFIL CIRCULAR
===================================================== */

.profile-button{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#181818;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
}

.profile-button:active{
    transform:scale(.92);
    border-color:#ff1744;
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:50%;
}

.profile-button svg{
    width:25px;
    height:25px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   TÍTULOS
===================================================== */

.title-section{
    font-size:21px;
    font-weight:bold;
    margin:20px 15px 12px;
}

/* =====================================================
   LISTAS
===================================================== */

.container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:0 15px;
    scrollbar-width:none;
    scroll-behavior:smooth;
}

.container::-webkit-scrollbar{
    display:none;
}

/* =====================================================
   CARDS
===================================================== */

.anime-card{
    min-width:92px;
    height:135px;
    border-radius:7px;
    overflow:hidden;
    background:#171717;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   EPISÓDIOS
===================================================== */

.episode-card{
    min-width:270px;
    height:160px;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.episode-shadow{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:85px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.65);
    padding:4px 8px;
    font-size:11px;
    border-radius:4px;
}

.episode-text{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
}

.episode-title{
    font-size:15px;
    font-weight:bold;
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.episode-sub{
    color:#ddd;
    font-size:12px;
    margin-top:4px;
}

/* =====================================================
   CÍRCULO DE CARREGAMENTO
===================================================== */

.home-loader{
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader-circle{
    width:40px;
    height:40px;
    border:3px solid #292929;
    border-top-color:#ff1744;
    border-right-color:#ff1744;
    border-radius:50%;
    animation:berrySpin .8s linear infinite;
}

@keyframes berrySpin{

    to{
        transform:rotate(360deg);
    }

}

/* =====================================================
   MENU INFERIOR
===================================================== */

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#101010;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.menu-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.menu-item svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-item span{
    font-size:12px;
}

.menu-active{
    color:white;
}

.menu-item:active{
    color:white;
}

section{
    margin-bottom:18px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 14px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .header-icons{
        gap:10px;
    }

    .header-button{
        width:40px;
        height:40px;
    }

    .header-button svg{
        width:23px;
        height:23px;
    }

    .profile-button{
        width:40px;
        height:40px;
    }

    .profile-button svg{
        width:23px;
        height:23px;
    }

    .title-section{
        font-size:20px;
        margin-left:14px;
    }

    .container{
        padding-left:14px;
        gap:10px;
    }

    .anime-card{
        min-width:82px;
        height:122px;
    }

    .episode-card{
        min-width:285px;
        height:165px;
    }

    .bottom-menu{
        height:66px;
    }

    .menu-item svg{
        width:20px;
        height:20px;
    }

    .menu-item span{
        font-size:11px;
    }
}

@media(max-width:380px){

    .header{
        padding:0 12px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .profile-button{
        width:38px;
        height:38px;
    }

    .header-button{
        width:38px;
        height:38px;
    }

    .anime-card{
        min-width:78px;
        height:116px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header class="header">

    <div class="logo">

        <img
            src="BerryAnime_logo_leve.jpg"
            alt="BerryAnime">

    </div>

    <div class="header-icons">

        <div
            class="header-button"
            onclick="abrirPesquisa()">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path
                    d="M16 16l5 5">
                </path>

            </svg>

        </div>

        <div
            class="profile-button"
            id="profileButton"
            onclick="abrirPerfil()">

            <img
                id="profileImage"
                alt="Foto de perfil">

            <svg
                id="profileIcon"
                viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="8"
                    r="4">
                </circle>

                <path
                    d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                </path>

            </svg>

        </div>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div id="app"></div>


<!-- =====================================================
     MENU INFERIOR
===================================================== -->

<div class="bottom-menu">

    <div
        class="menu-item menu-active"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>


    <div
        class="menu-item"
        onclick="window.location.href='mangas.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 4h7v16H4z"></path>
            <path d="M13 4h7v16h-7z"></path>
            <path d="M6 7h3M6 10h3M15 7h3M15 10h3"></path>

        </svg>

        <span>Mangás</span>

    </div>


    <div
        class="menu-item"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">

            <path
                d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>


    <div
        class="menu-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>

        </svg>

        <span>Mais</span>

    </div>

</div>


<script>

/* =====================================================
   PERFIL
===================================================== */

function abrirPerfil(){

    window.location.href =
        "perfil.html";

}


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    alert(
        "A pesquisa ainda está sendo preparada."
    );

}


/* =====================================================
   CHAVE DO PERFIL
===================================================== */

const AVATAR_KEY =
    "berryanime_profile_avatar";


/* =====================================================
   CARREGAR FOTO
===================================================== */

function carregarFotoPerfil(){

    const imagem =
        localStorage.getItem(
            AVATAR_KEY
        );

    const profileImage =
        document.getElementById(
            "profileImage"
        );

    const profileIcon =
        document.getElementById(
            "profileIcon"
        );


    if(
        imagem &&
        imagem.trim() !== ""
    ){

        profileImage.src =
            imagem;

        profileImage.style.display =
            "block";

        profileIcon.style.display =
            "none";

    }

    else{

        profileImage.removeAttribute(
            "src"
        );

        profileImage.style.display =
            "none";

        profileIcon.style.display =
            "block";

    }

}


/* =====================================================
   API JIKAN
===================================================== */

const app =
    document.getElementById("app");

const API =
    "https://api.jikan.moe/v4";


async function api(url){

    try{

        const res =
            await fetch(
                API + url
            );

        if(!res.ok){

            throw new Error(
                "Erro na API: " +
                res.status
            );

        }

        const data =
            await res.json();

        return data.data || [];

    }

    catch(e){

        console.log(
            "Erro:",
            e
        );

        return [];

    }

}


/* =====================================================
   ESPERAR
===================================================== */

function esperar(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   ANIMES JÁ USADOS
===================================================== */

const animesUsados =
    new Set();


/* =====================================================
   VERIFICAR ANIME
===================================================== */

function animeDisponivel(anime){

    if(
        !anime ||
        !anime.mal_id
    ){

        return false;

    }

    return !animesUsados.has(
        anime.mal_id
    );

}


/* =====================================================
   PEGAR ANIMES SEM REPETIR
===================================================== */

function pegarSemRepetir(
    lista,
    quantidade
){

    const resultado = [];

    for(
        const anime of lista
    ){

        if(
            animeDisponivel(anime)
        ){

            resultado.push(
                anime
            );

            animesUsados.add(
                anime.mal_id
            );

        }

        if(
            resultado.length >= quantidade
        ){

            break;

        }

    }

    return resultado;

}


/* =====================================================
   CARD NORMAL
===================================================== */

function smallCard(anime){

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        anime.images?.webp?.large_image_url ||
        anime.images?.webp?.image_url ||
        "";

    return `

        <div
            class="anime-card"
            onclick="abrirAnime(${anime.mal_id})">

            <img
                src="${image}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

        </div>

    `;

}


/* =====================================================
   ABRIR DETALHES
===================================================== */

function abrirAnime(id){

    window.location.href =
        "detalhes.html?id=" + id;

}


/* =====================================================
   CARD DE EPISÓDIO
===================================================== */

function episodeCard(
    anime,
    index
){

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        anime.images?.webp?.large_image_url ||
        anime.images?.webp?.image_url ||
        "";

    return `

        <div
            class="episode-card"
            onclick="abrirAnime(${anime.mal_id})">

            <img
                src="${image}"
                alt="${anime.title || "Anime"}"
                loading="lazy">

            <div class="badge">
                Dublado
            </div>

            <div class="episode-shadow"></div>

            <div class="episode-text">

                <div class="episode-title">
                    ${anime.title || "Novo episódio"}
                </div>

                <div class="episode-sub">
                    ${index + 1}. Novo episódio
                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   CRIAR SECÇÃO
===================================================== */

function section(
    name,
    content
){

    return `

        <section>

            <div class="title-section">
                ${name}
            </div>

            <div class="container">
                ${content}
            </div>

        </section>

    `;

}


/* =====================================================
   MOSTRAR CÍRCULO
===================================================== */

function mostrarLoader(){

    app.innerHTML = `

        <div class="home-loader">

            <div class="loader-circle"></div>

        </div>

    `;

}


/* =====================================================
   ESCONDER CÍRCULO
===================================================== */

function esconderLoader(){

    app.innerHTML = "";

}

/* =====================================================
   CARREGAR HOME
===================================================== */

async function loadAnime(){

    mostrarLoader();

    const inicio =
        Date.now();

    try{

        animesUsados.clear();


        /* =================================================
           1. EM ALTA
        ================================================= */

        const popular =
            await api(
                "/top/anime?filter=bypopularity"
            );

        await esperar(400);


        /* =================================================
           2. NOVOS EPISÓDIOS
        ================================================= */

        const airing =
            await api(
                "/seasons/now"
            );

        await esperar(400);


        /* =================================================
           3. MAIS BEM AVALIADOS
        ================================================= */

        const avaliados =
            await api(
                "/top/anime?filter=favorite"
            );

        await esperar(400);


        /* =================================================
           4. AÇÃO
        ================================================= */

        const action =
            await api(
                "/anime?genres=1&order_by=score&sort=desc"
            );

        await esperar(400);


        /* =================================================
           5. COMÉDIA
        ================================================= */

        const comedy =
            await api(
                "/anime?genres=4&order_by=score&sort=desc"
            );

        await esperar(400);


        /* =================================================
           6. SHOUNEN
        ================================================= */

        const shounen =
            await api(
                "/anime?genres=27&order_by=popularity&sort=asc"
            );

        await esperar(400);


        /* =================================================
           7. SLICE OF LIFE
        ================================================= */

        const sliceLife =
            await api(
                "/anime?genres=36&order_by=score&sort=desc"
            );

        await esperar(400);


        /* =================================================
           8. ROMANCE
        ================================================= */

        const romance =
            await api(
                "/anime?genres=22&order_by=score&sort=desc"
            );

        await esperar(400);


        /* =================================================
           9. FANTASIA
        ================================================= */

        const fantasy =
            await api(
                "/anime?genres=10&order_by=score&sort=desc"
            );

        await esperar(400);


        /* =================================================
           10. RECOMENDADOS
        ================================================= */

        const recomendados =
            await api(
                "/anime?order_by=popularity&sort=asc"
            );

        await esperar(400);


        /* =================================================
           11. MAIS CURTIDOS
        ================================================= */

        const maisCurtidos =
            await api(
                "/anime?order_by=favorites&sort=desc"
            );


        const tempoPassado =
            Date.now() - inicio;

        const restante =
            Math.max(
                0,
                2000 - tempoPassado
            );

        await esperar(
            restante
        );


        app.innerHTML = "";

        animesUsados.clear();


        /* =================================================
           1. EM ALTA
        ================================================= */

        const emAlta =
            pegarSemRepetir(
                popular,
                12
            );

        app.innerHTML +=
            section(
                "Em Alta",
                emAlta
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           2. NOVOS EPISÓDIOS
        ================================================= */

        const novosEpisodios =
            pegarSemRepetir(
                airing,
                10
            );

        app.innerHTML +=
            section(
                "Novos episódios",
                novosEpisodios
                    .map(episodeCard)
                    .join("")
            );


        /* =================================================
           3. MAIS BEM AVALIADOS
        ================================================= */

        const maisBemAvaliados =
            pegarSemRepetir(
                avaliados,
                12
            );

        app.innerHTML +=
            section(
                "Mais bem avaliados",
                maisBemAvaliados
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           4. AÇÃO
        ================================================= */

        const acao =
            pegarSemRepetir(
                action,
                12
            );

        app.innerHTML +=
            section(
                "Ação",
                acao
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           5. COMÉDIA
        ================================================= */

        const comedia =
            pegarSemRepetir(
                comedy,
                12
            );

        app.innerHTML +=
            section(
                "Comédia",
                comedia
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           6. SHOUNEN
        ================================================= */

        const shounenLista =
            pegarSemRepetir(
                shounen,
                12
            );

        app.innerHTML +=
            section(
                "Shounen",
                shounenLista
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           7. SLICE OF LIFE
        ================================================= */

        const slice =
            pegarSemRepetir(
                sliceLife,
                12
            );

        app.innerHTML +=
            section(
                "Slice of Life",
                slice
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           8. VOCÊ VAI AMAR
        ================================================= */

        const voceVaiAmar =
            pegarSemRepetir(
                avaliados,
                12
            );

        app.innerHTML +=
            section(
                "Você vai amar",
                voceVaiAmar
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           9. LANÇAMENTOS
        ================================================= */

        const lancamento =
            pegarSemRepetir(
                airing,
                1
            );

        app.innerHTML +=
            section(
                "Lançamentos",
                lancamento
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           10. ROMANCE
        ================================================= */

        const romanceLista =
            pegarSemRepetir(
                romance,
                12
            );

        app.innerHTML +=
            section(
                "Romance",
                romanceLista
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           11. FANTASIA
        ================================================= */

        const fantasia =
            pegarSemRepetir(
                fantasy,
                12
            );

        app.innerHTML +=
            section(
                "Fantasia",
                fantasia
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           12. TALVEZ VOCÊ GOSTE
        ================================================= */

        const talvez =
            pegarSemRepetir(
                recomendados,
                12
            );

        app.innerHTML +=
            section(
                "Talvez você goste",
                talvez
                    .map(smallCard)
                    .join("")
            );


        /* =================================================
           13. OS MAIS CURTIDOS
        ================================================= */

        const curtidos =
            pegarSemRepetir(
                maisCurtidos,
                12
            );

        app.innerHTML +=
            section(
                "Os mais curtidos de hoje!",
                curtidos
                    .map(smallCard)
                    .join("")
            );

    }

    catch(error){

        console.error(
            "Erro ao carregar a Home:",
            error
        );

        app.innerHTML = `

            <div style="
                text-align:center;
                padding:40px 20px;
                color:#aaa;
            ">

                Não foi possível carregar
                os animes.

                <br><br>

                Tente novamente.

            </div>

        `;

    }

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

carregarFotoPerfil();

loadAnime();


/* =====================================================
   ATUALIZAR FOTO QUANDO VOLTAR
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        carregarFotoPerfil();

    }
);


/* =====================================================
   STORAGE
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === AVATAR_KEY
        ){

            carregarFotoPerfil();

        }

    }
);

</script>

</body>

</html>
